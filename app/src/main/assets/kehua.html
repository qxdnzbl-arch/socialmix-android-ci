<script>
const BASE='https://nvwdtfnhsyfdopaxdylx.supabase.co';
const KEY='sb_publishable_S4IE-ziO7WQ_JAK9tuQGgQ_cszwKBWB';
const TOKEN_KEY='kehua_original_session_v1';
let token=localStorage.getItem(TOKEN_KEY)||'';
let currentTab=0,homeData=null,meData=null,chatTimer=null;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg=s=>typeof s==='string'&&/^data:image\/(jpeg|png|webp);base64,/i.test(s)?s:'';
const initials=s=>(String(s||'可').trim().slice(0,1)||'可');
function avatar(user,size=''){const img=safeImg(user&&user.avatar_data);return '<div class="avatar '+size+'">'+(img?'<img alt="" src="'+esc(img)+'">':esc(initials(user&&user.nickname)))+'</div>'}
function fmt(t){try{const d=new Date(t);return d.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return ''}}
function today(){return new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}
async function rpc(name,args={}){
 const res=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
 let j;try{j=await res.json()}catch{throw new Error('网络返回异常')}
 if(!res.ok)throw new Error((j&&j.message)||('请求失败 '+res.status));
 if(j&&j.ok===false){if(j.error==='登录已失效'){token='';localStorage.removeItem(TOKEN_KEY);renderAuth()}throw new Error(j.error||'操作失败')}
 return j;
}
function saveToken(t){token=t||'';if(token)localStorage.setItem(TOKEN_KEY,token);else localStorage.removeItem(TOKEN_KEY)}
function toast(msg){const d=document.createElement('div');d.textContent=msg;d.style.cssText='position:fixed;z-index:200;left:50%;bottom:110px;transform:translateX(-50%);background:#2d2d32;color:#fff;padding:10px 16px;border-radius:18px;font-size:13px;max-width:80%;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function renderAuth(mode='login'){
 app.innerHTML='<section class="auth"><div class="auth-brand"><div class="logo">可话~!</div><div class="tag">说 你 想 说 的 话</div></div><div class="auth-card"><div class="auth-tabs"><button class="auth-tab '+(mode==='login'?'active':'')+'" data-mode="login">回来看看</button><button class="auth-tab '+(mode==='register'?'active':'')+'" data-mode="register">第一次来</button></div><div id="authform"></div></div></section>';
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>renderAuth(b.dataset.mode));
 const f=document.getElementById('authform');
 if(mode==='register'){
  f.innerHTML='<input class="field" id="login" autocomplete="username" placeholder="账号：4–20位小写字母、数字或_"><input class="field" id="nick" maxlength="24" placeholder="昵称"><input class="field" id="pass" type="password" autocomplete="new-password" placeholder="密码：至少8位"><button class="primary" id="go">注册并进入可话</button><div class="error" id="err"></div>';
  document.getElementById('go').onclick=()=>authRegister();
 }else{
  f.innerHTML='<input class="field" id="login" autocomplete="username" placeholder="账号"><input class="field" id="pass" type="password" autocomplete="current-password" placeholder="密码"><button class="primary" id="go">登录</button><div style="text-align:right"><button class="linkbtn" id="recover">忘记密码？</button></div><div class="error" id="err"></div>';
  document.getElementById('go').onclick=()=>authLogin();document.getElementById('recover').onclick=renderRecover;
 }
}
async function authRegister(){
 const btn=document.getElementById('go'),err=document.getElementById('err');btn.disabled=true;err.textContent='';
 try{const j=await rpc('kehua_prod_register',{p_phone:document.getElementById('login').value,p_password:document.getElementById('pass').value,p_nickname:document.getElementById('nick').value});saveToken(j.token);showRecovery(j.recovery_code,'这是你的恢复码','保存它。忘记密码时需要它；生成新恢复码后，旧码会失效。',()=>boot())}catch(e){err.textContent=e.message}finally{btn.disabled=false}
}
async function authLogin(){
 const btn=document.getElementById('go'),err=document.getElementById('err');btn.disabled=true;err.textContent='';
 try{const j=await rpc('kehua_prod_login',{p_phone:document.getElementById('login').value,p_password:document.getElementById('pass').value});saveToken(j.token);boot()}catch(e){err.textContent=e.message}finally{btn.disabled=false}
}
function renderRecover(){
 app.innerHTML='<section class="auth"><div class="auth-brand" style="margin-bottom:38px"><div class="logo" style="font-size:36px">找回可话</div></div><div class="auth-card"><input class="field" id="login" placeholder="账号"><input class="field" id="rcode" autocapitalize="characters" placeholder="恢复码"><input class="field" id="newpass" type="password" placeholder="新密码：至少8位"><button class="primary" id="go">重置密码</button><button class="linkbtn" id="back">返回登录</button><div class="error" id="err"></div></div></section>';
 document.getElementById('back').onclick=()=>renderAuth('login');document.getElementById('go').onclick=async()=>{const b=document.getElementById('go'),e=document.getElementById('err');b.disabled=true;e.textContent='';try{const j=await rpc('kehua_prod_recover',{p_login:document.getElementById('login').value,p_recovery_code:document.getElementById('rcode').value,p_new_password:document.getElementById('newpass').value});saveToken(j.token);showRecovery(j.recovery_code,'密码已重置','这是新的恢复码，旧恢复码已经失效。',()=>boot())}catch(x){e.textContent=x.message}finally{b.disabled=false}}
}
function showRecovery(code,title,desc,onDone){
 const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="modal-card"><h3>'+esc(title)+'</h3><div class="muted" style="font-size:13px;line-height:1.6">'+esc(desc)+'</div><div class="code" id="recoveryCode">'+esc(code)+'</div><div class="modal-actions"><button class="copy">复制恢复码</button><button class="done">我已保存</button></div></div>';document.body.appendChild(m);
 m.querySelector('.copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);toast('已复制')}catch{toast('长按恢复码复制')}};m.querySelector('.done').onclick=()=>{m.remove();if(onDone)onDone()};
}
async function boot(){
 if(!token){renderAuth();return}
 try{meData=await rpc('kehua_prod_me',{p_token:token});renderShell();await switchTab(currentTab)}catch(e){if(!token)return;toast(e.message);renderAuth()}
}
function renderShell(){
 app.innerHTML='<div class="shell"><div id="screen"></div><nav class="nav"><button data-tab="0" aria-label="首页"><span class="pill">⌂</span></button><button data-tab="1" aria-label="消息"><span class="pill">◯</span></button><button data-tab="2" aria-label="我"><span class="pill">♙</span></button></nav></div>';
 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchTab(+b.dataset.tab));
}
async function switchTab(i){
 currentTab=i;document.querySelectorAll('.nav button').forEach((b,n)=>b.classList.toggle('active',n===i));
 const s=document.getElementById('screen');s.innerHTML='<div class="empty">加载中…</div>';
 try{if(i===0)await renderHome();else if(i===1)await renderMessages();else await renderMe()}catch(e){s.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
async function renderHome(){
 homeData=await rpc('kehua_prod_home',{p_token:token});const s=document.getElementById('screen');
 const my=homeData.my_posts||[],count=homeData.new_count||0;
 s.innerHTML='<main class="screen homebg"><div class="hero"><div class="date">'+esc(today())+'</div><h1>此刻，说你想说的话～</h1><div class="composer"><textarea id="postText" maxlength="1200" placeholder="我想说..."></textarea><div id="imagePreview"></div><div class="compose-foot"><div style="display:flex;gap:8px"><label class="filebtn" aria-label="添加图片">＋<input id="postImage" type="file" accept="image/jpeg,image/png,image/webp" hidden></label><label class="checkbox"><input type="checkbox" id="privatePost">仅自己可见</label></div><button class="roundbtn" id="publish">发布</button></div></div></div>'+(count?'<button class="notice" id="notice" style="width:100%;border:0;text-align:left"><div><b>共鸣已到达。请签收～！</b><div><span>'+count+' 条新的共鸣</span></div></div><span>查看 ›</span></button>':'')+'<div class="section-title">我说过的话</div><div id="myposts">'+(my.length?my.map(postCard).join(''):'<div class="empty">第一句话还在等你。</div>')+'</div></main>';
 document.getElementById('publish').onclick=publishPost;
 const fi=document.getElementById('postImage');fi.onchange=async()=>{if(!fi.files[0])return;try{const data=await imageToData(fi.files[0],1280,.82);fi.dataset.data=data;document.getElementById('imagePreview').innerHTML='<img class="postimg" src="'+esc(data)+'" alt="待发布图片">'}catch(e){toast(e.message);fi.value=''}};
 if(count)document.getElementById('notice').onclick=()=>openResonance(0);
 document.querySelectorAll('[data-delpost]').forEach(b=>b.onclick=async()=>{if(!confirm('删除这条内容？'))return;try{await rpc('kehua_prod_delete_post',{p_token:token,p_post_id:b.dataset.delpost});renderHome()}catch(e){toast(e.message)}});
}
function postCard(p){const img=safeImg(p.media_data);return '<article class="card"><div class="postbody">'+esc(p.content)+'</div>'+(img?'<img class="postimg" src="'+esc(img)+'" alt="">':'')+'<div class="meta"><span>'+esc(fmt(p.created_at))+(p.is_private?' · 仅自己':'')+'</span><span>'+(p.light_count?('♡ '+p.light_count):'')+' <button class="linkbtn" data-delpost="'+esc(p.id)+'" style="padding:0 4px">删除</button></span></div></article>'}
async function publishPost(){
 const b=document.getElementById('publish'),t=document.getElementById('postText'),f=document.getElementById('postImage');if(!t.value.trim()){toast('先写点想说的话');return}b.disabled=true;
 try{await rpc('kehua_prod_create_post',{p_token:token,p_content:t.value,p_media_data:f.dataset.data||null,p_private:document.getElementById('privatePost').checked});toast('已经说出去了');await renderHome()}catch(e){toast(e.message)}finally{b.disabled=false}
}
function imageToData(file,max,q){return new Promise((resolve,reject)=>{if(file.size>8*1024*1024)return reject(new Error('原图不能超过8MB'));const r=new FileReader();r.onerror=()=>reject(new Error('图片读取失败'));r.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('图片格式不支持'));im.onload=()=>{let w=im.width,h=im.height;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
async function openResonance(index){
 if(!homeData)homeData=await rpc('kehua_prod_home',{p_token:token});const list=(homeData.resonances||[]).filter(x=>x.status!=='dismissed');if(!list.length){toast('暂时没有新的共鸣');return}
 index=Math.max(0,Math.min(index,list.length-1));const r=list[index];if(r.status==='new'){try{await rpc('kehua_prod_open_resonance',{p_token:token,p_resonance_id:r.id});r.status='opened'}catch{}}
 const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="sheet"><div class="sheet-head"><button class="iconbtn" id="closeRes">×</button><div class="res-count">'+(index+1)+' / '+list.length+'</div><span style="width:44px"></span></div><div class="res-page"><div class="res-content">'+esc(r.content)+(safeImg(r.media_data)?'<img class="postimg" src="'+esc(r.media_data)+'" alt="">':'')+(r.status==='lit'&&r.nickname?'<div class="reveal"><div class="name">'+esc(r.nickname)+'</div><div class="muted" style="font-size:13px;margin-top:5px">你已经点亮了这份共鸣</div></div>':'')+'</div><div class="res-actions"><button class="dismiss" id="skip">'+(index<list.length-1?'下一条':'划过')+'</button><button class="light" id="light">'+(r.status==='lit'?'聊聊':'点亮')+'</button></div></div></div>';document.body.appendChild(o);
 o.querySelector('#closeRes').onclick=()=>{o.remove();renderHome()};
 o.querySelector('#skip').onclick=async()=>{if(r.status!=='lit'){try{await rpc('kehua_prod_dismiss_resonance',{p_token:token,p_resonance_id:r.id})}catch{}}o.remove();if(index<list.length-1)openResonance(index+1);else renderHome()};
 o.querySelector('#light').onclick=async()=>{if(r.status==='lit'&&r.author_id){o.remove();openChat(r.author_id);return}const b=o.querySelector('#light');b.disabled=true;try{const j=await rpc('kehua_prod_light',{p_token:token,p_post_id:r.id});r.status='lit';r.author_id=j.user.id;r.nickname=j.user.nickname;b.textContent='聊聊';const rc=o.querySelector('.res-content');rc.insertAdjacentHTML('beforeend','<div class="reveal"><div class="name">'+esc(j.user.nickname)+'</div><div class="muted" style="font-size:13px;margin-top:5px">你点亮了这份共鸣，现在可以直接开聊。</div></div>');b.disabled=false;b.onclick=()=>{o.remove();openChat(j.user.id)}}catch(e){toast(e.message);b.disabled=false}};
}
async function renderMessages(){
 const [th,fr,inc,lights]=await Promise.all([rpc('kehua_prod_threads',{p_token:token}),rpc('kehua_prod_friends',{p_token:token}),rpc('kehua_prod_incoming_friend_requests',{p_token:token}),rpc('kehua_prod_lights_received',{p_token:token})]);
 const s=document.getElementById('screen'),friends=fr.items||[],requests=inc.items||[],items=th.items||[],received=lights.items||[];
 s.innerHTML='<div class="topbar"><h2>消息</h2><span></span></div>'+(friends.length?'<div class="friend-strip">'+friends.map(u=>'<button class="friend-mini" data-chat="'+esc(u.id)+'" style="border:0;background:none">'+avatar(u)+'<div>'+esc(u.nickname)+'</div></button>').join('')+'</div>':'')+'<div class="list">'+(requests.length?'<div class="section-title">好友申请</div>'+requests.map(x=>'<div class="rowcard">'+avatar(x)+'<div class="grow"><div class="name">'+esc(x.nickname)+'</div><div class="preview">想加你为好友</div><div class="small-actions"><button class="accept" data-accept="'+esc(x.id)+'">接受</button><button class="reject" data-reject="'+esc(x.id)+'">忽略</button></div></div></div>').join(''):'')+(received.length?'<div class="section-title">点亮我的人</div>'+received.slice(0,8).map(x=>'<button class="rowcard" data-chat="'+esc(x.from_user_id)+'" style="width:100%;border-top:0;border-left:0;border-right:0;text-align:left">'+avatar(x)+'<div class="grow"><div class="name">'+esc(x.nickname)+'</div><div class="preview">点亮了：“'+esc(x.post_content).slice(0,40)+'”</div></div><span>›</span></button>').join(''):'')+'<div class="section-title">对话</div>'+(items.length?items.map(x=>'<button class="rowcard" data-chat="'+esc(x.id)+'" style="width:100%;border-top:0;border-left:0;border-right:0;text-align:left">'+avatar(x)+'<div class="grow"><div class="name">'+esc(x.nickname)+(x.is_friend?' · 好友':'')+'</div><div class="preview">'+esc(x.last_message||'已经可以聊天了')+'</div></div><span>›</span></button>').join(''):'<div class="empty">点亮共鸣后，对话会出现在这里。</div>')+'</div>';
 document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat));
 document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>respondFriend(b.dataset.accept,true));
 document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>respondFriend(b.dataset.reject,false));
}
async function respondFriend(id,accept){try{await rpc('kehua_prod_respond_friend_request',{p_token:token,p_request:id,p_accept:accept});toast(accept?'已成为好友':'已忽略');renderMessages()}catch(e){toast(e.message)}}
async function openChat(id){
 clearInterval(chatTimer);let data;try{data=await rpc('kehua_prod_chat',{p_token:token,p_other:id})}catch(e){toast(e.message);return}
 const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="sheet"><div class="sheet-head"><button class="iconbtn" id="back">‹</button><div style="text-align:center"><div class="name">'+esc(data.peer.nickname)+'</div><button class="linkbtn" id="friendBtn" style="padding:2px 4px">'+(data.is_friend?'已是好友':'加好友')+'</button></div><button class="iconbtn" id="more">···</button></div><div class="chat-wrap"><div class="messages" id="msgs"></div><div class="sendbar"><input id="msgInput" maxlength="2000" placeholder="说点什么…"><button id="send">发送</button></div></div></div>';document.body.appendChild(o);
 const renderMsgs=d=>{const box=o.querySelector('#msgs');box.innerHTML=(d.items||[]).map(m=>'<div class="bubble '+(m.from_id===meData.user.id?'mine':'theirs')+'">'+esc(m.body)+'</div>').join('');box.scrollTop=box.scrollHeight};
 renderMsgs(data);o.querySelector('#back').onclick=()=>{clearInterval(chatTimer);o.remove();if(currentTab===1)renderMessages()};
 const fb=o.querySelector('#friendBtn');if(!data.is_friend)fb.onclick=async()=>{try{await rpc('kehua_prod_friend_request',{p_token:token,p_other:id});fb.textContent='已发送申请';fb.disabled=true}catch(e){toast(e.message)}};
 o.querySelector('#more').onclick=()=>peerMenu(id);
 const send=async()=>{const inp=o.querySelector('#msgInput'),v=inp.value.trim();if(!v)return;const b=o.querySelector('#send');b.disabled=true;try{await rpc('kehua_prod_send_message',{p_token:token,p_to:id,p_body:v});inp.value='';data=await rpc('kehua_prod_chat',{p_token:token,p_other:id});renderMsgs(data)}catch(e){toast(e.message)}finally{b.disabled=false}};
 o.querySelector('#send').onclick=send;o.querySelector('#msgInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
 chatTimer=setInterval(async()=>{if(!document.body.contains(o)){clearInterval(chatTimer);return}try{const fresh=await rpc('kehua_prod_chat',{p_token:token,p_other:id});if((fresh.items||[]).length!==(data.items||[]).length){data=fresh;renderMsgs(data)}}catch{}},2500);
}
function peerMenu(id){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="modal-card"><h3>这段关系</h3><button class="primary" id="report" style="background:#f2f1f5;color:#555">举报</button><button class="primary" id="block" style="background:#fff0f2;color:#c44757">屏蔽</button><button class="linkbtn" id="cancel" style="width:100%">取消</button></div>';document.body.appendChild(m);m.querySelector('#cancel').onclick=()=>m.remove();m.querySelector('#report').onclick=async()=>{const reason=prompt('请填写举报原因');if(!reason)return;try{await rpc('kehua_prod_report',{p_token:token,p_user:id,p_post:null,p_reason:reason});toast('已提交');m.remove()}catch(e){toast(e.message)}};m.querySelector('#block').onclick=async()=>{if(!confirm('屏蔽后你们将不能继续互动。确定？'))return;try{await rpc('kehua_prod_block',{p_token:token,p_other:id});toast('已屏蔽');m.remove();document.querySelectorAll('.overlay').forEach(x=>x.remove());switchTab(1)}catch(e){toast(e.message)}}}
async function renderMe(){
 const [me,fr,home]=await Promise.all([rpc('kehua_prod_me',{p_token:token}),rpc('kehua_prod_friends',{p_token:token}),rpc('kehua_prod_home',{p_token:token})]);meData=me;const u=me.user,s=document.getElementById('screen');
 s.innerHTML='<div class="topbar"><h2>我</h2><span></span></div><section class="me-head"><div class="me-line">'+avatar(u)+'<div><div class="me-name">'+esc(u.nickname)+'</div><div class="muted" style="font-size:13px;margin-top:5px">@'+esc(u.login)+'</div><div class="muted" style="font-size:13px;margin-top:4px">'+esc(u.bio||'还没有写简介')+'</div></div></div><div class="stats"><div class="stat"><b>'+u.post_count+'</b><span>说过</span></div><div class="stat"><b>'+u.friend_count+'</b><span>好友</span></div></div></section><section class="panel"><div class="panel-row"><span>编辑资料</span><button id="edit">›</button></div><div class="panel-row"><span>我的恢复码</span><button id="recovery">重新生成</button></div><div class="panel-row"><span>退出登录</span><button id="logout">退出</button></div><div class="panel-row"><span class="danger">注销账号</span><button class="danger" id="deleteAccount">注销</button></div></section><div class="list"><div class="section-title">好友</div>'+(fr.items&&fr.items.length?fr.items.map(x=>'<button class="rowcard" data-chat="'+esc(x.id)+'" style="width:100%;border-top:0;border-left:0;border-right:0;text-align:left">'+avatar(x)+'<div class="grow"><div class="name">'+esc(x.nickname)+'</div><div class="preview">'+esc(x.bio||'')+'</div></div><span>›</span></button>').join(''):'<div class="empty">还没有好友。</div>')+'<div class="section-title">我说过的话</div>'+(home.my_posts||[]).map(postCard).join('')+'</div>';
 document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat));
 document.getElementById('edit').onclick=()=>editProfile(u);
 document.getElementById('recovery').onclick=async()=>{if(!confirm('生成新恢复码后，旧恢复码立即失效。继续？'))return;try{const j=await rpc('kehua_prod_rotate_recovery',{p_token:token});showRecovery(j.recovery_code,'新的恢复码','旧恢复码已经失效，请保存这一份。')}catch(e){toast(e.message)}};
 document.getElementById('logout').onclick=async()=>{try{await rpc('kehua_prod_logout',{p_token:token})}catch{}saveToken('');renderAuth()};
 document.getElementById('deleteAccount').onclick=async()=>{if(!confirm('确定永久注销账号？你的内容、聊天和好友关系都会删除。'))return;if(prompt('请输入“注销”确认')!=='注销')return;try{await rpc('kehua_prod_delete_account',{p_token:token});saveToken('');renderAuth();toast('账号已注销')}catch(e){toast(e.message)}};
 document.querySelectorAll('[data-delpost]').forEach(b=>b.onclick=async()=>{if(!confirm('删除这条内容？'))return;try{await rpc('kehua_prod_delete_post',{p_token:token,p_post_id:b.dataset.delpost});renderMe()}catch(e){toast(e.message)}});
}
function editProfile(u){
 const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="sheet"><div class="sheet-head"><button class="iconbtn" id="back">‹</button><b>编辑资料</b><button class="linkbtn" id="save">保存</button></div><div class="editbox"><div class="section-title">昵称</div><input class="field" id="nick" maxlength="24" value="'+esc(u.nickname)+'"><div class="section-title">简介</div><textarea class="field" id="bio" maxlength="120">'+esc(u.bio||'')+'</textarea><div class="section-title">地区</div><input class="field" id="region" maxlength="40" value="'+esc(u.region||'')+'"></div></div>';document.body.appendChild(o);o.querySelector('#back').onclick=()=>o.remove();o.querySelector('#save').onclick=async()=>{try{await rpc('kehua_prod_update_profile',{p_token:token,p_nickname:o.querySelector('#nick').value,p_bio:o.querySelector('#bio').value,p_gender:u.gender||'',p_region:o.querySelector('#region').value,p_avatar_data:u.avatar_data||null,p_background_data:u.background_data||null});o.remove();toast('已保存');renderMe()}catch(e){toast(e.message)}};
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/functions/v1/kehua-original-web/sw.js').catch(()=>{}))}
boot();
</script>
</body></html>
