  <style>
:root{--ink:#202124;--muted:#92959d;--line:#ececef;--paper:#fff;--soft:#f7f7f8;--accent:#ff3e68;--accent-soft:#fff0f5;--danger:#e24b4b;--ok:#2f9f70;--shadow:0 10px 30px rgba(25,25,30,.08);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Inter,system-ui,sans-serif;color:var(--ink);background:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff}button,input,textarea{font:inherit}button{border:0;background:none;color:inherit}.app-shell{min-height:100dvh;max-width:520px;margin:0 auto;background:#fff;position:relative;padding-bottom:78px}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(236,236,239,.7);position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);z-index:5}.brand{font-size:19px;font-weight:700;letter-spacing:.12em}.ghost{font-size:13px;color:var(--muted);padding:8px}.screen{padding:26px 22px 100px}.hero{padding-top:32px}.hero h1{font-size:30px;line-height:1.25;margin:0 0 8px;font-weight:750;letter-spacing:-.02em}.hero h1::after{content:"";display:inline-block;width:3px;height:31px;background:var(--accent);margin-left:4px;vertical-align:-5px;border-radius:3px}.hero p{margin:0 0 42px;color:#777b84;font-size:15px}.prompt{font-size:23px;line-height:1.3;font-weight:700;margin:0 0 16px}.composer{background:var(--soft);border-radius:22px;padding:18px 18px 14px}.composer textarea{border:0;outline:0;background:transparent;width:100%;resize:none;min-height:128px;font-size:17px;line-height:1.65;color:var(--ink)}.composer textarea::placeholder{color:#b6b8bf}.composer-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #e8e8eb;padding-top:12px}.counter{font-size:12px;color:#adb0b7}.primary{background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:650}.primary:disabled{opacity:.35}.accent{background:var(--accent);color:#fff}.notice{margin:18px 0;background:var(--accent-soft);border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.notice strong{font-size:14px}.notice span{font-size:12px;color:#9b5d72}.section-title{font-size:13px;color:#a0a3aa;margin:26px 2px 10px}.card{border:1px solid var(--line);border-radius:20px;padding:17px 18px;margin:10px 0;background:#fff}.card-body{white-space:pre-wrap;font-size:16px;line-height:1.65}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;color:var(--muted);font-size:12px}.row{display:flex;align-items:center;gap:10px}.row.between{justify-content:space-between}.pill{padding:7px 12px;border-radius:999px;background:var(--soft);font-size:12px}.pill.accent{background:var(--accent-soft);color:var(--accent)}.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:72px;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:8}.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#a2a5ad;font-size:11px}.tab b{font-size:19px;line-height:1}.tab.active{color:var(--ink)}.dot{width:6px;height:6px;background:var(--accent);border-radius:50%;position:absolute;margin-left:18px;margin-top:-15px}.empty{padding:70px 20px;text-align:center;color:#a2a5ad;line-height:1.8}.auth{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:34px 30px}.auth .logo{font-size:40px;font-weight:800;letter-spacing:.18em;margin-bottom:8px}.auth .sub{color:#92959d;margin-bottom:46px}.field{width:100%;border:0;border-bottom:1px solid var(--line);padding:15px 2px;outline:0;font-size:17px;margin-bottom:12px}.auth .primary{width:100%;margin-top:14px;padding:14px}.hint{font-size:12px;color:#a4a6ad;margin-top:18px;line-height:1.6}.profile-head{display:flex;gap:14px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#fff0f5,#f1f1f4);display:grid;place-items:center;font-size:22px;font-weight:750;color:var(--accent)}.profile-name{font-size:20px;font-weight:750}.profile-bio{color:var(--muted);font-size:13px;margin-top:4px}.link-btn{color:var(--accent);font-weight:650;padding:8px 0}.danger{color:var(--danger)}.chat{position:fixed;inset:0;background:#fff;z-index:20;max-width:520px;margin:0 auto;display:flex;flex-direction:column}.chat-head{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px}.chat-head button{padding:10px}.chat-title{font-weight:700;flex:1}.chat-body{flex:1;overflow:auto;padding:18px 14px}.bubble{max-width:78%;padding:10px 13px;border-radius:16px;margin:8px 0;background:var(--soft);line-height:1.55;white-space:pre-wrap}.bubble.me{margin-left:auto;background:var(--accent-soft)}.chat-send{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.chat-send input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 14px;outline:0}.toast{position:fixed;left:50%;bottom:94px;transform:translate(-50%,10px);background:rgba(26,26,28,.92);color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:80%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:30;display:grid;place-items:end center}.sheet{width:min(520px,100%);background:#fff;border-radius:24px 24px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}.sheet h3{margin:0 0 14px}.sheet .field{margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:12px}.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center}.divider{height:1px;background:var(--line);margin:16px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{padding:9px 12px;border-radius:999px;background:var(--soft);font-size:12px}.actions .hot{background:var(--accent-soft);color:var(--accent)}
@media(min-width:700px){body{background:#f5f5f6}.app-shell{min-height:100vh;box-shadow:0 0 50px rgba(20,20,26,.08)}.chat{left:50%;right:auto;width:520px;transform:translateX(-50%)}}

</style>
  <title>可话</title>
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module">
import { createClient } from './supabase.mjs';

const SUPABASE_URL = 'https://nvwdtfnhsyfdopaxdylx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_S4IE-ziO7WQ_JAK9tuQGgQ_cszwKBWB';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const app=document.querySelector('#app');
const toastEl=document.querySelector('#toast');

const state={session:null,user:null,tab:'home',profile:null,posts:[],resonances:[],conversations:[],requests:[],chat:null,chatMessages:[],friendPosts:[],modal:null,loading:false};
let subscriptions=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const when=v=>new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v));
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}
function setLoading(v){state.loading=v;render()}

async function boot(){
  const {data:{session}}=await supabase.auth.getSession();
  state.session=session;state.user=session?.user??null;
  if(state.user) await enter(); else render();
  supabase.auth.onAuthStateChange(async(_,session)=>{state.session=session;state.user=session?.user??null;if(state.user) await enter();else{cleanupSubs();render()}});
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
async function enter(){
  await ensureProfile();
  await refreshAll();
  setupRealtime();
  render();
}
async function ensureProfile(){
  const uid=state.user.id;
  let {data}=await supabase.from('orig_profiles').select('*').eq('user_id',uid).maybeSingle();
  if(!data){
    const nickname=state.user.user_metadata?.nickname || '可话er';
    const ins=await supabase.from('orig_profiles').insert({user_id:uid,nickname}).select().single();
    if(ins.error) throw ins.error; data=ins.data;
  }
  state.profile=data;
}
async function refreshAll(){await Promise.all([loadPosts(),loadResonances(),loadConversations(),loadRequests(),loadFriendPosts()])}
async function loadPosts(){const {data,error}=await supabase.from('orig_posts').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false}).limit(30);if(!error)state.posts=data||[]}
async function loadResonances(){
  const {data,error}=await supabase.from('orig_resonances').select('id,status,created_at,candidate_user_id,candidate_post_id,orig_posts!orig_resonances_candidate_post_id_fkey(id,content,created_at,user_id),orig_profiles!orig_resonances_candidate_user_id_fkey(user_id,nickname,avatar_url,bio)').eq('user_id',state.user.id).order('created_at',{ascending:false}).limit(50);
  if(!error) state.resonances=data||[];
}
async function loadConversations(){
  const {data,error}=await supabase.from('orig_conversations').select('*').or(`user_a.eq.${state.user.id},user_b.eq.${state.user.id}`).order('created_at',{ascending:false});
  if(error){state.conversations=[];return}
  const rows=data||[]; const ids=[...new Set(rows.map(c=>c.user_a===state.user.id?c.user_b:c.user_a))];
  let profiles=[]; if(ids.length){const q=await supabase.from('orig_profiles').select('user_id,nickname,avatar_url,bio').in('user_id',ids);profiles=q.data||[]}
  state.conversations=rows.map(c=>({...c,peer:profiles.find(p=>p.user_id===(c.user_a===state.user.id?c.user_b:c.user_a))||{nickname:'可话er'}}));
}
async function loadRequests(){const {data,error}=await supabase.from('orig_friend_requests').select('*').eq('to_user',state.user.id).eq('status','pending').order('created_at',{ascending:false});if(!error)state.requests=data||[]}
async function loadFriendPosts(){
  const uid=state.user.id;
  const rel=await supabase.from('orig_friendships').select('user_a,user_b').or(`user_a.eq.${uid},user_b.eq.${uid}`);
  if(rel.error){state.friendPosts=[];return}
  const ids=[...new Set((rel.data||[]).map(x=>x.user_a===uid?x.user_b:x.user_a))];
  if(!ids.length){state.friendPosts=[];return}
  const [posts,profiles]=await Promise.all([
    supabase.from('orig_posts').select('id,user_id,content,created_at').in('user_id',ids).eq('self_only',false).order('created_at',{ascending:false}).limit(20),
    supabase.from('orig_profiles').select('user_id,nickname').in('user_id',ids)
  ]);
  const names=new Map((profiles.data||[]).map(p=>[p.user_id,p.nickname]));
  state.friendPosts=(posts.data||[]).map(p=>({...p,nickname:names.get(p.user_id)||'好友'}));
}
function cleanupSubs(){subscriptions.forEach(ch=>supabase.removeChannel(ch));subscriptions=[]}
function setupRealtime(){
  cleanupSubs(); const uid=state.user.id;
  const res=supabase.channel(`orig-res-${uid}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'orig_resonances',filter:`user_id=eq.${uid}`},async()=>{await loadResonances();render();toast('共鸣已到达。请签收～！')}).subscribe();
  const req=supabase.channel(`orig-req-${uid}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'orig_friend_requests',filter:`to_user=eq.${uid}`},async()=>{await loadRequests();render();toast('收到新的好友申请')}).subscribe();
  subscriptions.push(res,req);
}
async function sendOtp(identity){
  identity=identity.trim();if(!identity)return toast('请输入手机号或邮箱');
  setLoading(true); let out;
  if(identity.startsWith('+')) out=await supabase.auth.signInWithOtp({phone:identity});
  else out=await supabase.auth.signInWithOtp({email:identity,options:{emailRedirectTo:location.origin+location.pathname}});
  setLoading(false); if(out.error)return toast(out.error.message); sessionStorage.setItem('kehua_identity',identity);state.modal='otp';render();toast('验证码已发送');
}
async function verifyOtp(identity,token){
  setLoading(true);let out;if(identity.startsWith('+'))out=await supabase.auth.verifyOtp({phone:identity,token,type:'sms'});else out=await supabase.auth.verifyOtp({email:identity,token,type:'email'});setLoading(false);if(out.error)toast(out.error.message)
}
async function publish(content){
  content=content.trim(); if(!content)return; if(content.length>1000)return toast('最多1000字');
  const {error}=await supabase.from('orig_posts').insert({user_id:state.user.id,content});if(error)return toast(error.message);await loadPosts();render();toast('已经说出去啦');
}
async function openResonance(id){await supabase.from('orig_resonances').update({status:'opened'}).eq('id',id);await loadResonances();render()}
async function lightResonance(r){
  await supabase.from('orig_resonances').update({status:'lit'}).eq('id',r.id);
  const pair=[state.user.id,r.candidate_user_id].sort();
  let {data}=await supabase.from('orig_conversations').select('*').or(`and(user_a.eq.${pair[0]},user_b.eq.${pair[1]}),and(user_a.eq.${pair[1]},user_b.eq.${pair[0]})`).maybeSingle();
  if(!data){const ins=await supabase.from('orig_conversations').insert({user_a:pair[0],user_b:pair[1]}).select().single();if(ins.error)return toast(ins.error.message);data=ins.data}
  await loadConversations();await openChat(data.id);toast('已经点亮，可以聊聊了');
}
async function openChat(id){
  const c=state.conversations.find(x=>x.id===id)||{id,peer:{nickname:'可话er'}};state.chat=c;
  const q=await supabase.from('orig_messages').select('*').eq('conversation_id',id).order('created_at',{ascending:true});state.chatMessages=q.data||[];
  const ch=supabase.channel(`chat-${id}-${Date.now()}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'orig_messages',filter:`conversation_id=eq.${id}`},payload=>{if(!state.chatMessages.some(m=>m.id===payload.new.id)){state.chatMessages.push(payload.new);render()}}).subscribe();subscriptions.push(ch);render();setTimeout(()=>document.querySelector('.chat-body')?.scrollTo(0,999999),20)
}
async function sendMessage(body){body=body.trim();if(!body||!state.chat)return;const {error}=await supabase.from('orig_messages').insert({conversation_id:state.chat.id,sender_id:state.user.id,body});if(error)toast(error.message)}
async function requestFriend(peerId){const {error}=await supabase.from('orig_friend_requests').insert({from_user:state.user.id,to_user:peerId});if(error)return toast(error.code==='23505'?'已经申请过啦':error.message);toast('好友申请已发送')}
async function respondRequest(id,accept){
  const req=state.requests.find(r=>r.id===id);if(!req)return;
  const status=accept?'accepted':'rejected';const up=await supabase.from('orig_friend_requests').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(up.error)return toast(up.error.message);
  if(accept){const pair=[req.from_user,req.to_user].sort();const ins=await supabase.from('orig_friendships').insert({user_a:pair[0],user_b:pair[1]});if(ins.error&&ins.error.code!=='23505')return toast(ins.error.message)}
  await Promise.all([loadRequests(),loadFriendPosts()]);render();toast(accept?'已经成为好友':'已拒绝');
}
async function updateProfile(nickname,bio){nickname=nickname.trim()||'可话er';bio=bio.trim();const {data,error}=await supabase.from('orig_profiles').update({nickname,bio,updated_at:new Date().toISOString()}).eq('user_id',state.user.id).select().single();if(error)return toast(error.message);state.profile=data;state.modal=null;render();toast('资料已更新')}
async function togglePost(id,key,value){const {error}=await supabase.from('orig_posts').update({[key]:value}).eq('id',id);if(error)return toast(error.message);await loadPosts();render()}
async function reportResonance(r){const reason=prompt('简单写一下举报原因');if(!reason)return;const {error}=await supabase.from('orig_reports').insert({reporter_id:state.user.id,reported_user_id:r.candidate_user_id,post_id:r.candidate_post_id,reason});if(error)return toast(error.message);toast('已提交举报')}
async function signOut(){await supabase.auth.signOut();state.session=null;state.user=null;state.profile=null;state.posts=[];state.resonances=[];state.conversations=[];state.requests=[];state.chat=null;cleanupSubs();render()}

function authView(){return `<main class="auth"><div class="logo">可话</div><div class="sub">说你想说的话</div><input id="identity" class="field" autocomplete="email" placeholder="手机号（含国家区号）或邮箱"><button class="primary accent" id="sendOtp" ${state.loading?'disabled':''}>${state.loading?'发送中…':'获取验证码'}</button><div class="hint">登录后，同一账号在不同设备上的记录、共鸣、聊天和好友会自动同步。</div></main>${state.modal==='otp'?otpSheet():''}`}
function otpSheet(){const identity=esc(sessionStorage.getItem('kehua_identity')||'');return `<div class="modal"><div class="sheet"><h3>输入验证码</h3><div class="small muted">已发送到 ${identity}</div><input id="otp" class="field" inputmode="numeric" maxlength="8" placeholder="验证码"><button class="primary accent" id="verifyOtp">确认登录</button></div></div>`}
function topbar(){return `<header class="topbar"><div class="brand">可话</div><button class="ghost" data-act="refresh">刷新</button></header>`}
function tabs(){const n=state.resonances.filter(r=>r.status==='new').length+state.requests.length;return `<nav class="tabbar"><button class="tab ${state.tab==='home'?'active':''}" data-tab="home"><b>⌂</b><span>首页</span></button><button class="tab ${state.tab==='messages'?'active':''}" data-tab="messages"><b>◌</b><span>消息</span>${n?'<i class="dot"></i>':''}</button><button class="tab ${state.tab==='me'?'active':''}" data-tab="me"><b>○</b><span>我的</span></button></nav>`}
function homeView(){const fresh=state.resonances.filter(r=>r.status==='new').length;return `<main class="screen"><section class="hero"><h1>说想说的话</h1><p>记录你真实的想法和感受</p><div class="prompt">此刻，<br>有什么想说～</div><div class="composer"><textarea id="composer" maxlength="1000" placeholder="在这里写下你的想法…"></textarea><div class="composer-foot"><span class="counter" id="counter">0 / 1000</span><button class="primary accent" id="publish" disabled>发表</button></div></div></section>${fresh?`<button class="notice" data-tab="messages"><div><strong>共鸣已到达。请签收～！</strong><br><span>有 ${fresh} 条新的共鸣</span></div><b>›</b></button>`:''}<div class="section-title">我说过的话</div>${state.posts.length?state.posts.map(postCard).join(''):`<div class="empty">说出第一句话后，<br>这里会留下你的记录。</div>`}</main>`}
function postCard(p){return `<article class="card"><div class="card-body">${esc(p.content)}</div><div class="meta"><span>${when(p.created_at)}</span><span>${p.self_only?'仅自己可见':p.is_pinned?'已置顶':''}</span></div><div class="actions"><button data-toggle-self="${p.id}" data-value="${p.self_only?'0':'1'}">${p.self_only?'恢复共鸣':'仅自己可见'}</button><button data-toggle-pin="${p.id}" data-value="${p.is_pinned?'0':'1'}">${p.is_pinned?'取消置顶':'置顶'}</button></div></article>`}
function friendPostCard(p){return `<article class="card"><div class="card-body">${esc(p.content)}</div><div class="meta"><span>${esc(p.nickname||'好友')}</span><span>${when(p.created_at)}</span></div></article>`}
function messagesView(){return `<main class="screen"><div class="section-title">好友最新动态</div>${state.friendPosts.length?state.friendPosts.map(friendPostCard).join(''):`<div class="empty" style="padding:25px">成为好友后，对方最新动态会出现在这里。</div>`}<div class="section-title">共鸣</div>${state.resonances.length?state.resonances.map(resCard).join(''):`<div class="empty">发出一句话后，<br>共鸣会在这里到达。</div>`}<div class="section-title">聊天</div>${state.conversations.length?state.conversations.map(c=>`<button class="card row between" style="width:100%;text-align:left" data-chat="${c.id}"><div><div style="font-weight:700">${esc(c.peer?.nickname||'可话er')}</div><div class="small muted">点开继续聊天</div></div><b>›</b></button>`).join(''):`<div class="empty" style="padding:25px">点亮一个共鸣，就能开启聊天。</div>`}${state.requests.length?`<div class="section-title">好友申请</div>${state.requests.map(r=>`<div class="card"><div>有人想和你成为好友</div><div class="actions"><button class="hot" data-accept="${r.id}">通过</button><button data-reject="${r.id}">拒绝</button></div></div>`).join('')}`:''}</main>`}
function resCard(r){const p=r.orig_posts||{};const prof=r.orig_profiles||{};return `<article class="card" data-open-res="${r.id}"><div class="card-body">${esc(p.content||'这条共鸣暂时不可见')}</div><div class="meta"><span>${esc(prof.nickname||'某个懂你的人')}</span><span>${when(r.created_at)}</span></div><div class="actions"><button class="hot" data-light="${r.id}">${r.status==='lit'?'已点亮':'点亮'}</button><button data-report="${r.id}">举报</button></div></article>`}
function meView(){return `<main class="screen"><div class="profile-head"><div class="avatar">${esc((state.profile?.nickname||'可')[0])}</div><div style="flex:1"><div class="profile-name">${esc(state.profile?.nickname||'可话er')}</div><div class="profile-bio">${esc(state.profile?.bio||'还没有写介绍')}</div></div><button class="link-btn" id="editProfile">编辑</button></div><div class="divider"></div><div class="row between"><span>我的记录</span><b>${state.posts.length}</b></div><div class="divider"></div><div class="row between"><span>点亮过的共鸣</span><b>${state.resonances.filter(r=>r.status==='lit').length}</b></div><div class="divider"></div><button class="link-btn danger" id="logout">退出登录</button></main>${state.modal==='profile'?profileSheet():''}`}
function profileSheet(){return `<div class="modal" id="modalBg"><div class="sheet"><h3>编辑资料</h3><input class="field" id="nickname" maxlength="24" value="${esc(state.profile?.nickname||'')}" placeholder="昵称"><input class="field" id="bio" maxlength="120" value="${esc(state.profile?.bio||'')}" placeholder="简单介绍一下自己"><button class="primary accent" id="saveProfile">保存</button></div></div>`}
function chatView(){if(!state.chat)return'';return `<section class="chat"><header class="chat-head"><button id="closeChat">‹</button><div class="chat-title">${esc(state.chat.peer?.nickname||'可话er')}</div><button class="link-btn" id="addFriend">加好友</button></header><div class="chat-body">${state.chatMessages.length?state.chatMessages.map(m=>`<div class="bubble ${m.sender_id===state.user.id?'me':''}">${esc(m.body)}</div>`).join(''):`<div class="empty">已经点亮彼此，<br>说句话吧～</div>`}</div><div class="chat-send"><input id="msg" maxlength="4000" placeholder="说点什么…"><button class="primary accent" id="sendMsg">发送</button></div></section>`}
function render(){
  if(!state.user){app.innerHTML=authView();bind();return}
  const body=state.tab==='home'?homeView():state.tab==='messages'?messagesView():meView();app.innerHTML=topbar()+body+tabs()+chatView();bind()
}
function bind(){
  document.querySelector('#sendOtp')?.addEventListener('click',()=>sendOtp(document.querySelector('#identity').value));
  document.querySelector('#verifyOtp')?.addEventListener('click',()=>verifyOtp(sessionStorage.getItem('kehua_identity')||'',document.querySelector('#otp').value.trim()));
  document.querySelectorAll('[data-tab]').forEach(x=>x.addEventListener('click',()=>{state.tab=x.dataset.tab;render()}));
  document.querySelector('[data-act="refresh"]')?.addEventListener('click',async()=>{await refreshAll();render();toast('已经刷新')});
  const comp=document.querySelector('#composer'); const pub=document.querySelector('#publish');
  comp?.addEventListener('input',()=>{document.querySelector('#counter').textContent=`${comp.value.length} / 1000`;pub.disabled=!comp.value.trim()});
  pub?.addEventListener('click',async()=>{const v=comp.value;pub.disabled=true;await publish(v)});
  document.querySelectorAll('[data-open-res]').forEach(x=>x.addEventListener('click',e=>{if(e.target.closest('button'))return;openResonance(x.dataset.openRes)}));
  document.querySelectorAll('[data-light]').forEach(x=>x.addEventListener('click',e=>{e.stopPropagation();const r=state.resonances.find(v=>v.id===x.dataset.light);if(r)lightResonance(r)}));
  document.querySelectorAll('[data-report]').forEach(x=>x.addEventListener('click',e=>{e.stopPropagation();const r=state.resonances.find(v=>v.id===x.dataset.report);if(r)reportResonance(r)}));
  document.querySelectorAll('[data-chat]').forEach(x=>x.addEventListener('click',()=>openChat(x.dataset.chat)));
  document.querySelector('#closeChat')?.addEventListener('click',()=>{state.chat=null;state.chatMessages=[];render()});
  document.querySelector('#sendMsg')?.addEventListener('click',()=>{const el=document.querySelector('#msg');const v=el.value;el.value='';sendMessage(v)});
  document.querySelector('#msg')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#sendMsg').click()}});
  document.querySelector('#addFriend')?.addEventListener('click',()=>requestFriend(state.chat.user_a===state.user.id?state.chat.user_b:state.chat.user_a));
  document.querySelectorAll('[data-accept]').forEach(x=>x.addEventListener('click',()=>respondRequest(x.dataset.accept,true)));
  document.querySelectorAll('[data-reject]').forEach(x=>x.addEventListener('click',()=>respondRequest(x.dataset.reject,false)));
  document.querySelector('#editProfile')?.addEventListener('click',()=>{state.modal='profile';render()});
  document.querySelector('#saveProfile')?.addEventListener('click',()=>updateProfile(document.querySelector('#nickname').value,document.querySelector('#bio').value));
  document.querySelector('#modalBg')?.addEventListener('click',e=>{if(e.target.id==='modalBg'){state.modal=null;render()}});
  document.querySelector('#logout')?.addEventListener('click',signOut);
  document.querySelectorAll('[data-toggle-self]').forEach(x=>x.addEventListener('click',()=>togglePost(x.dataset.toggleSelf,'self_only',x.dataset.value==='1')));
  document.querySelectorAll('[data-toggle-pin]').forEach(x=>x.addEventListener('click',()=>togglePost(x.dataset.togglePin,'is_pinned',x.dataset.value==='1')));
}

boot().catch(err=>{console.error(err);toast('加载失败，请稍后重试')});

</script>
</body>
</html>
