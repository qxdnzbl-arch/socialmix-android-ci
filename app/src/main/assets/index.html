.post{padding:18px 0;border-bottom:1px solid var(--line)}.post-body{font-size:16px;line-height:1.7;white-space:pre-wrap}.post-meta{font-size:11px;color:#a0a1a8;margin-top:9px;display:flex;justify-content:space-between}.post-actions{display:flex;gap:12px;margin-top:10px}.post-actions button{font-size:12px;color:#8e8f96;padding:0}

.res-screen{position:fixed;z-index:65;inset:0;max-width:520px;margin:auto;background:var(--paper);display:flex;flex-direction:column}.res-top{height:62px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}.res-close{width:34px;height:34px;border-radius:50%;background:#f1f1f5;font-size:25px;line-height:34px;color:#4e4f55}.res-count{font-size:12px;color:#a0a1a7}.res-content{flex:1;overflow:auto;padding:64px 34px 140px;font-size:20px;line-height:1.85;white-space:pre-wrap}.res-bottom{position:absolute;left:0;right:0;bottom:0;padding:16px 22px calc(18px + var(--safe));background:linear-gradient(180deg,rgba(255,255,255,0),#fff 28%)}.light-btn{margin-left:auto;display:flex;align-items:center;gap:7px;height:43px;padding:0 17px;border:3px solid #dedee5;border-radius:24px;background:#fff;font-size:14px;font-weight:600}.light-sun{font-size:22px;color:#f7c844}
.settings-list{margin-top:12px;background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.settings-row{width:100%;min-height:58px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--line);text-align:left}.settings-row:last-child{border:0}.settings-row span:last-child{margin-left:auto;color:#aaaab0}
.auth{min-height:100dvh;padding:70px 34px 44px;display:flex;flex-direction:column;background:#fff;color:#18181b}.auth-logo{font-size:72px;font-weight:900;font-style:italic;color:var(--pink);letter-spacing:-8px;line-height:1;margin-top:14vh}.auth-sub{font-size:18px;letter-spacing:7px;color:#98999f;margin:20px 0 auto;padding-left:5px}.field{width:100%;height:54px;border:0;border-bottom:1px solid #e7e7eb;background:transparent;outline:0;font-size:16px;margin:5px 0}.auth .primary{width:100%;height:52px;border-radius:26px;background:var(--pink);color:#fff;font-weight:750;margin-top:18px}.hint{font-size:11px;color:#a4a5aa;text-align:center;margin-top:14px;line-height:1.6}
.modal{position:fixed;z-index:90;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);background:#fff;color:#18181b;border-radius:24px 24px 0 0;padding:24px 22px calc(25px + var(--safe))}.sheet h3{margin:0 0 14px}.sheet .primary{width:100%;height:50px;border-radius:25px;background:var(--pink);color:#fff;font-weight:750;margin-top:12px}
.chat-body{flex:1;overflow:auto;padding:16px 14px;background:#fafafa}.bubble{max-width:78%;padding:10px 13px;border-radius:16px;margin:8px 0;background:#eeeef3;line-height:1.55;white-space:pre-wrap}.bubble.me{margin-left:auto;background:var(--purple);color:#fff}.chat-send{display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe));border-top:1px solid var(--line);background:var(--paper)}.chat-send input{flex:1;height:42px;border:0;border-radius:21px;background:#f1f1f4;padding:0 14px;outline:0}.chat-send button{padding:0 14px;color:var(--purple);font-weight:650}
.toast{position:fixed;z-index:120;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(28,28,32,.94);color:#fff;padding:9px 14px;border-radius:18px;font-size:13px;max-width:82%;text-align:center;opacity:0;pointer-events:none}.toast.show{opacity:1}@media(min-width:700px){body{background:#dddde2}.app-shell{box-shadow:0 0 45px rgba(20,20,30,.10)}}

<body>
  <div id="app" class="app-shell" aria-live="polite"><main class="auth"><div class="auth-logo">~!</div><div class="auth-sub">说你想说的话</div><input class="field" autocomplete="email" placeholder="手机号（含国家区号）或邮箱"><button class="primary">获取验证码</button><div class="hint">登录即表示你同意可话的服务与隐私规则<br>同一账号的数据会在不同设备同步</div></main></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.116.0';

const SUPABASE_URL = 'https://nvwdtfnhsyfdopaxdylx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_S4IE-ziO7WQ_JAK9tuQGgQ_cszwKBWB';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const app=document.querySelector('#app');
const toastEl=document.querySelector('#toast');

const state={session:null,user:null,tab:'home',profile:null,posts:[],resonances:[],conversations:[],requests:[],chat:null,chatMessages:[],friendPosts:[],modal:null,loading:false,selfOnly:false,resIndex:0};
let subscriptions=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const when=v=>new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v));
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}
function setLoading(v){state.loading=v;render()}

async function boot(){
  const {data:{session}}=await supabase.auth.getSession();
  state.session=session;state.user=session?.user??null;
  if(state.user) await enter(); else render();
  supabase.auth.onAuthStateChange(async(_,session)=>{state.session=session;state.user=session?.user??null;if(state.user) await enter();else{cleanupSubs();render()}});
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
async function enter(){
  await ensureProfile();
  await refreshAll();
  setupRealtime();
  render();
}
async function ensureProfile(){
  const uid=state.user.id;
  let {data}=await supabase.from('orig_profiles').select('*').eq('user_id',uid).maybeSingle();
  if(!data){
    const nickname=state.user.user_metadata?.nickname || '可话er';
    const ins=await supabase.from('orig_profiles').insert({user_id:uid,nickname}).select().single();
    if(ins.error) throw ins.error; data=ins.data;
  }
  state.profile=data;
}
async function refreshAll(){await Promise.all([loadPosts(),loadResonances(),loadConversations(),loadRequests(),loadFriendPosts()])}
async function loadPosts(){const {data,error}=await supabase.from('orig_posts').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false}).limit(30);if(!error)state.posts=data||[]}
async function loadResonances(){
  const {data,error}=await supabase.from('orig_resonances').select('id,status,created_at,candidate_user_id,candidate_post_id,orig_posts!orig_resonances_candidate_post_id_fkey(id,content,created_at,user_id),orig_profiles!orig_resonances_candidate_user_id_fkey(user_id,nickname,avatar_url,bio)').eq('user_id',state.user.id).order('created_at',{ascending:false}).limit(50);
  if(!error) state.resonances=data||[];
}
async function loadConversations(){
  const {data,error}=await supabase.from('orig_conversations').select('*').or(`user_a.eq.${state.user.id},user_b.eq.${state.user.id}`).order('created_at',{ascending:false});
  if(error){state.conversations=[];return}
  const rows=data||[]; const ids=[...new Set(rows.map(c=>c.user_a===state.user.id?c.user_b:c.user_a))];
  let profiles=[]; if(ids.length){const q=await supabase.from('orig_profiles').select('user_id,nickname,avatar_url,bio').in('user_id',ids);profiles=q.data||[]}
  state.conversations=rows.map(c=>({...c,peer:profiles.find(p=>p.user_id===(c.user_a===state.user.id?c.user_b:c.user_a))||{nickname:'可话er'}}));
}
async function loadRequests(){const {data,error}=await supabase.from('orig_friend_requests').select('*').eq('to_user',state.user.id).eq('status','pending').order('created_at',{ascending:false});if(!error)state.requests=data||[]}
async function loadFriendPosts(){
  const uid=state.user.id;
  const rel=await supabase.from('orig_friendships').select('user_a,user_b').or(`user_a.eq.${uid},user_b.eq.${uid}`);
  if(rel.error){state.friendPosts=[];return}
  const ids=[...new Set((rel.data||[]).map(x=>x.user_a===uid?x.user_b:x.user_a))];
  if(!ids.length){state.friendPosts=[];return}
  const [posts,profiles]=await Promise.all([
    supabase.from('orig_posts').select('id,user_id,content,created_at').in('user_id',ids).eq('self_only',false).order('created_at',{ascending:false}).limit(20),
    supabase.from('orig_profiles').select('user_id,nickname').in('user_id',ids)
  ]);
  const names=new Map((profiles.data||[]).map(p=>[p.user_id,p.nickname]));
  state.friendPosts=(posts.data||[]).map(p=>({...p,nickname:names.get(p.user_id)||'好友'}));
}
function cleanupSubs(){subscriptions.forEach(ch=>supabase.removeChannel(ch));subscriptions=[]}
function setupRealtime(){
  cleanupSubs(); const uid=state.user.id;
  const res=supabase.channel(`orig-res-${uid}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'orig_resonances',filter:`user_id=eq.${uid}`},async()=>{await loadResonances();render();toast('共鸣已到达。请签收～！')}).subscribe();
  const req=supabase.channel(`orig-req-${uid}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'orig_friend_requests',filter:`to_user=eq.${uid}`},async()=>{await loadRequests();render();toast('收到新的好友申请')}).subscribe();
  subscriptions.push(res,req);
}
async function sendOtp(identity){
  identity=identity.trim();if(!identity)return toast('请输入手机号或邮箱');
  setLoading(true); let out;
  if(identity.startsWith('+')) out=await supabase.auth.signInWithOtp({phone:identity});
  else out=await supabase.auth.signInWithOtp({email:identity,options:{emailRedirectTo:location.origin+location.pathname}});
  setLoading(false); if(out.error)return toast(out.error.message); sessionStorage.setItem('kehua_identity',identity);state.modal='otp';render();toast('验证码已发送');
}
async function verifyOtp(identity,token){
  setLoading(true);let out;if(identity.startsWith('+'))out=await supabase.auth.verifyOtp({phone:identity,token,type:'sms'});else out=await supabase.auth.verifyOtp({email:identity,token,type:'email'});setLoading(false);if(out.error)toast(out.error.message)
}
async function publish(content){
  content=content.trim(); if(!content)return; if(content.length>1000)return toast('最多1000字');
  const {error}=await supabase.from('orig_posts').insert({user_id:state.user.id,content,self_only:state.selfOnly});if(error)return toast(error.message);state.selfOnly=false;await loadPosts();render();toast('正在为你寻找共鸣～');
}
async function openResonance(id){await supabase.from('orig_resonances').update({status:'opened'}).eq('id',id);await loadResonances();render()}
async function lightResonance(r){
  await supabase.from('orig_resonances').update({status:'lit'}).eq('id',r.id);
  const pair=[state.user.id,r.candidate_user_id].sort();
  let {data}=await supabase.from('orig_conversations').select('*').or(`and(user_a.eq.${pair[0]},user_b.eq.${pair[1]}),and(user_a.eq.${pair[1]},user_b.eq.${pair[0]})`).maybeSingle();
  if(!data){const ins=await supabase.from('orig_conversations').insert({user_a:pair[0],user_b:pair[1]}).select().single();if(ins.error)return toast(ins.error.message);data=ins.data}
  await loadConversations();await openChat(data.id);toast('已经点亮，可以聊聊了');
}
async function openChat(id){
  const c=state.conversations.find(x=>x.id===id)||{id,peer:{nickname:'可话er'}};state.chat=c;
  const q=await supabase.from('orig_messages').select('*').eq('conversation_id',id).order('created_at',{ascending:true});state.chatMessages=q.data||[];
  const ch=supabase.channel(`chat-${id}-${Date.now()}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'orig_messages',filter:`conversation_id=eq.${id}`},payload=>{if(!state.chatMessages.some(m=>m.id===payload.new.id)){state.chatMessages.push(payload.new);render()}}).subscribe();subscriptions.push(ch);render();setTimeout(()=>document.querySelector('.chat-body')?.scrollTo(0,999999),20)
}
async function sendMessage(body){body=body.trim();if(!body||!state.chat)return;const {error}=await supabase.from('orig_messages').insert({conversation_id:state.chat.id,sender_id:state.user.id,body});if(error)toast(error.message)}
async function requestFriend(peerId){const {error}=await supabase.from('orig_friend_requests').insert({from_user:state.user.id,to_user:peerId});if(error)return toast(error.code==='23505'?'已经申请过啦':error.message);toast('好友申请已发送')}
async function respondRequest(id,accept){
  const req=state.requests.find(r=>r.id===id);if(!req)return;
  const status=accept?'accepted':'rejected';const up=await supabase.from('orig_friend_requests').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(up.error)return toast(up.error.message);
  if(accept){const pair=[req.from_user,req.to_user].sort();const ins=await supabase.from('orig_friendships').insert({user_a:pair[0],user_b:pair[1]});if(ins.error&&ins.error.code!=='23505')return toast(ins.error.message)}
  await Promise.all([loadRequests(),loadFriendPosts()]);render();toast(accept?'已经成为好友':'已拒绝');
}
async function updateProfile(nickname,bio){nickname=nickname.trim()||'可话er';bio=bio.trim();const {data,error}=await supabase.from('orig_profiles').update({nickname,bio,updated_at:new Date().toISOString()}).eq('user_id',state.user.id).select().single();if(error)return toast(error.message);state.profile=data;state.modal=null;render();toast('资料已更新')}
async function togglePost(id,key,value){const {error}=await supabase.from('orig_posts').update({[key]:value}).eq('id',id);if(error)return toast(error.message);await loadPosts();render()}
async function reportResonance(r){const reason=prompt('简单写一下举报原因');if(!reason)return;const {error}=await supabase.from('orig_reports').insert({reporter_id:state.user.id,reported_user_id:r.candidate_user_id,post_id:r.candidate_post_id,reason});if(error)return toast(error.message);toast('已提交举报')}
async function signOut(){await supabase.auth.signOut();state.session=null;state.user=null;state.profile=null;state.posts=[];state.resonances=[];state.conversations=[];state.requests=[];state.chat=null;cleanupSubs();render()}

function authView(){return `<main class="auth"><div class="auth-logo">~!</div><div class="auth-sub">说你想说的话</div><input id="identity" class="field" autocomplete="email" placeholder="手机号（含国家区号）或邮箱"><button class="primary" id="sendOtp" ${state.loading?'disabled':''}>${state.loading?'发送中…':'获取验证码'}</button><div class="hint">登录即表示你同意可话的服务与隐私规则<br>同一账号的数据会在不同设备同步</div></main>${state.modal==='otp'?otpSheet():''}`}
function otpSheet(){const identity=esc(sessionStorage.getItem('kehua_identity')||'');return `<div class="modal"><div class="sheet"><h3>输入验证码</h3><div style="font-size:12px;color:#92939a">已发送到 ${identity}</div><input id="otp" class="field" inputmode="numeric" maxlength="8" placeholder="验证码"><button class="primary" id="verifyOtp">确认登录</button></div></div>`}
function tabs(){
  const n=state.resonances.filter(r=>r.status==='new').length+state.requests.length;
  const home='<svg class="home-icon" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3l8.5 7.5v9A1.5 1.5 0 0 1 19 21H5a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M9.5 21v-6h5v6"/></svg>';
  const msg='<svg viewBox="0 0 24 24"><path d="M20.5 11.5a8.3 8.3 0 0 1-8.5 8 9.7 9.7 0 0 1-3.4-.6L4 21l1.4-4a7.7 7.7 0 0 1-1.9-5.1A8.3 8.3 0 0 1 12 4a8.3 8.3 0 0 1 8.5 7.5z"/></svg>';
  const me='<svg class="user-icon" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4"/><path d="M4.5 21c.6-5 3.1-7.5 7.5-7.5s6.9 2.5 7.5 7.5"/></svg>';
  return `<nav class="tabbar"><button aria-label="首页" class="tab ${state.tab==='home'?'active':''}" data-tab="home">${home}</button><button aria-label="消息" class="tab ${state.tab==='messages'?'active':''}" data-tab="messages">${msg}${n?'<i class="dot"></i>':''}</button><button aria-label="我的" class="tab ${state.tab==='me'?'active':''}" data-tab="me">${me}</button></nav>`
}
function homeView(){
  const fresh=state.resonances.filter(r=>r.status==='new').length;
  const ds=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date()).replace('周',' 星期');
  return `<main class="home-shell"><div class="home-stage"><div class="home-date">${ds}</div><div class="home-prompt">此刻，说你想说的话～</div><div class="composer"><textarea id="composer" maxlength="1000" aria-label="说你想说的话"></textarea><div class="compose-tools"><button class="tool" id="visibility">${state.selfOnly?'仅自己':'公开'}</button><span style="font-size:11px;color:var(--muted)" id="counter">0/1000</span><button class="send" id="publish" disabled>发表</button></div></div></div>${fresh?`<button class="res-notice" id="openRes"><span>共鸣已到达。请签收～！</span><span>›</span></button>`:''}</main>`
}
function postCard(p){return `<article class="post"><div class="post-body">${esc(p.content)}</div><div class="post-meta"><span>${when(p.created_at)}</span><span>${p.self_only?'仅自己可见':p.is_pinned?'已置顶':''}</span></div><div class="post-actions"><button data-toggle-self="${p.id}" data-value="${p.self_only?'0':'1'}">${p.self_only?'恢复共鸣':'仅自己'}</button><button data-toggle-pin="${p.id}" data-value="${p.is_pinned?'0':'1'}">${p.is_pinned?'取消置顶':'置顶'}</button></div></article>`}
function friendPostCard(p){return `<button class="friend-story" data-friend-post="${p.user_id}"><span class="story-ring"><span>${esc((p.nickname||'友')[0])}</span></span><span>${esc((p.nickname||'好友').slice(0,6))}</span></button>`}
function messagesView(){
  const latest=[]; const seen=new Set();
  state.friendPosts.forEach(p=>{if(!seen.has(p.user_id)){seen.add(p.user_id);latest.push(p)}});
  const chatRows=state.conversations.map(c=>`<button class="list-row" data-chat="${c.id}"><span class="avatar">${esc((c.peer?.nickname||'可')[0])}</span><span class="row-main"><span class="row-title">${esc(c.peer?.nickname||'可话er')}</span><span class="row-sub">点开继续聊天</span></span><span class="row-time">刚刚</span></button>`).join('');
  const people='<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.5-4 2.3-6 5.5-6s5 2 5.5 6"/><path d="M16 7h4M16 11h4M17 15h3"/></svg>';
  const bell='<svg viewBox="0 0 24 24"><path d="M6 17h12l-1.5-2.3V10a4.5 4.5 0 0 0-9 0v4.7z"/><path d="M10 20h4"/></svg>';
  return `<main class="page"><header class="page-head"><h1>消息</h1><div class="head-icons"><button class="head-icon" aria-label="好友">${people}</button><button class="head-icon" id="refresh" aria-label="刷新">${bell}</button></div></header>${latest.length?`<div class="friend-strip">${latest.map(friendPostCard).join('')}</div>`:''}<div class="chat-list">${chatRows||'<div class="empty">暂时还没有聊天</div>'}</div>${state.resonances.some(r=>r.status==='new')?`<div class="chat-list"><button class="list-row" id="openRes"><span class="avatar" style="color:#fff;background:var(--pink)">可</span><span class="row-main"><span class="row-title">新的共鸣</span><span class="row-sub">共鸣已到达。请签收～！</span></span><span class="row-time">›</span></button></div>`:''}${state.requests.length?`<div class="chat-list">${state.requests.map(r=>`<div class="list-row"><span class="avatar">友</span><span class="row-main"><span class="row-title">好友申请</span><span class="row-sub"><button style="color:var(--pink);margin-right:16px" data-accept="${r.id}">通过</button><button data-reject="${r.id}">拒绝</button></span></span></div>`).join('')}</div>`:''}</main>`
}
function meView(){
  const nick=state.profile?.nickname||'可话er';
  return `<main class="profile-page"><header class="profile-head"><h1>我的</h1><button class="gear" id="settings" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.5 1A7 7 0 0 0 14.7 6l-.4-2.6h-4.1L9.8 6a7 7 0 0 0-1.7 1.1l-2.5-1-2 3.4L5.6 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.5-1A7 7 0 0 0 9.8 18l.4 2.6h4.1l.4-2.6a7 7 0 0 0 1.7-1.1l2.5 1 2-3.4-2-1.5c.1-.3.1-.7.1-1z"/></svg></button></header><section class="profile-main"><div class="profile-top"><div class="big-avatar">${esc(nick[0])}</div><div><div class="profile-name">${esc(nick)}</div><div class="profile-bio">${esc(state.profile?.bio||'')}</div></div></div><div class="stats"><div><b>${state.posts.length}</b><span>记录</span></div><div><b>${state.resonances.filter(r=>r.status==='lit').length}</b><span>点亮</span></div></div><div class="profile-tabs"><span>我说过的</span></div>${state.posts.length?state.posts.map(postCard).join(''):'<div class="empty">还没有记录</div>'}</section></main>`
}
function profileSheet(){return `<div class="modal" id="modalBg"><div class="sheet"><h3>编辑个人资料</h3><input class="field" id="nickname" maxlength="24" value="${esc(state.profile?.nickname||'')}" placeholder="昵称"><input class="field" id="bio" maxlength="120" value="${esc(state.profile?.bio||'')}" placeholder="个性签名"><button class="primary" id="saveProfile">保存</button></div></div>`}
function settingsView(){return `<section class="subscreen"><header class="subhead"><button class="back" id="closeSub">‹</button><h2>设置</h2><span class="slot"></span></header><div class="settings-list"><button class="settings-row" id="editProfile"><span>编辑个人资料</span><span>›</span></button><button class="settings-row" id="theme"><span>深色模式</span><span>${document.body.classList.contains('dark')?'已开启':'›'}</span></button><button class="settings-row"><span>账号与安全</span><span>›</span></button><button class="settings-row"><span>隐私设置</span><span>›</span></button><button class="settings-row"><span>消息通知</span><span>›</span></button><button class="settings-row"><span>给可话反馈</span><span>›</span></button><button class="settings-row"><span>关于可话</span><span>›</span></button></div><div class="settings-list"><button class="settings-row" id="logout" style="color:#e55261"><span>退出登录</span></button></div></section>`}
function resonanceView(){
  const list=state.resonances.filter(r=>r.status!=='lit'); if(!list.length){state.modal=null;return''}
  state.resIndex=Math.min(state.resIndex,list.length-1); const r=list[state.resIndex],p=r.orig_posts||{};
  return `<section class="res-screen"><div class="res-top"><button class="res-close" id="closeSub" aria-label="关闭">×</button><span class="res-count">${state.resIndex+1} / ${list.length}</span></div><div class="res-content">${esc(p.content||'这条共鸣暂时不可见')}</div><div class="res-bottom"><button class="light-btn" data-light="${r.id}"><span class="light-sun">☀</span><span>点亮</span></button></div></section>`
}
function chatView(){if(!state.chat)return'';return `<section class="chat"><header class="subhead"><button class="back" id="closeChat">‹</button><h2>${esc(state.chat.peer?.nickname||'可话er')}</h2><button class="slot" id="addFriend" style="color:var(--pink);font-size:12px">加好友</button></header><div class="chat-body">${state.chatMessages.length?state.chatMessages.map(m=>`<div class="bubble ${m.sender_id===state.user.id?'me':''}">${esc(m.body)}</div>`).join(''):'<div class="empty">已经点亮彼此，<br>说句话吧～</div>'}</div><div class="chat-send"><input id="msg" maxlength="4000" placeholder="说点什么…"><button id="sendMsg">发送</button></div></section>`}
function subView(){if(state.modal==='settings')return settingsView();if(state.modal==='profile')return profileSheet();if(state.modal==='resonance')return resonanceView();return''}

function render(){
  if(!state.user){app.innerHTML=authView();bind();return}
  const body=state.tab==='home'?homeView():state.tab==='messages'?messagesView():meView();
  app.innerHTML=body+tabs()+chatView()+subView();bind()
}
function bind(){
  document.querySelector('#sendOtp')?.addEventListener('click',()=>sendOtp(document.querySelector('#identity').value));
  document.querySelector('#verifyOtp')?.addEventListener('click',()=>verifyOtp(sessionStorage.getItem('kehua_identity')||'',document.querySelector('#otp').value.trim()));
  document.querySelectorAll('[data-tab]').forEach(x=>x.addEventListener('click',()=>{state.tab=x.dataset.tab;state.modal=null;render()}));
  document.querySelector('#refresh')?.addEventListener('click',async()=>{await refreshAll();render();toast('已经刷新')});
  const comp=document.querySelector('#composer'),pub=document.querySelector('#publish');
  comp?.addEventListener('input',()=>{document.querySelector('#counter').textContent=`${comp.value.length}/1000`;pub.disabled=!comp.value.trim()});
  pub?.addEventListener('click',async()=>{const v=comp.value;pub.disabled=true;await publish(v)});
  document.querySelector('#visibility')?.addEventListener('click',()=>{state.selfOnly=!state.selfOnly;render();setTimeout(()=>document.querySelector('#composer')?.focus(),20)});
  document.querySelectorAll('#openRes').forEach(x=>x.addEventListener('click',()=>{state.modal='resonance';state.resIndex=0;render()}));
  document.querySelector('#nextRes')?.addEventListener('click',()=>{const n=state.resonances.filter(r=>r.status!=='lit').length;state.resIndex=(state.resIndex+1)%Math.max(1,n);render()});
  document.querySelectorAll('[data-light]').forEach(x=>x.addEventListener('click',()=>{const r=state.resonances.find(v=>v.id===x.dataset.light);if(r)lightResonance(r)}));
  document.querySelectorAll('[data-chat]').forEach(x=>x.addEventListener('click',()=>openChat(x.dataset.chat)));
  document.querySelector('#closeChat')?.addEventListener('click',()=>{state.chat=null;state.chatMessages=[];render()});
  document.querySelector('#sendMsg')?.addEventListener('click',()=>{const el=document.querySelector('#msg');const v=el.value;el.value='';sendMessage(v)});
  document.querySelector('#msg')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#sendMsg').click()}});
  document.querySelector('#addFriend')?.addEventListener('click',()=>requestFriend(state.chat.user_a===state.user.id?state.chat.user_b:state.chat.user_a));
  document.querySelectorAll('[data-accept]').forEach(x=>x.addEventListener('click',()=>respondRequest(x.dataset.accept,true)));
  document.querySelectorAll('[data-reject]').forEach(x=>x.addEventListener('click',()=>respondRequest(x.dataset.reject,false)));
  document.querySelector('#settings')?.addEventListener('click',()=>{state.modal='settings';render()});
  document.querySelector('#closeSub')?.addEventListener('click',()=>{state.modal=null;render()});
  document.querySelector('#editProfile')?.addEventListener('click',()=>{state.modal='profile';render()});
  document.querySelector('#saveProfile')?.addEventListener('click',()=>updateProfile(document.querySelector('#nickname').value,document.querySelector('#bio').value));
  document.querySelector('#modalBg')?.addEventListener('click',e=>{if(e.target.id==='modalBg'){state.modal=null;render()}});
  document.querySelector('#theme')?.addEventListener('click',()=>{const d=!document.body.classList.contains('dark');document.body.classList.toggle('dark',d);localStorage.setItem('kh_theme',d?'dark':'light');render()});
  document.querySelector('#logout')?.addEventListener('click',signOut);
  document.querySelectorAll('[data-toggle-self]').forEach(x=>x.addEventListener('click',()=>togglePost(x.dataset.toggleSelf,'self_only',x.dataset.value==='1')));
  document.querySelectorAll('[data-toggle-pin]').forEach(x=>x.addEventListener('click',()=>togglePost(x.dataset.togglePin,'is_pinned',x.dataset.value==='1')));
}
document.body.classList.toggle('dark',localStorage.getItem('kh_theme')==='dark');

boot().catch(err=>{console.error(err);toast('加载失败，请稍后重试')});

</script>
</body>
</html>
