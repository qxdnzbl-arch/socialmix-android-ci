<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>双机传</title>
<style>
:root{
  --ink:#1d2329;
  --muted:#7d8791;
  --accent:#6f86ec;
  --accent2:#7f96f4;
  --glass:rgba(255,255,255,.76);
  --glass-strong:rgba(255,255,255,.88);
  --line:rgba(43,53,62,.07);
  --shadow:0 12px 32px rgba(37,46,56,.10);
  --bg-blur:4px;
  --bg-dim:.16;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100vw;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"SF Pro Display","Segoe UI",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{background:linear-gradient(180deg,#f8f6f2 0%,#f1f4f7 52%,#eef2f6 100%)}
button,input,textarea{font:inherit}
button{touch-action:manipulation}
#app{height:100dvh;overflow:hidden;position:relative}
.wallpaper{position:absolute;inset:-12px;background-position:center;background-size:cover;filter:blur(var(--bg-blur)) saturate(1.06);transform:scale(1.04);opacity:0;transition:opacity .24s ease;pointer-events:none}
.wallpaper.on{opacity:1}
.veil{position:absolute;inset:0;background:rgba(248,248,246,var(--bg-dim));pointer-events:none}
.ambient{position:absolute;inset:0;background:radial-gradient(90% 44% at 12% 0%,rgba(255,223,207,.56),transparent 62%),radial-gradient(78% 55% at 100% 22%,rgba(204,220,255,.52),transparent 65%),linear-gradient(180deg,rgba(255,255,255,.2),rgba(241,244,248,.72));pointer-events:none}
.chat{position:relative;height:100%;display:flex;flex-direction:column;z-index:1}
.topbar{flex:0 0 auto;padding:max(30px,calc(env(safe-area-inset-top) + 8px)) 16px 11px;background:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.58));backdrop-filter:blur(22px) saturate(1.28);-webkit-backdrop-filter:blur(22px) saturate(1.28);border-bottom:1px solid rgba(65,75,84,.05)}
.toprow{display:flex;align-items:flex-start;gap:12px}
.titlebox{min-width:0;flex:1;padding:2px 0 0 2px}
.title{font-size:27px;line-height:1.15;font-weight:760;letter-spacing:-.75px}
.status{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;line-height:1.25;color:#5e8a76}
.status.warn{color:#a77a36}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 10%,transparent)}
.actions{display:flex;gap:8px;padding-top:0}
.circlebtn{width:39px;height:39px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.68);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 5px 18px rgba(47,56,65,.08);color:#3f4952;padding:0}
.circlebtn:active{transform:scale(.96);background:rgba(255,255,255,.92)}
.circlebtn svg{width:20px;height:20px;display:block}
.searchbar{display:flex;align-items:center;gap:7px;margin-top:11px;padding:8px 9px 8px 12px;border-radius:16px;background:rgba(255,255,255,.70);box-shadow:inset 0 0 0 1px rgba(44,53,62,.05);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.searchbar[hidden]{display:none}
.searchbox{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.searchbox svg{width:17px;height:17px;color:#7d8791;flex:0 0 auto}
.searchinput{width:100%;border:0;background:transparent;outline:none;font-size:14px;color:#242c33;padding:0}
.searchinput::placeholder{color:#9aa3ab}
.searchcount{min-width:30px;text-align:center;font-size:12px;color:#7d8791}
.searchnav,.searchclose{width:30px;height:30px;border:0;border-radius:10px;background:transparent;color:#5d6771;font-size:17px}
.searchnav:active,.searchclose:active{background:rgba(220,225,231,.68)}
.messages{flex:1;min-height:0;width:100%;max-width:100vw;overflow-y:auto;overflow-x:hidden;padding:16px 14px 20px;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.empty{text-align:center;color:#818b94;line-height:1.65;padding:84px 28px}
.row{display:flex;width:100%;min-width:0;margin-bottom:10px;overflow:hidden}
.row.mine{justify-content:flex-end}
.bubble{min-width:0;max-width:min(82%,calc(100vw - 52px));overflow:hidden;border-radius:22px;padding:11px 14px 10px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.52);box-shadow:0 5px 18px rgba(48,57,67,.055);backdrop-filter:blur(18px) saturate(1.16);-webkit-backdrop-filter:blur(18px) saturate(1.16);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mine .bubble{background:linear-gradient(145deg,rgba(100,128,235,.96),rgba(122,148,242,.96));border-color:rgba(255,255,255,.16);color:#fff;box-shadow:0 8px 24px rgba(89,112,205,.18)}
.message-text{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.48;font-size:15.5px;letter-spacing:.02px}
.meta{font-size:11.5px;color:#818a93;margin-top:5px}
.mine .meta{color:rgba(255,255,255,.76)}
.state{text-align:right;font-size:11px;color:rgba(255,255,255,.72);margin-top:6px}
.file-title{display:flex;align-items:center;gap:10px;min-width:0}
.file-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(111,134,236,.11);color:#6a82e7;flex:0 0 auto}
.file-icon svg{width:18px;height:18px}
.file-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:650}
.save{font-size:12px;color:#6682e9;margin-top:7px}
.match .bubble{box-shadow:0 0 0 2px rgba(235,177,83,.66),0 8px 24px rgba(48,57,67,.06)}
.active-match .bubble{box-shadow:0 0 0 3px rgba(223,151,44,.88),0 8px 24px rgba(48,57,67,.06)}
mark{background:#ffe7a7;color:inherit;border-radius:4px;padding:0 1px}
.mine mark{color:#27313a}
.composerwrap{flex:0 0 auto;padding:7px 11px max(8px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(246,248,250,0),rgba(246,248,250,.72) 18%,rgba(246,248,250,.92));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.composer{display:flex;align-items:flex-end;gap:7px;padding:6px 7px 6px 6px;border-radius:24px;background:rgba(255,255,255,.79);border:1px solid rgba(255,255,255,.64);box-shadow:0 9px 28px rgba(45,54,64,.10);backdrop-filter:blur(22px) saturate(1.22);-webkit-backdrop-filter:blur(22px) saturate(1.22)}
.attach,.send{width:40px;height:40px;flex:0 0 auto;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
.attach{background:rgba(231,235,240,.82);color:#4d5862;font-size:25px;line-height:1}
.send{background:linear-gradient(145deg,#6b83ea,#8095f1);color:#fff;box-shadow:0 4px 12px rgba(99,123,222,.25)}
.send svg{width:17px;height:17px}
.input{flex:1;min-width:0;min-height:40px;max-height:112px;border:0;background:transparent;padding:9px 6px 7px;outline:none;resize:none;line-height:1.45;color:#263038;font-size:15px}
.input::placeholder{color:#929ba4}
.ctx{position:fixed;z-index:160;display:flex;align-items:center;gap:2px;padding:5px;background:rgba(248,249,250,.90);border:1px solid rgba(255,255,255,.72);border-radius:16px;box-shadow:0 14px 38px rgba(28,35,42,.18);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);transform:translate(-50%,-100%)}
.ctx[hidden]{display:none}.ctx button{height:38px;border:0;border-radius:11px;background:transparent;padding:0 14px;color:#283139;font-size:14px;white-space:nowrap}.ctx button:active{background:rgba(220,225,231,.72)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(25,31,37,.88);color:#fff;padding:9px 14px;border-radius:18px;font-size:13px;z-index:180;pointer-events:none;opacity:0;transition:opacity .18s}.toast.show{opacity:1}
.sheetback{position:fixed;z-index:190;inset:0;background:rgba(20,25,30,.18);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:flex-end}.sheetback[hidden]{display:none}
.sheet{width:100%;padding:10px 18px max(18px,calc(env(safe-area-inset-bottom) + 14px));border-radius:28px 28px 0 0;background:rgba(249,249,248,.94);box-shadow:0 -18px 44px rgba(25,31,38,.12);backdrop-filter:blur(30px) saturate(1.28);-webkit-backdrop-filter:blur(30px) saturate(1.28)}
.grabber{width:38px;height:5px;border-radius:5px;background:#c9ced3;margin:0 auto 16px}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheettitle{font-size:21px;font-weight:720;letter-spacing:-.35px}.sheetclose{width:34px;height:34px;border:0;border-radius:50%;background:#e8ebee;color:#59636c;font-size:21px;display:flex;align-items:center;justify-content:center}
.primaryrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid rgba(52,62,71,.07)}
.rowlabel{font-size:15px;font-weight:620}.rowsub{font-size:12px;color:#8b949c;margin-top:3px}
.choosebg{height:40px;border:0;border-radius:14px;padding:0 15px;background:#e9edf9;color:#5f76d7;font-weight:650}.clearbg{height:36px;border:0;border-radius:12px;padding:0 12px;background:transparent;color:#b65f5f}.rangegroup{padding:15px 0 2px}.rangerow{display:grid;grid-template-columns:52px 1fr 42px;gap:10px;align-items:center;margin:12px 0}.rangerow label{font-size:14px}.rangerow output{font-size:12px;color:#8a939b;text-align:right}.rangerow input[type=range]{width:100%;accent-color:#768bec}.localnote{margin-top:12px;padding:11px 12px;border-radius:14px;background:rgba(230,234,240,.62);font-size:12px;line-height:1.5;color:#7f8992}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div id="wallpaper" class="wallpaper"></div><div id="veil" class="veil"></div><div class="ambient"></div></div>
<div id="contextMenu" class="ctx" hidden></div>
<div id="toast" class="toast"></div>
<div id="backgroundSheet" class="sheetback" hidden><div class="sheet"><div class="grabber"></div><div class="sheethead"><div class="sheettitle">聊天背景</div><button id="sheetClose" class="sheetclose">×</button></div><div class="primaryrow"><div><div class="rowlabel">照片</div><div class="rowsub">只使用你自己选择的照片</div></div><button id="chooseBackground" class="choosebg">选择照片</button></div><div id="clearRow" class="primaryrow"><div><div class="rowlabel">清除背景</div><div class="rowsub">恢复默认界面</div></div><button id="clearBackground" class="clearbg">清除</button></div><div class="rangegroup"><div class="rangerow"><label>模糊</label><input id="bgBlur" type="range" min="0" max="18" value="4"><output id="bgBlurOut">4</output></div><div class="rangerow"><label>柔化</label><input id="bgDim" type="range" min="6" max="42" value="16"><output id="bgDimOut">16%</output></div></div><div class="localnote">背景只保存在这台手机，不会同步到另一台，也没有任何预设背景。</div></div></div>
<script>
const app=document.getElementById('app');
const toast=document.getElementById('toast');
const ctx=document.getElementById('contextMenu');
const sheet=document.getElementById('backgroundSheet');
let last='',currentState=null,searchOpen=false,searchQuery='',searchIndex=0,searchMatches=[];
let longPressTimer=null,longPressFired=false,pressStartX=0,pressStartY=0;
const SEARCH_SVG='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.1" stroke="currentColor" stroke-width="2"/><path d="M15.1 15.1L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const MORE_SVG='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="12" r="1.7" fill="currentColor"/></svg>';
const SEND_SVG='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 18V6M7.5 10.5L12 6l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const FILE_SVG='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.2 12.7l5.7-5.7a3.2 3.2 0 114.5 4.5l-7.1 7.1a5 5 0 11-7.1-7.1l7.6-7.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function size(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
function get(){try{return JSON.parse(Android.getState())}catch(e){return{messages:[]}}}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('show'),1200)}
function searchable(m){return m.kind==='text'?String(m.text||''):String(m.fileName||'')}
function friendlyFileLabel(name){const n=String(name||'文件'),low=n.toLocaleLowerCase();if(/\.(jpe?g|png|gif|webp|bmp|heic|heif)$/.test(low)||/^(camera|img|screenshot|xhs)[_\-]/i.test(n))return '图片';if(/\.(mp4|mov|m4v|avi|mkv|webm)$/.test(low))return '视频';if(/\.(mp3|m4a|wav|aac|flac|ogg)$/.test(low))return '音频';if(/\.pdf$/.test(low))return 'PDF 文件';const b=n.replace(/^.*[\\/]/,'');return b.length<=34?b:b.slice(0,18)+'…'+b.slice(-10)}
function highlight(text,q){const raw=String(text??''),needle=String(q??'').trim();if(!needle)return esc(raw);const low=raw.toLocaleLowerCase(),find=needle.toLocaleLowerCase();let out='',pos=0,i;while((i=low.indexOf(find,pos))!==-1){out+=esc(raw.slice(pos,i))+'<mark>'+esc(raw.slice(i,i+needle.length))+'</mark>';pos=i+needle.length}return out+esc(raw.slice(pos))}
function statusInfo(s){if(s.linkState==='nearby')return['已直连',''];if(s.linkState==='relay')return['已同步',''];if(s.linkState==='permission')return['需要附近设备权限','warn'];if(s.linkState==='connecting')return['连接中',''];return['自动同步','']}
function hasBackgroundBridge(){try{return typeof Android.pickBackground==='function'&&typeof Android.getBackgroundVersion==='function'}catch(e){return false}}
function applyBackground(){const blur=Number(localStorage.getItem('bg_blur')||4),dim=Number(localStorage.getItem('bg_dim')||16);document.documentElement.style.setProperty('--bg-blur',blur+'px');document.documentElement.style.setProperty('--bg-dim',(dim/100).toFixed(2));const w=document.getElementById('wallpaper');let v=0;try{if(hasBackgroundBridge())v=Number(Android.getBackgroundVersion()||0)}catch(e){}if(v>0){w.style.backgroundImage="url('chat-background.jpg?v="+v+"')";w.classList.add('on')}else{w.style.backgroundImage='none';w.classList.remove('on')}const cr=document.getElementById('clearRow');if(cr)cr.style.display=v>0?'flex':'none'}
function refreshFromNative(){currentState=get();render(false,currentState);applyBackground()}
function copyText(text){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();showToast(ok?'已复制':'复制失败')}
function hideContext(){ctx.hidden=true;ctx.innerHTML=''}
function openSearch(){hideContext();searchOpen=true;searchQuery='';searchIndex=0;render(true,currentState);setTimeout(()=>document.getElementById('searchInput')?.focus(),30)}
function openBackgroundSheet(){if(!hasBackgroundBridge()){showToast('背景功能需要新版应用');return}hideContext();sheet.hidden=false;const blur=Number(localStorage.getItem('bg_blur')||4),dim=Number(localStorage.getItem('bg_dim')||16);document.getElementById('bgBlur').value=blur;document.getElementById('bgBlurOut').textContent=blur;document.getElementById('bgDim').value=dim;document.getElementById('bgDimOut').textContent=dim+'%';applyBackground()}
function closeBackgroundSheet(){sheet.hidden=true}
function showContext(row,m,x,y){hideContext();const actions=[];if(m.kind==='text')actions.push(['复制',()=>copyText(m.text||'')]);else actions.push(['复制文件名',()=>copyText(m.fileName||'')]);actions.push(['搜索',openSearch]);if(m.kind==='file'&&!m.mine)actions.unshift(['保存',()=>{Android.saveFile(m.id);showToast('正在保存')}]);actions.forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=e=>{e.stopPropagation();hideContext();fn()};ctx.appendChild(b)});ctx.hidden=false;const r=ctx.getBoundingClientRect(),vw=innerWidth,vh=innerHeight;ctx.style.left=Math.max(r.width/2+10,Math.min(vw-r.width/2-10,x))+'px';ctx.style.top=Math.max(r.height+12,Math.min(vh-70,y-8))+'px'}
function bindLongPress(row,m){const start=e=>{if(e.touches&&e.touches.length!==1)return;const p=e.touches?e.touches[0]:e;pressStartX=p.clientX;pressStartY=p.clientY;longPressFired=false;clearTimeout(longPressTimer);longPressTimer=setTimeout(()=>{longPressFired=true;showContext(row,m,pressStartX,pressStartY)},430)};const move=e=>{const p=e.touches?e.touches[0]:e;if(Math.abs(p.clientX-pressStartX)>12||Math.abs(p.clientY-pressStartY)>12)clearTimeout(longPressTimer)};const end=()=>clearTimeout(longPressTimer);row.addEventListener('touchstart',start,{passive:true});row.addEventListener('touchmove',move,{passive:true});row.addEventListener('touchend',end,{passive:true});row.addEventListener('touchcancel',end,{passive:true});row.addEventListener('contextmenu',e=>e.preventDefault())}
function render(force=false,stateOverride=null){const s=stateOverride||currentState||get();currentState=s;const js=JSON.stringify(s);if(!force&&js===last)return;last=js;const oldBox=document.getElementById('messages'),oldScroll=oldBox?{top:oldBox.scrollTop,atBottom:(oldBox.scrollHeight-oldBox.scrollTop-oldBox.clientHeight)<90}:null,oldInput=document.getElementById('message'),draft=oldInput?oldInput.value:'',focused=oldInput&&document.activeElement===oldInput;const q=searchQuery.trim(),messages=s.messages||[];searchMatches=q?messages.filter(m=>searchable(m).toLocaleLowerCase().includes(q.toLocaleLowerCase())).map(m=>m.id):[];if(searchIndex>=searchMatches.length)searchIndex=Math.max(0,searchMatches.length-1);const matchSet=new Set(searchMatches),activeId=searchMatches[searchIndex];const msgs=messages.map(m=>{const matched=q&&matchSet.has(m.id),active=matched&&activeId===m.id,label=friendlyFileLabel(m.fileName);const body=m.kind==='text'?'<div class="message-text">'+highlight(m.text,q)+'</div>':'<div class="file-title"><span class="file-icon">'+FILE_SVG+'</span><span class="file-label">'+highlight(label,q)+'</span></div><div class="meta">'+size(m.fileSize)+'</div>'+(m.mine?'':'<div class="save">保存到下载</div>');return '<div class="row '+(m.mine?'mine ':'')+(matched?'match ':'')+(active?'active-match ':'')+(m.kind==='file'?'file-row ':'')+'" data-id="'+esc(m.id)+'"><div class="bubble">'+body+(m.mine?'<div class="state">'+(m.status==='sent'?'已送达':'等待发送')+'</div>':'')+'</div></div>'}).join('');const [st,sc]=statusInfo(s);const search='<div class="searchbar" '+(searchOpen?'':'hidden')+'><div class="searchbox">'+SEARCH_SVG+'<input id="searchInput" class="searchinput" placeholder="搜索聊天" value="'+esc(searchQuery)+'"></div><span id="searchCount" class="searchcount">'+(q?(searchMatches.length?(searchIndex+1)+'/'+searchMatches.length:'0/0'):'')+'</span><button id="searchPrev" class="searchnav">↑</button><button id="searchNext" class="searchnav">↓</button><button id="searchClose" class="searchclose">×</button></div>';const bgButton=hasBackgroundBridge()?'<button id="backgroundToggle" class="circlebtn" aria-label="聊天背景">'+MORE_SVG+'</button>':'';app.innerHTML='<div id="wallpaper" class="wallpaper"></div><div id="veil" class="veil"></div><div class="ambient"></div><div class="chat"><div class="topbar"><div class="toprow"><div class="titlebox"><div class="title">我的两台手机</div><div class="status '+sc+'"><span class="dot"></span><span>'+st+'</span></div></div><div class="actions"><button id="searchToggle" class="circlebtn" aria-label="搜索">'+SEARCH_SVG+'</button>'+bgButton+'</div></div>'+search+'</div><div id="messages" class="messages">'+(msgs||'<div class="empty">两台手机之间的小空间。<br>直接发就好。</div>')+'</div><div class="composerwrap"><div class="composer"><button id="attach" class="attach">＋</button><textarea id="message" class="input" rows="1" placeholder="消息"></textarea><button id="send" class="send" aria-label="发送">'+SEND_SVG+'</button></div></div></div>';wire(messages,oldScroll,draft,focused);applyBackground();Android.reportUi('screen=chat messages='+messages.length+' ui='+s.uiVersion+' search='+searchMatches.length);reportGeometry()}
function wire(messages,oldScroll,draft,focused){const msg=document.getElementById('message');if(draft){msg.value=draft;growInput(msg)}if(focused)setTimeout(()=>{msg.focus();msg.setSelectionRange(msg.value.length,msg.value.length)},0);document.getElementById('send').onclick=send;document.getElementById('attach').onclick=()=>Android.pickFiles();msg.addEventListener('input',()=>growInput(msg));msg.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});const byId=new Map(messages.map(m=>[m.id,m]));document.querySelectorAll('.row').forEach(row=>{const m=byId.get(row.dataset.id);if(!m)return;bindLongPress(row,m);if(m.kind==='file'&&!m.mine)row.onclick=()=>{if(longPressFired){longPressFired=false;return}Android.saveFile(m.id)}});document.getElementById('searchToggle').onclick=openSearch;const bg=document.getElementById('backgroundToggle');if(bg)bg.onclick=openBackgroundSheet;if(searchOpen){const si=document.getElementById('searchInput');si.oninput=e=>{searchQuery=e.target.value;searchIndex=0;clearTimeout(si._t);si._t=setTimeout(()=>{render(true,currentState);setTimeout(()=>{const i=document.getElementById('searchInput');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}jumpToCurrent()},0)},90)};si.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();stepSearch(e.shiftKey?-1:1)}else if(e.key==='Escape'){searchOpen=false;searchQuery='';searchIndex=0;render(true,currentState)}};document.getElementById('searchPrev').onclick=()=>stepSearch(-1);document.getElementById('searchNext').onclick=()=>stepSearch(1);document.getElementById('searchClose').onclick=()=>{searchOpen=false;searchQuery='';searchIndex=0;render(true,currentState)}}const box=document.getElementById('messages');box.scrollLeft=0;box.addEventListener('scroll',()=>{if(box.scrollLeft!==0)box.scrollLeft=0;if(!ctx.hidden)hideContext()},{passive:true});if(searchOpen&&searchQuery.trim())jumpToCurrent();else if(oldScroll&&!oldScroll.atBottom)box.scrollTop=oldScroll.top;else box.scrollTop=box.scrollHeight}
function stepSearch(dir){if(!searchMatches.length){showToast('没有找到');return}searchIndex=(searchIndex+dir+searchMatches.length)%searchMatches.length;render(true,currentState);jumpToCurrent()}
function jumpToCurrent(){if(!searchMatches.length)return;const id=searchMatches[searchIndex],row=[...document.querySelectorAll('.row')].find(x=>x.dataset.id===id);row?.scrollIntoView({block:'center',behavior:'smooth'})}
function growInput(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,112)+'px'}
function send(){hideContext();const e=document.getElementById('message'),t=e.value.trim();if(!t)return;e.value='';e.style.height='';Android.sendText(t);setTimeout(refreshFromNative,60)}
function reportGeometry(){const c=document.querySelector('.composerwrap');if(!c)return;const vv=window.visualViewport;Android.reportLayout(vv?vv.height:innerHeight,c.getBoundingClientRect().bottom)}
document.getElementById('sheetClose').onclick=closeBackgroundSheet;sheet.onclick=e=>{if(e.target===sheet)closeBackgroundSheet()};document.getElementById('chooseBackground').onclick=()=>{try{Android.pickBackground()}catch(e){showToast('暂时无法选择照片')}};document.getElementById('clearBackground').onclick=()=>{try{Android.clearBackground();applyBackground()}catch(e){}};document.getElementById('bgBlur').oninput=e=>{localStorage.setItem('bg_blur',e.target.value);document.getElementById('bgBlurOut').textContent=e.target.value;applyBackground()};document.getElementById('bgDim').oninput=e=>{localStorage.setItem('bg_dim',e.target.value);document.getElementById('bgDimOut').textContent=e.target.value+'%';applyBackground()};document.addEventListener('touchstart',e=>{if(!ctx.hidden&&!ctx.contains(e.target)&&!e.target.closest('.row'))hideContext()},{passive:true});let queued=false;window.nativeRefresh=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;refreshFromNative()})};window.nativeBackgroundChanged=()=>{applyBackground();closeBackgroundSheet()};if(window.visualViewport)visualViewport.addEventListener('resize',()=>{document.getElementById('app').style.height=visualViewport.height+'px';setTimeout(reportGeometry,80)});currentState=get();render(true,currentState);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshFromNative()});
</script>
