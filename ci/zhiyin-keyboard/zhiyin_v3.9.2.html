<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#F4F5F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>知音 · 交互母版 v3.7</title>
<style>
:root{
  --bg:#F4F5F1;--card:#FFFFFF;--sunk:#EAEDE8;--ink:#252A28;--ink2:#5B6460;--ink3:#667069;--line:#E1E5DF;
  --lake:#46716B;--drop:#9CC4BD;--mist:#D6E6E2;--apricot:#F2DCD2;--sand:#EDE5D8;
  --sh:0 6px 24px rgba(37,42,40,.06);--cardline:transparent;--track:#DCE1DB;--onLake:#FFFFFF;
  --scrim:rgba(30,36,34,.30);--toast:#2C3230;--toastInk:#F4F5F1;--outer:#E4E8E3;--frame:#1F2423;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Source Han Serif CN","Noto Serif CJK SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",sans-serif;
  --st:max(env(safe-area-inset-top,0px),6px);--sb:max(env(safe-area-inset-bottom,0px),12px);
  --ease:cubic-bezier(.3,.7,.2,1);
}
[data-theme=dark]{
  --bg:#131716;--card:#1B201F;--sunk:#242A28;--ink:#E3E7E4;--ink2:#A0A9A5;--ink3:#8B9490;--line:#2A302E;
  --lake:#8FBFB7;--drop:#7FB2A9;--mist:#2C4541;--apricot:#5B423B;--sand:#3A352D;
  --sh:none;--cardline:#2A302E;--track:#353C3A;--onLake:#131716;
  --scrim:rgba(0,0,0,.55);--toast:#E3E7E4;--toastInk:#131716;--outer:#0C0F0E;--frame:#2A302E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--outer);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--lake);outline-offset:2px;border-radius:10px}
input,textarea{font:inherit;color:inherit}
p{margin:0}
#stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px}
#phone{position:relative;width:100vw;height:var(--vvh,100dvh);overflow:hidden;background:var(--bg);color:var(--ink);transition:background .4s}
#side{display:none}
.sbar{display:none}
@media (min-width:640px){
  #stage{padding:28px}
  #phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 9px var(--frame),0 40px 90px rgba(20,30,26,.22);--st:44px;--sb:20px}
  .sbar{display:flex;position:absolute;left:0;right:0;top:0;height:44px;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-size:14px;letter-spacing:.02em;color:var(--ink);z-index:40;pointer-events:none}
  .sbar i{display:inline-block;width:24px;height:11px;border:1.2px solid var(--ink2);border-radius:3px;position:relative;opacity:.8}
  .sbar i:after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:62%;background:var(--ink2);border-radius:1px}
  #side{display:flex;flex-direction:column;gap:14px;width:200px;color:var(--ink2);font-size:14px;line-height:1.7}
  #side h2{margin:0;font-weight:400;font-size:16px;color:var(--ink);letter-spacing:.06em}
  #side .sbtn{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 14px;border-radius:20px;background:var(--card);box-shadow:var(--sh);border:1px solid var(--cardline);font-size:14px;color:var(--ink)}
  #side .seg2{display:flex;gap:4px;padding:4px;border-radius:22px;background:var(--sunk)}
  #side .seg2 button{flex:1;height:32px;border-radius:16px;font-size:14px;color:var(--ink2)}
  #side .seg2 button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
}
/* screen */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.screen.push{animation:pushIn .34s var(--ease)}
.screen.pop{animation:popIn .3s var(--ease)}
.screen.fade{animation:fadeIn .25s ease}
@keyframes pushIn{from{transform:translateX(28px);opacity:.0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-18px);opacity:.0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--st) + 10px) 22px 8px;min-height:62px}
.hd .l,.hd .r{width:64px;min-height:44px;display:flex;align-items:center}
.hd .r{justify-content:flex-end}
.hd h1{margin:0;font-size:16px;font-weight:400;letter-spacing:.08em;color:var(--ink2);text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink2);border-radius:22px}
.hd .l .ib{margin-left:-12px}.hd .r .ib{margin-right:-11px}
.hd .who{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:0;padding-top:0;border-top:0;width:auto;font-size:16px;letter-spacing:.06em;color:var(--ink)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:0;height:0}
.pad{padding:6px 22px 28px}
/* nav */
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:4px 12px var(--sb);background:var(--bg)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:54px;font-size:16px;letter-spacing:.08em;color:var(--ink2)}
.nav button.on{color:var(--ink)}
.nav .dot{height:9px;display:block}
/* type */
.serif{font-family:var(--serif)}
.t-body{font-family:var(--serif);font-size:18px;line-height:1.9;letter-spacing:.02em;white-space:pre-wrap;word-break:break-word}
.t-body16{font-family:var(--serif);font-size:16px;line-height:1.8;letter-spacing:.02em;white-space:pre-wrap;word-break:break-word}
.t-sub{font-size:14px;color:var(--ink2);letter-spacing:.04em;line-height:1.6}
.t-tag{font-size:14px;color:var(--ink3);letter-spacing:.04em;line-height:1.6}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp6{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.label{font-size:14px;color:var(--ink3);letter-spacing:.1em;margin:22px 0 4px}
/* surfaces */
.card{background:var(--card);border-radius:26px;box-shadow:var(--sh);border:1px solid var(--cardline)}
.card.m{border-radius:20px}
.sunkbox{background:var(--sunk);border-radius:14px;padding:12px 14px}
.mistbox{background:var(--mist);border-radius:14px;padding:12px 14px}
.av{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--ink);position:relative}
.av.mist{background:var(--mist)}.av.apricot{background:var(--apricot)}.av.sand{background:var(--sand)}.av.sunk{background:var(--sunk)}
button.av{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);font-size:14px;letter-spacing:.06em;color:var(--ink2)}
.pill.on{color:var(--lake);border-color:color-mix(in srgb,var(--lake) 35%,var(--line))}
.btn{height:46px;border-radius:23px;padding:0 22px;font-size:16px;letter-spacing:.08em;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--lake);color:var(--onLake)}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--sunk);color:#A0453A}
[data-theme=dark] .btn.danger{color:#E59C90}
.btn.wide{width:100%}
.link{font-size:16px;letter-spacing:.08em;color:var(--ink2);padding:12px 14px;min-height:44px;display:inline-flex;align-items:center}
.link.lake{color:var(--lake)}
.softlink{font-size:14px;letter-spacing:.05em;color:var(--ink2);padding:10px 8px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.7}
.lakelink{font-size:14px;letter-spacing:.06em;color:var(--lake);min-height:44px;display:inline-flex;align-items:center}
/* toggles & chips */
.tg{width:44px;height:26px;border-radius:13px;background:var(--track);position:relative;flex:none;transition:background .25s}
.tg:after{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:#FFF;transition:transform .25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.08)}
[data-theme=dark] .tg:after{background:#E3E7E4}
.tg.on{background:var(--lake)}
.tg.on:after{transform:translateX(18px)}
[data-theme=dark] .tg.on:after{background:#131716}
.tgwrap{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);font-size:14px;letter-spacing:.04em;color:var(--ink2);background:transparent}
.chip.on{background:var(--mist);border-color:transparent;color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .rl{display:flex;flex-direction:column;gap:3px;min-width:0}
.row .rt{font-size:16px;letter-spacing:.04em;color:var(--ink)}
.row .rv{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56%}
.row.block{display:block}
.note{font-size:14px;color:var(--ink3);line-height:1.7;letter-spacing:.03em}
/* empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:44px 22px;color:var(--ink2);font-size:16px;letter-spacing:.06em;line-height:1.8}
.empty.tall{min-height:58vh}
.empty .ttl{font-family:var(--serif);font-size:18px;color:var(--ink);letter-spacing:.06em}
/* write */
.write-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.write-scroll{flex:1;padding:calc(var(--st) + 22px) 30px 16px}
#w-text{width:100%;border:0;outline:0;resize:none;background:transparent;padding:0;margin:0;font-family:var(--serif);font-size:18px;line-height:1.85;letter-spacing:.03em;color:var(--ink);caret-color:var(--lake);min-height:40vh;display:block}
#w-text::placeholder{color:var(--ink3)}
.wbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 18px calc(var(--sb) + 4px) 14px;animation:fadeIn .35s ease;position:relative}
.wbar .tools{display:flex;gap:0}
.wbar .tools button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.wbar .tools button:disabled{opacity:.3;cursor:default}
.wbar .rightside{display:flex;align-items:center;gap:6px}
.vislab{font-size:14px;color:var(--ink2);letter-spacing:.04em;display:flex;align-items:center;gap:2px;min-height:44px;padding:0 6px}
.send{width:48px;height:48px;border-radius:50%;background:var(--sunk);display:flex;align-items:center;justify-content:center}
.send:disabled{opacity:.45;cursor:default}
.breathe{animation:breathe 3.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.04)}}
.visbub{position:absolute;right:16px;bottom:calc(100% + 4px);width:224px;padding:6px 16px;border-radius:20px;background:var(--card);box-shadow:0 10px 36px rgba(37,42,40,.12);border:1px solid var(--cardline);animation:bubIn .22s var(--ease);z-index:5}
.visbub .row{min-height:50px}.visbub .row:last-child{border-bottom:0}
@keyframes bubIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.att{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tile{position:relative;border-radius:14px;aspect-ratio:1;overflow:hidden}
.tile.big{aspect-ratio:4/3}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.tile .x{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink2);opacity:.92}
.tile .more{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(37,42,40,.32);color:#fff;font-size:14px;letter-spacing:.1em}
.tile.add{border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink3);background:transparent}
.imgs2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.vid{position:relative;border-radius:20px;aspect-ratio:16/10;background:var(--mist);overflow:hidden}
.vid .play{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.vid .dur{position:absolute;right:12px;bottom:10px;font-size:14px;color:var(--ink);opacity:.75}
.voice{background:var(--sunk);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.voice .wv{display:flex;align-items:center;gap:10px}
.voice .pb{width:30px;height:30px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.bars{display:flex;align-items:center;gap:2px;height:20px}
.bars i{display:block;width:2px;border-radius:1px;background:var(--lake);opacity:.7}
.wcard{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:16px;padding:10px 12px;position:relative}
.cover{flex:none;border-radius:6px;background:var(--sand);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.cover.song{width:42px;height:42px}.cover.tall{width:32px;height:44px}.cover.wide{width:54px;height:32px}
.wcard .ct{font-size:14px;color:var(--ink);letter-spacing:.03em}
.wcard .cq{font-size:14px;color:var(--ink2);margin-top:2px}
.wcard .x{position:absolute;right:6px;top:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 150px) 30px 30px;position:relative}
.pond{position:relative;width:200px;height:120px}
.pond svg{position:absolute;inset:0;overflow:visible}
.fall{animation:fall .8s cubic-bezier(.45,0,.75,1) both}
@keyframes fall{0%{transform:translateY(-140px);opacity:0}25%{opacity:1}100%{transform:translateY(0)}}
.ring{transform-origin:100px 96px;animation:ring 1.4s .72s ease-out both}
.ring.r2{animation-delay:.95s}
@keyframes ring{from{opacity:.9;transform:scale(.15)}to{opacity:.0;transform:scale(1.15)}}
.ringstay{transform-origin:100px 96px;animation:ringstay 1s 1.1s ease-out both}
@keyframes ringstay{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.up1{animation:up .6s 1.2s ease-out both}.up2{animation:up .6s 1.5s ease-out both}.up3{animation:up .6s 1.8s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.done-ttl{font-family:var(--serif);font-size:18px;letter-spacing:.08em;margin-top:14px;color:var(--ink)}
.care{margin-top:34px;width:100%;background:var(--mist);border-radius:22px;padding:18px 18px 10px;position:relative}
.care .x{position:absolute;right:6px;top:6px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
/* meet */
.seg{display:flex;gap:4px;padding:4px;margin:2px 22px 0;border-radius:23px;background:var(--sunk);flex:none}
.seg button{flex:1;height:38px;border-radius:19px;font-size:16px;letter-spacing:.06em;color:var(--ink2);transition:background .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
[data-theme=dark] .seg button.on{box-shadow:inset 0 0 0 1px var(--line)}
.stackwrap{padding:22px 22px 30px;position:relative}
.mcard{padding:24px;touch-action:pan-y;user-select:none;-webkit-user-select:none;position:relative;z-index:2;will-change:transform}
.mcard.leave{transition:transform .38s cubic-bezier(.5,0,.8,.4),opacity .38s;transform:translateX(-130%) rotate(-6deg)!important;opacity:0}
.mcard.back{transition:transform .3s var(--ease)}
.mcard.rise{animation:rise .45s var(--ease)}
@keyframes rise{from{transform:translateY(14px) scale(.97);opacity:.0}to{transform:none;opacity:1}}
.under{position:absolute;left:34px;right:34px;top:30px;height:60px;border-radius:26px;background:var(--card);opacity:.5;z-index:1;border:1px solid var(--cardline)}
.mbody{display:block;width:100%;text-align:left}
.who{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:44px}
.who .nm{display:flex;flex-direction:column;flex:1;min-width:0}
.who .nm b{font-weight:400;font-size:16px}
.who .nm span{font-size:14px;color:var(--ink2)}
.mact{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 4px;min-height:44px}
.hint{text-align:center;font-size:14px;color:var(--ink3);letter-spacing:.05em;margin-top:18px}
.res{display:block;overflow:visible}
.res circle{fill:none;stroke:var(--lake);stroke-width:1.6;transition:transform .9s var(--ease),fill-opacity .9s;fill:var(--lake);fill-opacity:0}
.res .c1{transform:translateX(-2px)}.res .c2{transform:translateX(2px)}
.res.on .c1,.res.on .c2{transform:none;fill-opacity:.2}
.water{position:relative;width:240px;height:120px;margin:0 auto}
.wring{transform-origin:120px 70px;animation:wring 5.2s ease-out infinite}
.wring.b{animation-delay:1.7s}.wring.c{animation-delay:3.4s}
@keyframes wring{0%{transform:scale(.2);opacity:0}15%{opacity:.9}100%{transform:scale(1.25);opacity:0}}
.hang{animation:hang 3.6s ease-in-out infinite;transform-origin:120px 40px}
@keyframes hang{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.region{margin-top:18px;padding:18px 18px 8px}
.region-hd{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:40px;font-size:16px;letter-spacing:.06em;color:var(--ink)}
.region-hd .chev{color:var(--ink3)}
.prow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.prow:first-of-type{border-top:0}
.prow .pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.prow .pn{font-size:16px;color:var(--ink);letter-spacing:.04em}
.after-line{font-family:var(--serif);font-size:16px;color:var(--ink2);letter-spacing:.03em;line-height:1.8;padding:0 28px 4px;text-align:center}
/* chat */
.crow{display:flex;gap:12px;align-items:center;padding:12px 0;width:100%;text-align:left;min-height:68px}
.crow .cm{flex:1;min-width:0}
.crow .cn{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.crow .cn b{font-weight:400;font-size:16px;letter-spacing:.04em}
.crow .cn span{font-size:14px;color:var(--ink3);flex:none}
.crow .cp{font-size:14px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.crow .cp.unread{color:var(--ink)}
.crow .cp.ended{font-family:var(--serif)}
.msgs{display:flex;flex-direction:column;gap:10px;padding:4px 22px 20px}
.tstamp{align-self:center;font-size:14px;color:var(--ink3);letter-spacing:.04em;padding:6px 0}
.bub{max-width:78%;padding:11px 15px;font-family:var(--serif);font-size:16px;line-height:1.75;letter-spacing:.02em;white-space:pre-wrap;word-break:break-word;animation:fadeIn .3s ease}
.bub.me{align-self:flex-end;background:var(--mist);border-radius:20px 20px 6px 20px}
.bub.them{align-self:flex-start;background:var(--card);border-radius:20px 20px 20px 6px;box-shadow:var(--sh);border:1px solid var(--cardline)}
.bub.media{padding:0;background:transparent;box-shadow:none;border:0}
.sysline{align-self:center;font-size:14px;color:var(--ink3);letter-spacing:.04em;text-align:center;padding:4px 10px;line-height:1.7}
.endline{align-self:center;font-family:var(--serif);font-size:16px;color:var(--ink2);letter-spacing:.06em;padding:14px 0 4px}
.cbar{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 14px var(--sb);background:var(--bg);position:relative}
.cbar .plus{width:40px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}

@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{flex:none;display:flex;justify-content:center;padding:10px 0 6px;touch-action:none;cursor:grab}

/* 四个主页面统一：内容都从“我”页头像的同一高度起步 */
.wdate{font-size:14px;letter-spacing:.12em;color:var(--ink3);text-align:center;margin:0 0 26px}

.roottop{justify-content:center;padding:calc(var(--st) + 14px) 22px 4px}

/* ===== 统一留白：卡片内 24、列表行 16、页面边距 24 ===== */
.pad{padding-left:24px!important;padding-right:24px!important}
.mcard{padding:28px}

/* 我页：头像缩小，与文字比例协调 */
.mehead .av{width:60px!important;height:60px!important;font-size:25px!important}
.mehead .nm{margin-top:14px}

/* 写过的：和其他内容一样用白卡，不再用灰块 */
.month{background:var(--card)!important;box-shadow:var(--sh);border:1px solid var(--cardline)}
/* 写页：顶部一滴作为落点，与“我”页头像同一高度 */
.wmark{display:flex;justify-content:center;margin:6px 0 30px;opacity:.85}

/* ================= v3.4 布局规格 =================
   头像：32 / 40 / 48 / 56    圆角：24 卡片 / 16 小块 / 全圆
   间距：左右 24，卡片内边距 20，分组间 32，组内 16       */
:root{--gx:24px;--top:32px}
/* 左右边距 24 */
.hd{padding-left:var(--gx);padding-right:var(--gx)}
.pad{padding:8px var(--gx) 32px}

.stackwrap{padding:24px var(--gx) 32px}
.msgs{padding:8px var(--gx) 24px}
.sheet .sbody{padding-left:var(--gx);padding-right:var(--gx)}
/* 圆角三档 */
.card,.card.m,.under,.care{border-radius:24px}
.thread,.month,.mod,.sunkbox,.mistbox,.wcard,.voice,.vid,.tile,.visbub,.notice{border-radius:16px}
/* 卡片内边距 20 */
.mcard{padding:24px 20px 8px}
.region{padding:20px}
.hpost{padding:20px 20px 12px}
.thread{padding:16px 20px 8px}
.month{padding:18px 20px;min-height:116px}
.card.m.myhome,.card.m.mypost{padding:18px 20px}
/* 分组节奏：组间 32，组内 16 */
.label{margin:32px 0 8px}
.pad > .label:first-child,.pad > p.label:first-child{margin-top:8px}
.row{min-height:56px}
/* 四个主页面：内容统一从安全区下方 32 开始 */
.roottop{padding:calc(var(--st) + var(--top)) var(--gx) 12px;justify-content:center}
.roottop .seg{flex:1;width:auto;margin:0}
.roottopPad{padding-top:calc(var(--st) + var(--top))!important}
.write-scroll{padding:calc(var(--st) + var(--top)) var(--gx) 16px!important}
.metune{top:calc(var(--st) + 24px);right:calc(var(--gx) - 13px)}
/* 写页：去掉小水滴，提示字下移到上三分之一，重心落稳 */
.wmark{display:none}
.write-scroll{padding-top:calc(var(--vvh,100vh)*.15)!important}
/* “我”页 */
.mehead{padding:0 0 8px}
.mehead .nm{margin-top:14px}
.mehead .it{max-width:none;padding:0 8px;text-wrap:balance;margin-top:8px}
.mehead .md{height:34px;padding:0 14px;margin-top:12px}
.months{gap:12px}
/* 聊天列表行距 */
.crow{padding:12px 0}
/* 底部导航与内容不挤 */
.nav button{min-height:56px}

/* 写页：输入从底部开始，靠近拇指；写长了向上长 */
.write-scroll{display:flex;flex-direction:column;padding:calc(var(--st) + var(--top)) var(--gx) 20px!important;cursor:text}
#w-text{margin-top:auto;min-height:0!important}

/* ===== 写页 v3.5：上方一滴探出水平线，下方整块白色输入卡 ===== */
.write-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.whero{flex:0 0 auto;height:32%;min-height:150px;max-height:280px;display:flex;align-items:flex-end;justify-content:center;padding:var(--st) 20px 0}

.write-wrap.typing .wcardbox{border-radius:28px;margin-bottom:6px;border-bottom:1px solid var(--cardline)}

.wcardbox #w-text{margin-top:0!important;min-height:36vh!important;height:auto}
.wmark{display:none}
.wdate{text-align:left}


/* ===== 正式排版系统：全 App 只认这一套 =====
   只有两种字族：
   1. 内容字（宋体）：用户真正写下/说出的内容
   2. 界面字（无衬线）：标题、名字、按钮、标签、时间、状态、导航
   字号只保留三级：18 阅读 / 16 界面 / 15 辅助；不再使用 17、14 等中间字号。 */
:root{
  --font-content:var(--serif);
  --font-ui:var(--sans);
  --fs-read:18px;
  --fs-ui:16px;
  --fs-meta:15px;
  --lh-read:1.8;
  --lh-ui:1.55;
  --lh-meta:1.65;
}
html,body,button,input,textarea{font-family:var(--font-ui)}

/* A. 用户内容：统一宋体 18 */
.t-body,.t-body16,#w-text,.bub,.cmtq,.field.serif,.month .ms,.after-line{
  font-family:var(--font-content);font-size:var(--fs-read);line-height:var(--lh-read);letter-spacing:.02em
}
/* 列表里的内容预览仍属于“内容”，但为了单行信息密度使用统一界面字号。 */
.crow .cp{font-family:var(--font-content);font-size:var(--fs-ui);line-height:1.6;letter-spacing:.02em}

/* B. 主界面信息：统一无衬线 16 */
.hd h1,.hd .who,.nav button,.btn,.link,.row .rt,.seg button,.who .nm b,.region-hd,.prow .pn,
.crow .cn b,.cin,.mod .mv,.sheet .sttl,.sheet .sitem,.field:not(.serif),.empty,.wcard .ct,.cbar-msg,
.pill,.lakelink,.softlink,.th-acts button,.endline{
  font-family:var(--font-ui);font-size:var(--fs-ui);line-height:var(--lh-ui)
}

/* C. 辅助信息：统一无衬线 15 */
.t-sub,.t-tag,.label,.chip,.row .rv,.note,.vislab,.wcard .cq,.who .nm span,.hint,.crow .cn span,
.tstamp,.sysline,.floathint,.notice,.topline,.phead .pnm span,.mod .ml,.edited,.th-hd .tn,.th-tag,
.cmt .cw,.mehead .it,.mehead .md,.month .mt,.badge,.confirm p,#toast,.visitbar,.cbar-note,.vid .dur,.tile .more,.wdate{
  font-family:var(--font-ui);font-size:var(--fs-meta);line-height:var(--lh-meta);letter-spacing:.03em
}

/* D. 状态标题 / 人物主标题：18，但仍属于界面字，不混入内容宋体。 */
.empty .ttl,.done-ttl,.phead .pnm b,.mehead .nm,.confirm h3{
  font-family:var(--font-ui);font-size:var(--fs-read);line-height:1.5;letter-spacing:.04em
}

/* 头像只是识别符，不再额外切宋体，避免同一屏出现第三种视觉字形。 */
.av{font-family:var(--font-ui)}

/* 清理历史内联小字号：正式页面里任何 14px 文本统一抬到辅助级 15px。 */
.screen [style*="font-size:14px"]:not(.av){font-size:var(--fs-meta)!important}

/* “遇见”两页专项约束：正文 / 人名 / 时间 / 操作 / 提示严格五类，不允许局部另起字号。 */
.stackwrap .t-body{font-family:var(--font-content);font-size:var(--fs-read)}
.stackwrap .who .nm b,.stackwrap .mact .link,.stackwrap .mact .pill,.region-hd,.prow .pn{font-family:var(--font-ui);font-size:var(--fs-ui)}
.stackwrap .who .nm span,.stackwrap .hint,.prow .t-sub,.prow .t-tag{font-family:var(--font-ui);font-size:var(--fs-meta)}

/* 聊天列表和对话页也服从同一层级，不再出现 17px 特例。 */
.crow{min-height:76px;padding:13px 0}
.crow .cn b{font-size:var(--fs-ui)}
.crow .cp{margin-top:4px}
.msgs{gap:12px}
.bub{padding:12px 16px}
.cin{font-size:var(--fs-ui)}
.cbar-msg{font-size:var(--fs-ui)}

/* “我”页同样只用 18 / 16 / 15。 */
.mehead .it{font-size:var(--fs-meta)}
.myhome .t-tag,.month .mt{font-size:var(--fs-meta)}
.month .ms{font-size:var(--fs-read)}

/* 写页：工具栏始终预渲染，焦点变化只切状态，不重建 textarea。 */
.write-wrap:not(.typing) .wbar{display:none}
.write-wrap.typing .whero{display:none}
.write-wrap.focused ~ .nav{display:none!important}
.write-wrap.typing .wdate{margin-top:calc(var(--st) + 18px)}
/* 写页退出编辑：明确的一键“取消”，只结束编辑，不删除内容。 */
.wbar{position:relative}
.wcancel{
  position:absolute;right:18px;bottom:calc(100% + 8px);height:40px;min-width:60px;padding:0 14px;
  border-radius:20px;background:var(--sunk);color:var(--ink2);font-family:var(--font-ui);font-size:var(--fs-meta);
  line-height:40px;letter-spacing:.03em;box-shadow:var(--sh);z-index:4
}
.write-wrap:not(.focused) .wcancel{display:none}
/* 有草稿但没有在编辑时，回到正常写页节奏；草稿仍留在卡片里，点卡片即可继续。 */
.write-wrap.hasdraft:not(.typing) .wcardbox #w-text{pointer-events:none}

</style>

<script>
/* ============ 种子数据（模拟世界） ============ */
const TODAY = new Date(2026, 9, 3); // 2026-10-03 周六
