<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="KeepExact internal prototype"><title>KeepExact — Internal prototype</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><header class="hero"><div class="brand">KeepExact</div><h1>Internal verification prototype</h1><p>This build is for internal accuracy testing only. It is not for sale and should not be shared with external users yet.</p></header><form id="audit-form" class="panel" novalidate><section class="upload-grid"><label class="upload-card" for="original"><span class="step">1</span><strong>Original</strong><span class="hint">Before the AI edit</span><img id="original-preview" class="preview" alt="Original image preview" hidden><span id="original-name" class="file-name">Choose image</span><input id="original" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="upload-card" for="edited"><span class="step">2</span><strong>Edited</strong><span class="hint">After the AI edit</span><img id="edited-preview" class="preview" alt="Edited image preview" hidden><span id="edited-name" class="file-name">Choose image</span><input id="edited" type="file" accept="image/jpeg,image/png,image/webp"></label></section><label class="instruction-block" for="instruction"><span><span class="step">3</span><strong>Exact edit instruction</strong></span><textarea id="instruction" maxlength="4000" placeholder="Example: Remove the cup on the right. Keep everything else unchanged."></textarea></label><p id="form-error" class="form-error" role="alert" hidden></p><button id="submit" class="primary" type="submit">Run internal check</button><p id="live-status" class="privacy">Checking verifier status…</p></form><section id="result" class="panel result" aria-live="polite" hidden><div class="result-top"><span id="verdict" class="verdict">REVIEW</span><div class="score-wrap"><strong id="score">—</strong><span>/100 compliance</span></div></div><p id="summary" class="summary"></p><div class="result-section"><h2>Requested changes</h2><div id="requested-list" class="findings"></div></div><div class="result-section"><h2>Unintended changes</h2><div id="unintended-list" class="findings"></div></div><div class="repair-box"><div class="repair-title"><h2>Repair instruction</h2><button id="copy-repair" type="button" class="secondary">Copy</button></div><p id="repair-prompt"></p></div></section></main><script type="module" src="/app.js"></script></body></html>
