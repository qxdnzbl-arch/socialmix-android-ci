   const image=media.find(x=>x.type==='image');

function imageToData(file,max,q){return new Promise((resolve,reject)=>{if(file.size>8*1024*1024)return reject(new Error('原图不能超过8MB'));const r=new FileReader();r.onerror=()=>reject(new Error('图片读取失败'));r.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('图片格式不支持'));im.onload=()=>{let w=im.width,h=im.height;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}

 if(!homeData)homeData=await rpc('kehua_prod_home',{p_token:token});const list=(homeData.resonances||[]).filter(x=>x.status!=='dismissed');if(!list.length){toast('暂时没有新的共鸣');return}
 index=Math.max(0,Math.min(index,list.length-1));const r=list[index];if(r.status==='new'){try{await rpc('kehua_prod_open_resonance',{p_token:token,p_resonance_id:r.id});r.status='opened'}catch{}}
 const lit=r.status==='lit'&&r.nickname;
 const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="sheet"><div class="sheet-head"><button class="iconbtn" id="closeRes">×</button><div></div><div class="res-count">'+(index+1)+' / '+list.length+'</div></div><div class="res-page"><div class="res-content">'+(lit?'<div class="identity" style="display:flex;align-items:center;gap:10px;margin-bottom:18px">'+avatar({nickname:r.nickname,avatar_data:r.avatar_data})+'<div><div class="name">'+esc(r.nickname)+'</div><div class="muted" style="font-size:11px;margin-top:4px">来自这份共鸣</div></div></div>':'<div class="muted" style="font-size:12px;margin-bottom:18px">一条与你产生共鸣的话</div>')+'<div>'+esc(r.content)+'</div>'+(safeImg(r.media_data)?'<img class="postimg" src="'+esc(r.media_data)+'" alt="">':'')+(lit?'<div class="context-status">你已经点亮了这条动态，可以从这句话开始聊。</div>':'')+'</div><div class="res-actions"><button class="dismiss" id="skip">'+(index<list.length-1?'下一条':'划过')+'</button><button class="light" id="light">'+(lit?'聊聊':'点亮')+'</button></div></div></div>';document.body.appendChild(o);
 let startX=0;o.querySelector('.res-content').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});o.querySelector('.res-content').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(dx<-70)o.querySelector('#skip').click();else if(dx>70&&index>0){o.remove();openResonance(index-1)}},{passive:true});
 o.querySelector('#closeRes').onclick=()=>{o.remove();renderHome()};
 o.querySelector('#skip').onclick=async()=>{if(r.status!=='lit'){try{await rpc('kehua_prod_dismiss_resonance',{p_token:token,p_resonance_id:r.id})}catch{}}o.remove();if(index<list.length-1)openResonance(index+1);else renderHome()};
 o.querySelector('#light').onclick=async()=>{if(r.status==='lit'&&r.author_id){o.remove();openChat(r.author_id,{content:r.content,media_data:r.media_data,nickname:r.nickname,avatar_data:r.avatar_data});return}const b=o.querySelector('#light');b.disabled=true;try{const j=await rpc('kehua_prod_light',{p_token:token,p_post_id:r.id});r.status='lit';r.author_id=j.user.id;r.nickname=j.user.nickname;r.avatar_data=j.user.avatar_data||null;o.remove();openChat(j.user.id,{content:r.content,media_data:r.media_data,nickname:j.user.nickname,avatar_data:j.user.avatar_data||null})}catch(e){toast(e.message);b.disabled=false}};
}
async function renderMessages(){
 const [th,fr,inc,lights]=await Promise.all([rpc('kehua_prod_threads',{p_token:token}),rpc('kehua_prod_friends',{p_token:token}),rpc('kehua_prod_incoming_friend_requests',{p_token:token}),rpc('kehua_prod_lights_received',{p_token:token})]);
 const s=document.getElementById('screen'),friends=fr.items||[],requests=inc.items||[],items=th.items||[],received=lights.items||[];
 s.innerHTML='<main class="message-screen"><div class="topbar"><h2>消息</h2><div style="display:flex;gap:4px"><button class="iconbtn" aria-label="好友"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><path d="M3 19c.6-4 2.4-6 6-6s5.4 2 6 6M17 7h4M19 5v4"/></svg></button><button class="iconbtn" aria-label="私聊"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h11a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H8l-4 3v-4a3 3 0 0 1-1-2.2z"/><path d="M15 9h3a3 3 0 0 1 3 3v3a3 3 0 0 1-2 2.8V21l-4-2.6"/></svg></button></div></div>'+(friends.length?'<div class="friend-strip">'+friends.map(u=>'<button class="friend-mini" data-chat="'+esc(u.id)+'">'+avatar(u)+'<div>'+esc(u.nickname)+'</div></button>').join('')+'</div>':'')+'<div class="message-list">'+(requests.length?'<div class="section-title">好友申请</div>'+requests.map(x=>'<div class="rowcard">'+avatar(x)+'<div class="grow"><div class="name">'+esc(x.nickname)+'</div><div class="preview">想加你为好友</div><div class="small-actions"><button class="accept" data-accept="'+esc(x.id)+'">接受</button><button class="reject" data-reject="'+esc(x.id)+'">忽略</button></div></div></div>').join(''):'')+(received.length?'<div class="section-title">点亮我的人</div>'+received.slice(0,8).map(x=>'<button class="rowcard" data-chat="'+esc(x.from_user_id)+'" style="width:100%;border-top:0;border-left:0;border-right:0;text-align:left">'+avatar(x)+'<div class="grow"><div class="name">'+esc(x.nickname)+'</div><div class="preview">点亮了：“'+esc(x.post_content).slice(0,40)+'”</div></div></button>').join(''):'')+'<div class="section-title">对话</div>'+(items.length?items.map(x=>'<button class="rowcard" data-chat="'+esc(x.id)+'" style="width:100%;border-top:0;border-left:0;border-right:0;text-align:left">'+avatar(x)+'<div class="grow"><div class="name">'+esc(x.nickname)+'</div><div class="preview">'+esc(x.last_message||'已经可以聊天了')+'</div></div>'+(x.unread_count?'<span class="badge">'+esc(x.unread_count)+'</span>':'')+'</button>').join(''):'<div class="empty">点亮共鸣后，对话会出现在这里。</div>')+'</div></main>';
 document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat));
 document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>respondFriend(b.dataset.accept,true));
 document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>respondFriend(b.dataset.reject,false));
}
async function respondFriend(id,accept){try{await rpc('kehua_prod_respond_friend_request',{p_token:token,p_request:id,p_accept:accept});toast(accept?'已成为好友':'已忽略');renderMessages()}catch(e){toast(e.message)}}
async function openChat(id,context){
 clearInterval(chatTimer);let data;try{data=await rpc('kehua_prod_chat',{p_token:token,p_other:id})}catch(e){toast(e.message);return}
 const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="sheet"><div class="sheet-head"><button class="iconbtn" id="back">‹</button><div style="text-align:center"><div class="name">'+esc(data.peer.nickname)+'</div><div class="muted" style="font-size:11px">'+(data.is_friend?'好友':'从一条动态开始')+'</div></div><button class="iconbtn" id="more">···</button></div><div class="chat-wrap">'+(context&&context.content?'<div class="context-card"><div class="context-title">这段对话开始于</div><div class="postbody" style="font-size:15px">'+esc(context.content)+'</div>'+(safeImg(context.media_data)?'<img class="postimg" src="'+esc(context.media_data)+'" alt="">':'')+'</div>':'')+'<div class="privacy-line">回复仅彼此可见</div><div class="messages" id="msgs"></div><div class="sendbar"><input id="msgInput" maxlength="2000" placeholder="回应 '+esc(data.peer.nickname)+'："><button id="send">发送</button></div></div></div>';document.body.appendChild(o);
 const renderMsgs=d=>{const box=o.querySelector('#msgs');box.innerHTML=(d.items||[]).map(m=>'<div class="bubble '+(m.from_id===meData.user.id?'mine':'theirs')+'">'+esc(m.body)+'</div>').join('');box.scrollTop=box.scrollHeight};
 renderMsgs(data);o.querySelector('#back').onclick=()=>{clearInterval(chatTimer);o.remove();if(currentTab===1)renderMessages()};
 o.querySelector('#more').onclick=()=>peerMenu(id);
 const send=async()=>{const inp=o.querySelector('#msgInput'),v=inp.value.trim();if(!v)return;const b=o.querySelector('#send');b.disabled=true;try{await rpc('kehua_prod_send_message',{p_token:token,p_to:id,p_body:v});inp.value='';data=await rpc('kehua_prod_chat',{p_token:token,p_other:id});renderMsgs(data)}catch(e){toast(e.message)}finally{b.disabled=false}};
 o.querySelector('#send').onclick=send;o.querySelector('#msgInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
 chatTimer=setInterval(async()=>{if(!document.body.contains(o)){clearInterval(chatTimer);return}try{const fresh=await rpc('kehua_prod_chat',{p_token:token,p_other:id});if((fresh.items||[]).length!==(data.items||[]).length){data=fresh;renderMsgs(data)}}catch{}},2500);
}
function peerMenu(id){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="modal-card"><h3>这段关系</h3><button class="primary" id="report" style="background:#f2f1f5;color:#555">举报</button><button class="primary" id="block" style="background:#fff0f2;color:#c44757">屏蔽</button><button class="linkbtn" id="cancel" style="width:100%">取消</button></div>';document.body.appendChild(m);m.querySelector('#cancel').onclick=()=>m.remove();m.querySelector('#report').onclick=async()=>{const reason=prompt('请填写举报原因');if(!reason)return;try{await rpc('kehua_prod_report',{p_token:token,p_user:id,p_post:null,p_reason:reason});toast('已提交');m.remove()}catch(e){toast(e.message)}};m.querySelector('#block').onclick=async()=>{if(!confirm('屏蔽后你们将不能继续互动。确定？'))return;try{await rpc('kehua_prod_block',{p_token:token,p_other:id});toast('已屏蔽');m.remove();document.querySelectorAll('.overlay').forEach(x=>x.remove());switchTab(1)}catch(e){toast(e.message)}}}
async function renderMe(){
 const [me,fr,home]=await Promise.all([rpc('kehua_prod_me',{p_token:token}),rpc('kehua_prod_friends',{p_token:token}),rpc('kehua_prod_home',{p_token:token})]);meData=me;const u=me.user,s=document.getElementById('screen');
 const mine=home.my_posts||[],lit=(home.resonances||[]).filter(x=>x.status==='lit');const tab=window.__kehuaMeTab||'mine';
 const cards=tab==='mine'?mine.map(p=>'<article class="original-post">'+postCard(p)+'</article>').join(''):lit.map(p=>'<article class="original-post"><div class="postbody">'+esc(p.content)+'</div>'+(safeImg(p.media_data)?'<img class="postimg" src="'+esc(p.media_data)+'" alt="">':'')+'<div class="meta"><span>已点亮</span><span>'+esc(p.nickname||'')+'</span></div></article>').join('');
 s.innerHTML='<div class="topbar"><h2>我</h2><button class="iconbtn" id="settings">⚙</button></div><section class="me-head"><div class="me-line">'+avatar(u)+'<div><div class="me-name">'+esc(u.nickname)+'</div><div class="muted" style="font-size:13px;margin-top:5px">@'+esc(u.login)+'</div><div class="muted" style="font-size:13px;margin-top:5px">'+esc(u.bio||'还没有写简介')+'</div></div></div></section><div class="me-tabs"><button data-metab="mine" class="'+(tab==='mine'?'active':'')+'">我的动态</button><button data-metab="lit" class="'+(tab==='lit'?'active':'')+'">点亮</button></div><div class="list">'+(cards||'<div class="empty">'+(tab==='mine'?'还没有动态。':'还没有点亮过动态。')+'</div>')+'</div>';
 document.querySelectorAll('[data-metab]').forEach(b=>b.onclick=()=>{window.__kehuaMeTab=b.dataset.metab;renderMe()});
 document.querySelectorAll('[data-delpost]').forEach(b=>b.onclick=async()=>{if(!confirm('删除这条动态？'))return;try{await rpc('kehua_prod_delete_post',{p_token:token,p_post_id:b.dataset.delpost});renderMe()}catch(e){toast(e.message)}});
 document.getElementById('settings').onclick=()=>openSettings(u);
}
function openSettings(u){
 const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="sheet"><div class="sheet-head"><button class="iconbtn" id="back">‹</button><b>设置</b><span style="width:44px"></span></div><div class="list"><div class="settings-row"><span>编辑资料</span><button id="edit">›</button></div><div class="settings-row"><span>首页背景</span><label class="linkbtn">更换<input id="bgFile" type="file" accept="image/jpeg,image/png,image/webp" hidden></label></div><div class="settings-row"><span>账号恢复</span><button id="recovery">生成恢复码</button></div><div class="settings-row"><span>退出登录</span><button id="logout">退出</button></div><div class="settings-row"><span class="danger">注销账号</span><button class="danger" id="deleteAccount">注销</button></div></div></div>';document.body.appendChild(o);
 o.querySelector('#back').onclick=()=>o.remove();o.querySelector('#edit').onclick=()=>{o.remove();editProfile(u)};
 const bg=o.querySelector('#bgFile');bg.onchange=async()=>{if(!bg.files[0])return;try{const data=await imageToData(bg.files[0],1800,.84);await rpc('kehua_prod_update_profile',{p_token:token,p_nickname:u.nickname,p_bio:u.bio||'',p_gender:u.gender||'',p_region:u.region||'',p_avatar_data:u.avatar_data||null,p_background_data:data});meData.user.background_data=data;toast('首页背景已更换');o.remove();switchTab(0)}catch(e){toast(e.message)}};
 o.querySelector('#recovery').onclick=async()=>{if(!confirm('生成新恢复码后旧码会失效，继续？'))return;try{const j=await rpc('kehua_prod_rotate_recovery',{p_token:token});showRecovery(j.recovery_code,'新的恢复码','旧恢复码已经失效，请保存这一份。')}catch(e){toast(e.message)}};
 o.querySelector('#logout').onclick=async()=>{try{await rpc('kehua_prod_logout',{p_token:token})}catch{}saveToken('');o.remove();renderAuth()};
 o.querySelector('#deleteAccount').onclick=async()=>{if(!confirm('确定永久注销账号？'))return;if(prompt('请输入“注销”确认')!=='注销')return;try{await rpc('kehua_prod_delete_account',{p_token:token});saveToken('');o.remove();renderAuth();toast('账号已注销')}catch(e){toast(e.message)}};
}
function editProfile(u){
 const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="sheet"><div class="sheet-head"><button class="iconbtn" id="back">‹</button><b>编辑资料</b><button class="linkbtn" id="save">保存</button></div><div class="editbox"><div class="section-title">昵称</div><input class="field" id="nick" maxlength="24" value="'+esc(u.nickname)+'"><div class="section-title">简介</div><textarea class="field" id="bio" maxlength="120">'+esc(u.bio||'')+'</textarea><div class="section-title">地区</div><input class="field" id="region" maxlength="40" value="'+esc(u.region||'')+'"></div></div>';document.body.appendChild(o);o.querySelector('#back').onclick=()=>o.remove();o.querySelector('#save').onclick=async()=>{try{await rpc('kehua_prod_update_profile',{p_token:token,p_nickname:o.querySelector('#nick').value,p_bio:o.querySelector('#bio').value,p_gender:u.gender||'',p_region:o.querySelector('#region').value,p_avatar_data:u.avatar_data||null,p_background_data:u.background_data||null});o.remove();toast('已保存');renderMe()}catch(e){toast(e.message)}};
}
boot();
</script>
</body></html>
