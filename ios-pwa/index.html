<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="沉浸音乐">
  <meta name="theme-color" content="#241f35">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>沉浸音乐</title>
  <style>
    :root{--bg:#241f35;--fg:rgba(255,255,255,.94);--sub:rgba(255,255,255,.60);--line:rgba(255,255,255,.14);--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#171714}
    button,input{font:inherit}
    button{border:0;background:none;color:inherit;padding:0}
    .app{height:100%;position:relative;overflow:hidden;background:#f5f5f3}
    .page{position:absolute;inset:0;display:none}.page.active{display:block}
    .player{background:var(--bg);color:var(--fg);transition:background .45s ease;overflow:hidden}
    .player:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.09),rgba(0,0,0,.18) 45%,rgba(0,0,0,.38));pointer-events:none}
    .player-inner{position:relative;height:100%;display:flex;flex-direction:column;padding:calc(var(--safe-top) + 4px) 24px calc(var(--safe-bottom) + 70px)}
    .topbar{height:54px;position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .title{font-size:17px;font-weight:500;letter-spacing:.2px}.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}.topbar .search{position:absolute;right:-8px;top:5px}
    .disc-zone{flex:1;min-height:260px;display:grid;place-items:center;position:relative}
    .disc-halo{width:min(76vw,290px);height:min(76vw,290px);border-radius:50%;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center}
    .disc{width:calc(100% - 20px);height:calc(100% - 20px);border-radius:50%;position:relative;background:radial-gradient(circle at 50% 50%,#1b1b1b 0 13%,#060606 13.5% 19%,#171717 19.5% 24%,#070707 24.5% 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 18px 40px rgba(0,0,0,.2);overflow:hidden}
    .disc:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 3px,rgba(255,255,255,.028) 3.5px 4px),linear-gradient(118deg,transparent 35%,rgba(255,255,255,.10) 48%,transparent 58%);mix-blend-mode:screen}
    .disc.playing{animation:spin 20.5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .label-disc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32%;height:32%;border-radius:50%;display:grid;place-items:center;background:rgba(170,70,90,.95);box-shadow:0 0 0 7px #080808;color:#fff;font-size:11px;text-align:center;padding:8px;overflow:hidden}
    .needle{position:absolute;width:114px;height:16px;right:calc(50% - min(38vw,145px));top:calc(50% - min(38vw,145px) + 18px);transform-origin:92px 8px;transform:rotate(-28deg);transition:transform .35s ease;z-index:3}
    .needle.on{transform:rotate(-8deg)}.needle:before{content:"";position:absolute;width:95px;height:6px;right:7px;top:5px;border-radius:6px;background:linear-gradient(90deg,#b7b8bc,#e3e3e5,#8f9095);box-shadow:0 1px 3px rgba(0,0,0,.35)}.needle:after{content:"";position:absolute;right:0;top:1px;width:18px;height:14px;border-radius:4px;background:#d6d6d8;box-shadow:0 1px 3px rgba(0,0,0,.35)}
    .meta-row{display:flex;align-items:center;gap:16px}.meta{min-width:0;flex:1;overflow:hidden}.marquee{overflow:hidden;white-space:nowrap}.marquee span{display:inline-block;min-width:max-content}.marquee.run span{animation:marquee 11s linear infinite;padding-right:42px}@keyframes marquee{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(calc(-100% + 72vw))}}
    .song-title{font-size:18px;font-weight:500;color:rgba(255,255,255,.93);line-height:1.45}.artist{font-size:13.5px;color:var(--sub);margin-top:2px;line-height:1.45}.meta-actions{display:flex;gap:4px}.meta-actions button{width:40px;height:40px;display:grid;place-items:center;color:rgba(255,255,255,.92)}
    .progress-wrap{margin-top:18px}.range{width:100%;height:22px;appearance:none;background:transparent}.range::-webkit-slider-runnable-track{height:2px;background:rgba(255,255,255,.30);border-radius:2px}.range::-webkit-slider-thumb{appearance:none;width:7px;height:7px;border-radius:50%;background:#fff;margin-top:-2.5px}.times{display:flex;justify-content:space-between;margin-top:-3px;font-size:10.5px;font-weight:300;color:rgba(255,255,255,.56);font-variant-numeric:tabular-nums}
    .controls{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;margin-top:8px;padding:0 24px}.ctl{height:58px;display:grid;place-items:center}.play{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.96);color:#171717;display:grid;place-items:center;justify-self:center;box-shadow:0 8px 24px rgba(0,0,0,.14)}
    .bottom-nav{position:absolute;left:0;right:0;bottom:0;height:calc(58px + var(--safe-bottom));padding-bottom:var(--safe-bottom);display:grid;grid-template-columns:1fr 1fr;background:rgba(248,248,246,.97);border-top:1px solid rgba(0,0,0,.06);z-index:8}.bottom-nav.player-nav{background:rgba(15,15,15,.08);border-top-color:rgba(255,255,255,.10);color:rgba(255,255,255,.76);backdrop-filter:blur(12px)}.nav-btn{font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav-btn.active{font-weight:600;color:inherit}.nav-btn svg{width:21px;height:21px}
    .light{background:#f7f7f5}.light-inner{height:100%;padding:calc(var(--safe-top) + 4px) 22px calc(var(--safe-bottom) + 70px);overflow:auto;-webkit-overflow-scrolling:touch}.light-top{height:52px;display:flex;align-items:center;justify-content:space-between}.light-title{font-size:24px;font-weight:650}.round-btn{width:44px;height:44px;display:grid;place-items:center;margin-right:-9px}.song-list{padding:4px 0 16px}.song-row{position:relative;min-height:64px;display:flex;align-items:center;border-bottom:1px solid rgba(0,0,0,.055);gap:12px}.song-main{min-width:0;flex:1;padding:10px 0}.song-name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-artist{font-size:12.5px;color:#92938e;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:44px;height:44px;display:grid;place-items:center;font-size:26px;color:#6b6c68}.delete-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(247,247,245,.78);z-index:2}.song-row.delete-mode .delete-overlay{display:flex}.delete-btn{padding:9px 20px;border-radius:999px;background:#fff1f1;color:#bb2c2c;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.08)}
    .empty{padding:90px 12px;text-align:center;color:#8b8d89;line-height:1.7}.search-page .light-inner{padding-bottom:30px}.search-head{height:52px;display:flex;align-items:center;gap:6px}.back{width:44px;height:44px;display:grid;place-items:center;margin-left:-10px}.searchbox{height:42px;flex:1;border-radius:14px;background:#ececea;display:flex;align-items:center;gap:8px;padding:0 12px}.searchbox input{border:0;outline:0;background:transparent;min-width:0;flex:1;font-size:16px;color:#1a1a18}
    .sheet{position:absolute;inset:0;z-index:20;display:none}.sheet.show{display:block}.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:68%;background:#f7f7f5;border-radius:22px 22px 0 0;padding:14px 18px calc(var(--safe-bottom) + 14px);overflow:auto;-webkit-overflow-scrolling:touch}.grab{width:36px;height:4px;border-radius:3px;background:#c7c7c4;margin:0 auto 12px}.sheet-title{font-weight:650;font-size:17px;margin:4px 4px 8px}
    .install-tip{position:absolute;z-index:30;left:16px;right:16px;bottom:calc(70px + var(--safe-bottom));padding:13px 14px;border-radius:16px;background:rgba(20,20,20,.88);color:#fff;font-size:13px;line-height:1.45;display:none}.install-tip.show{display:flex;gap:12px;align-items:flex-start}.install-tip button{color:#fff;font-weight:700;margin-left:auto}
    .hidden{display:none!important}
    svg{display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  </style>
</head>
<body>
<div class="app" id="app">
  <section class="page player active" id="homePage">
    <div class="player-inner">
      <div class="topbar"><div class="title">心动</div><button class="icon-btn search" id="searchBtn" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="m16 16 4.2 4.2"/></svg></button></div>
      <div class="disc-zone"><div class="needle" id="needle"></div><div class="disc-halo"><div class="disc" id="disc"><div class="label-disc" id="discLabel">沉浸音乐</div></div></div></div>
      <div class="meta-row"><div class="meta"><div class="marquee song-title" id="titleWrap"><span id="songTitle">还没有歌曲</span></div><div class="marquee artist" id="artistWrap"><span id="songArtist">去音乐库添加</span></div></div><div class="meta-actions"><button id="modeBtn" aria-label="播放模式"><svg viewBox="0 0 24 24"><path d="M7 7h8.5a3.5 3.5 0 0 1 3.5 3.5v0"/><path d="m17 8 2-2 2 2"/><path d="M17 17H8.5A3.5 3.5 0 0 1 5 13.5v0"/><path d="m7 16-2 2-2-2"/><text id="modeOne" x="10.6" y="14.3" fill="currentColor" stroke="none" font-size="7" font-weight="700" style="display:none">1</text></svg></button><button id="queueBtn" aria-label="播放列表"><svg viewBox="0 0 24 24"><path d="M4 7h12M4 12h12M4 17h8"/><path d="M18 14v6m0-6 3-2v6"/></svg></button></div></div>
      <div class="progress-wrap"><input class="range" id="seek" type="range" min="0" max="1000" value="0"><div class="times"><span id="currentTime">0:00</span><span id="durationTime">0:00</span></div></div>
      <div class="controls"><button class="ctl" id="prevBtn" aria-label="上一首"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M6.5 5v14M18 6.5 9.5 12 18 17.5z" fill="currentColor" stroke="none"/></svg></button><button class="play" id="playBtn" aria-label="播放"><svg id="playIcon" width="30" height="30" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/></svg></button><button class="ctl" id="nextBtn" aria-label="下一首"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M17.5 5v14M6 6.5l8.5 5.5L6 17.5z" fill="currentColor" stroke="none"/></svg></button></div>
    </div>
    <nav class="bottom-nav player-nav"><button class="nav-btn active" data-page="home"><svg viewBox="0 0 24 24"><path d="M3 11.2 12 4l9 7.2V20H3z"/></svg><span>首页</span></button><button class="nav-btn" data-page="library"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span>音乐库</span></button></nav>
  </section>

  <section class="page light" id="libraryPage"><div class="light-inner"><div class="light-top"><div class="light-title">音乐库</div><button class="round-btn" id="addBtn" aria-label="添加音乐"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button></div><div class="song-list" id="libraryList"></div></div><nav class="bottom-nav"><button class="nav-btn" data-page="home"><svg viewBox="0 0 24 24"><path d="M3 11.2 12 4l9 7.2V20H3z"/></svg><span>首页</span></button><button class="nav-btn active" data-page="library"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span>音乐库</span></button></nav></section>

  <section class="page light search-page" id="searchPage"><div class="light-inner"><div class="search-head"><button class="back" id="backBtn"><svg width="24" height="24" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><div class="searchbox"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="m16 16 4.2 4.2"/></svg><input id="searchInput" placeholder="搜索歌曲或歌手" autocomplete="off"></div></div><div class="song-list" id="searchList"></div></div></section>

  <div class="sheet" id="queueSheet"><div class="scrim" id="queueScrim"></div><div class="sheet-card"><div class="grab"></div><div class="sheet-title">播放列表</div><div id="queueList"></div></div></div>
  <div class="install-tip" id="installTip"><span>要像 App 一样使用：Safari 点“分享” → “添加到主屏幕”。只需做一次。</span><button id="hideTip">知道了</button></div>
  <input id="fileInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg" multiple class="hidden">
</div>
<script>
(function(){
  'use strict';
  var DB='immersiveMusicDB', STORE='tracks';
  var db=null, tracks=[], queue=[], currentId=null, loopOne=false, currentUrl=null, deleteId=null, lastPage='home';
  var audio=new Audio(); audio.preload='metadata';
  var $=function(id){return document.getElementById(id)};
  var home=$('homePage'), library=$('libraryPage'), search=$('searchPage');
  function openDb(){return new Promise(function(resolve,reject){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=function(){db=r.result;resolve()};r.onerror=function(){reject(r.error)}})}
  function getAll(){return new Promise(function(resolve,reject){var r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=function(){resolve(r.result||[])};r.onerror=function(){reject(r.error)}})}
  function putTrack(t){return new Promise(function(resolve,reject){var r=db.transaction(STORE,'readwrite').objectStore(STORE).put(t);r.onsuccess=function(){resolve()};r.onerror=function(){reject(r.error)}})}
  function delTrack(id){return new Promise(function(resolve,reject){var r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=function(){resolve()};r.onerror=function(){reject(r.error)}})}
  function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}
  function decodeText(bytes,enc){try{return new TextDecoder(enc||'utf-8').decode(bytes).replace(/\u0000/g,'').trim()}catch(e){return ''}}
  function parseId3(buf,fallback){try{var b=new Uint8Array(buf);if(b.length<10||String.fromCharCode(b[0],b[1],b[2])!=='ID3')return fallback;var ver=b[3],size=((b[6]&127)<<21)|((b[7]&127)<<14)|((b[8]&127)<<7)|(b[9]&127),p=10,end=Math.min(b.length,10+size),title='',artist='';while(p+10<=end){var key=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);var n=ver===4?((b[p+4]&127)<<21)|((b[p+5]&127)<<14)|((b[p+6]&127)<<7)|(b[p+7]&127):((b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7])>>>0;if(!n||p+10+n>end)break;if(key==='TIT2'||key==='TPE1'){var body=b.slice(p+10,p+10+n),e=body[0],text='';if(e===0)text=decodeText(body.slice(1),'iso-8859-1');else if(e===3)text=decodeText(body.slice(1),'utf-8');else text=decodeText(body.slice(1),'utf-16');if(key==='TIT2')title=text;if(key==='TPE1')artist=text}p+=10+n}return{title:title||fallback.title,artist:artist||fallback.artist}}catch(e){return fallback}}
  async function importFiles(files){for(var i=0;i<files.length;i++){var f=files[i];var base=f.name.replace(/\.[^.]+$/,'');var fallback={title:base||'未命名歌曲',artist:'本地音乐'};var meta=fallback;try{meta=parseId3(await f.slice(0,512*1024).arrayBuffer(),fallback)}catch(e){}var t={id:id(),name:f.name,title:meta.title,artist:meta.artist,type:f.type||'audio/*',size:f.size,blob:f,createdAt:Date.now()};await putTrack(t);tracks.push(t);queue.push(t.id)}saveQueue();renderAll();if(!currentId&&tracks[0])loadTrack(tracks[0].id,false)}
  function saveQueue(){try{localStorage.setItem('immersive.queue',JSON.stringify(queue));localStorage.setItem('immersive.current',currentId||'');localStorage.setItem('immersive.loop',loopOne?'1':'0')}catch(e){}}
  function restoreQueue(){try{var q=JSON.parse(localStorage.getItem('immersive.queue')||'[]');var valid={};tracks.forEach(function(t){valid[t.id]=1});queue=q.filter(function(x){return valid[x]});tracks.forEach(function(t){if(queue.indexOf(t.id)<0)queue.push(t.id)});currentId=localStorage.getItem('immersive.current')||null;if(currentId&&!valid[currentId])currentId=null;loopOne=localStorage.getItem('immersive.loop')==='1'}catch(e){queue=tracks.map(function(t){return t.id})}}
  function trackById(x){for(var i=0;i<tracks.length;i++)if(tracks[i].id===x)return tracks[i];return null}
  function currentTrack(){return trackById(currentId)}
  function colorFor(s){var colors=['#30233f','#173747','#40322a','#29352d','#3c2730','#2b3148','#3d3522'];var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return colors[h%colors.length]}
  function loadTrack(x,autoplay){var t=trackById(x);if(!t)return;if(currentUrl)URL.revokeObjectURL(currentUrl);currentId=x;currentUrl=URL.createObjectURL(t.blob);audio.src=currentUrl;audio.load();document.documentElement.style.setProperty('--bg',colorFor(t.title+t.artist));$('songTitle').textContent=t.title;$('songArtist').textContent=t.artist;$('discLabel').textContent=t.title;$('titleWrap').classList.toggle('run',t.title.length>17);$('artistWrap').classList.toggle('run',t.artist.length>22);saveQueue();renderAll();if(autoplay){var p=audio.play();if(p&&p.catch)p.catch(function(){})}}
  function setPlayState(){var playing=!audio.paused&&!audio.ended;$('disc').classList.toggle('playing',playing);$('needle').classList.toggle('on',playing);$('playIcon').innerHTML=playing?'<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/>':'<path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/>'}
  function next(dir){if(!queue.length)return;var i=queue.indexOf(currentId);if(i<0)i=0;else i=(i+dir+queue.length)%queue.length;loadTrack(queue[i],true)}
  function fmt(sec){if(!isFinite(sec)||sec<0)return'0:00';var m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+(s<10?'0':'')+s}
  function rowHtml(t,withMore){return '<div class="song-row" data-id="'+t.id+'"><div class="song-main"><div class="song-name">'+esc(t.title)+'</div><div class="song-artist">'+esc(t.artist)+'</div></div>'+(withMore?'<button class="more" data-more="'+t.id+'">⋮</button>':'')+'<div class="delete-overlay"><button class="delete-btn" data-delete="'+t.id+'">删除</button></div></div>'}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function renderLibrary(){var el=$('libraryList');el.innerHTML=tracks.length?tracks.map(function(t){return rowHtml(t,true)}).join(''):'<div class="empty">还没有音乐。<br>点右上角“＋”从 iPhone 的“文件”里添加歌曲。</div>';bindRows(el,true)}
  function renderQueue(){var el=$('queueList'),arr=queue.map(trackById).filter(Boolean);el.innerHTML=arr.length?arr.map(function(t){return rowHtml(t,false)}).join(''):'<div class="empty">播放列表为空</div>';bindRows(el,false,true)}
  function renderSearch(){var q=$('searchInput').value.trim().toLowerCase(),arr=q?tracks.filter(function(t){return(t.title+' '+t.artist).toLowerCase().indexOf(q)>=0}):[];var el=$('searchList');el.innerHTML=arr.map(function(t){return rowHtml(t,false)}).join('');bindRows(el,false)}
  function bindRows(root,libraryMode,queueMode){var rows=root.querySelectorAll('.song-row');for(var i=0;i<rows.length;i++){(function(row){var x=row.getAttribute('data-id'),timer=null;row.querySelector('.song-main').onclick=function(){if(row.classList.contains('delete-mode')){row.classList.remove('delete-mode');return}loadTrack(x,true);showPage('home')};if(queueMode){row.querySelector('.song-main').ontouchstart=function(){timer=setTimeout(function(){row.classList.add('delete-mode')},520)};row.querySelector('.song-main').ontouchend=function(){clearTimeout(timer)}}})(rows[i])}var more=root.querySelectorAll('[data-more]');for(i=0;i<more.length;i++)more[i].onclick=function(e){e.stopPropagation();var r=this.closest('.song-row');root.querySelectorAll('.song-row').forEach(function(x){if(x!==r)x.classList.remove('delete-mode')});r.classList.toggle('delete-mode')};var dels=root.querySelectorAll('[data-delete]');for(i=0;i<dels.length;i++)dels[i].onclick=async function(e){e.stopPropagation();var x=this.getAttribute('data-delete');if(queueMode){queue=queue.filter(function(v){return v!==x});if(currentId===x){if(queue.length)loadTrack(queue[0],!audio.paused);else{audio.pause();currentId=null;audio.removeAttribute('src');resetEmpty()}}saveQueue();renderAll()}else if(libraryMode){await delTrack(x);tracks=tracks.filter(function(t){return t.id!==x});queue=queue.filter(function(v){return v!==x});if(currentId===x){audio.pause();if(queue.length)loadTrack(queue[0],false);else{currentId=null;audio.removeAttribute('src');resetEmpty()}}saveQueue();renderAll()}}}
  function resetEmpty(){$('songTitle').textContent='还没有歌曲';$('songArtist').textContent='去音乐库添加';$('discLabel').textContent='沉浸音乐';$('seek').value=0;$('currentTime').textContent='0:00';$('durationTime').textContent='0:00';setPlayState()}
  function renderMode(){$('modeOne').style.display=loopOne?'block':'none'}
  function renderAll(){renderLibrary();renderQueue();renderSearch();renderMode()}
  function showPage(name){home.classList.toggle('active',name==='home');library.classList.toggle('active',name==='library');search.classList.toggle('active',name==='search');if(name!=='search')lastPage=name;document.querySelectorAll('.bottom-nav .nav-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-page')===name)})}
  document.querySelectorAll('.nav-btn').forEach(function(b){b.onclick=function(){showPage(this.getAttribute('data-page'))}});
  $('searchBtn').onclick=function(){showPage('search');setTimeout(function(){$('searchInput').focus()},70)};$('backBtn').onclick=function(){showPage(lastPage)};$('searchInput').oninput=renderSearch;$('addBtn').onclick=function(){$('fileInput').click()};$('fileInput').onchange=async function(){var fs=Array.prototype.slice.call(this.files||[]);this.value='';if(fs.length)await importFiles(fs)};
  $('playBtn').onclick=function(){if(!currentId&&queue[0])loadTrack(queue[0],false);if(!audio.src)return;if(audio.paused)audio.play();else audio.pause()};$('prevBtn').onclick=function(){next(-1)};$('nextBtn').onclick=function(){next(1)};$('modeBtn').onclick=function(){loopOne=!loopOne;audio.loop=loopOne;saveQueue();renderMode()};$('queueBtn').onclick=function(){$('queueSheet').classList.add('show');renderQueue()};$('queueScrim').onclick=function(){$('queueSheet').classList.remove('show')};
  $('seek').oninput=function(){if(isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*(Number(this.value)/1000)};
  audio.addEventListener('play',setPlayState);audio.addEventListener('pause',setPlayState);audio.addEventListener('ended',function(){if(!loopOne)next(1)});audio.addEventListener('loadedmetadata',function(){$('durationTime').textContent=fmt(audio.duration)});audio.addEventListener('timeupdate',function(){$('currentTime').textContent=fmt(audio.currentTime);$('durationTime').textContent=fmt(audio.duration);if(isFinite(audio.duration)&&audio.duration>0)$('seek').value=Math.round(audio.currentTime/audio.duration*1000)});
  function mediaSession(){if(!('mediaSession'in navigator))return;try{navigator.mediaSession.setActionHandler('play',function(){audio.play()});navigator.mediaSession.setActionHandler('pause',function(){audio.pause()});navigator.mediaSession.setActionHandler('previoustrack',function(){next(-1)});navigator.mediaSession.setActionHandler('nexttrack',function(){next(1)})}catch(e){}}
  $('hideTip').onclick=function(){$('installTip').classList.remove('show');localStorage.setItem('immersive.tip','1')};
  function maybeTip(){var standalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;if(!standalone&&!localStorage.getItem('immersive.tip'))setTimeout(function(){$('installTip').classList.add('show')},900)}
  async function init(){await openDb();tracks=await getAll();tracks.sort(function(a,b){return a.createdAt-b.createdAt});restoreQueue();audio.loop=loopOne;if(currentId)loadTrack(currentId,false);else if(queue[0])loadTrack(queue[0],false);else resetEmpty();renderAll();mediaSession();maybeTip();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){})}
  init().catch(function(e){console.error(e);resetEmpty();renderAll()});
})();
</script>
