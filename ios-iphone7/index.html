<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="沉浸音乐">
<meta name="theme-color" content="#2c263b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<title>沉浸音乐</title>
<style>
:root{--bg:#2c263b;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}button,input{font:inherit}button{border:0;background:none;padding:0;color:inherit}.app{height:100%;position:relative;overflow:hidden;background:#f7f7f5;color:#191918}.page{position:absolute;inset:0;display:none}.page.active{display:block}.player{background:var(--bg);color:#fff;transition:background .4s ease}.player:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.34));pointer-events:none}.player-inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:calc(var(--safe-top) + 5px) 24px calc(var(--safe-bottom) + 68px)}.top{height:52px;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}.top-title{font-size:17px;font-weight:500}.top-icon{position:absolute;right:-10px;width:44px;height:44px;display:grid;place-items:center}.disc-zone{flex:1;min-height:245px;display:grid;place-items:center;position:relative}.disc-wrap{width:min(76vw,286px);height:min(76vw,286px);border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);display:grid;place-items:center}.disc{width:calc(100% - 19px);height:calc(100% - 19px);border-radius:50%;position:relative;background:radial-gradient(circle,#161616 0 13%,#050505 13.5% 20%,#141414 20.5% 100%);box-shadow:0 18px 42px rgba(0,0,0,.24);overflow:hidden}.disc:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 3px,rgba(255,255,255,.03) 3.4px 4px),linear-gradient(115deg,transparent 34%,rgba(255,255,255,.12) 48%,transparent 60%)}.disc.playing{animation:spin 20s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32%;height:32%;border-radius:50%;background:#bb5670;box-shadow:0 0 0 7px #080808;display:grid;place-items:center;text-align:center;font-size:10px;padding:7px;overflow:hidden}.needle{position:absolute;width:112px;height:16px;right:calc(50% - min(38vw,143px));top:calc(50% - min(38vw,143px) + 17px);transform-origin:91px 8px;transform:rotate(-28deg);transition:.3s transform;z-index:3}.needle.on{transform:rotate(-8deg)}.needle:before{content:"";position:absolute;width:94px;height:6px;right:7px;top:5px;border-radius:6px;background:linear-gradient(90deg,#a9aaae,#eee,#929398)}.needle:after{content:"";position:absolute;right:0;top:1px;width:18px;height:14px;border-radius:4px;background:#ddd}.meta-row{display:flex;align-items:center;gap:10px}.meta{min-width:0;flex:1}.song-title{font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-artist{font-size:13px;color:rgba(255,255,255,.60);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small-actions{display:flex}.small-actions button{width:40px;height:40px;display:grid;place-items:center}.seek{margin-top:14px}.seek input{width:100%;height:20px;appearance:none;background:transparent}.seek input::-webkit-slider-runnable-track{height:2px;background:rgba(255,255,255,.3)}.seek input::-webkit-slider-thumb{appearance:none;width:7px;height:7px;border-radius:50%;background:#fff;margin-top:-2.5px}.time{display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.56);margin-top:-2px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;margin-top:6px;padding:0 24px}.ctl{height:58px;display:grid;place-items:center}.play{width:62px;height:62px;border-radius:50%;background:#fafafa;color:#151515;display:grid;place-items:center;justify-self:center}.nav{position:absolute;z-index:8;left:0;right:0;bottom:0;height:calc(58px + var(--safe-bottom));padding-bottom:var(--safe-bottom);display:grid;grid-template-columns:1fr 1fr;background:rgba(249,249,247,.97);border-top:1px solid rgba(0,0,0,.06)}.player .nav{background:rgba(20,20,20,.10);border-top-color:rgba(255,255,255,.10);color:rgba(255,255,255,.78);backdrop-filter:blur(12px)}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px}.nav svg,.ico{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.light-inner{height:100%;padding:calc(var(--safe-top) + 5px) 22px calc(var(--safe-bottom) + 70px);overflow:auto;-webkit-overflow-scrolling:touch}.light-top{height:52px;display:flex;align-items:center;justify-content:space-between}.light-title{font-size:24px;font-weight:650}.add{width:44px;height:44px;display:grid;place-items:center;margin-right:-9px}.list{padding:4px 0 20px}.row{position:relative;min-height:64px;display:flex;align-items:center;border-bottom:1px solid rgba(0,0,0,.055);gap:8px}.row-main{min-width:0;flex:1;padding:10px 0}.row-title{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{font-size:12.5px;color:#91928e;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.more{width:44px;height:44px;font-size:26px;color:#6c6d69}.del-layer{display:none;position:absolute;inset:0;background:rgba(247,247,245,.86);align-items:center;justify-content:center;z-index:2}.row.delete .del-layer{display:flex}.del{background:#fff1f1;color:#b72d2d;padding:9px 21px;border-radius:999px;font-weight:650}.empty{padding:82px 10px;text-align:center;color:#8d8e8b;line-height:1.7}.search-head{height:52px;display:flex;align-items:center;gap:6px}.back{width:44px;height:44px;display:grid;place-items:center;margin-left:-10px}.searchbox{height:42px;flex:1;border-radius:14px;background:#ececea;display:flex;align-items:center;gap:8px;padding:0 12px}.searchbox input{min-width:0;flex:1;border:0;outline:0;background:transparent;font-size:16px}.sheet{display:none;position:absolute;inset:0;z-index:20}.sheet.show{display:block}.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:68%;overflow:auto;background:#f7f7f5;border-radius:22px 22px 0 0;padding:14px 18px calc(var(--safe-bottom) + 14px)}.grab{width:36px;height:4px;border-radius:2px;background:#c6c6c3;margin:0 auto 12px}.sheet-title{font-size:17px;font-weight:650;margin:3px 4px 8px}.install{display:none;position:absolute;z-index:30;left:16px;right:16px;bottom:calc(70px + var(--safe-bottom));padding:13px 14px;border-radius:16px;background:rgba(20,20,20,.9);color:#fff;font-size:13px;line-height:1.45}.install.show{display:flex;gap:10px}.install button{margin-left:auto;color:#fff;font-weight:700}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<section id="home" class="page player active"><div class="player-inner"><div class="top"><div class="top-title">心动</div><button id="openSearch" class="top-icon" aria-label="搜索"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.2"/><path d="m16 16 4.2 4.2"/></svg></button></div><div class="disc-zone"><div id="needle" class="needle"></div><div class="disc-wrap"><div id="disc" class="disc"><div id="discLabel" class="label">沉浸音乐</div></div></div></div><div class="meta-row"><div class="meta"><div id="nowTitle" class="song-title">还没有歌曲</div><div id="nowArtist" class="song-artist">去音乐库添加</div></div><div class="small-actions"><button id="loopBtn" aria-label="单曲循环"><svg class="ico" viewBox="0 0 24 24"><path d="M7 7h8.5a3.5 3.5 0 0 1 3.5 3.5"/><path d="m17 8 2-2 2 2"/><path d="M17 17H8.5A3.5 3.5 0 0 1 5 13.5"/><path d="m7 16-2 2-2-2"/></svg></button><button id="queueBtn" aria-label="播放列表"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h12M4 12h12M4 17h8"/><path d="M18 14v6m0-6 3-2v6"/></svg></button></div></div><div class="seek"><input id="seek" type="range" min="0" max="1000" value="0"><div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div></div><div class="controls"><button id="prev" class="ctl" aria-label="上一首">◀◀</button><button id="play" class="play" aria-label="播放">▶</button><button id="next" class="ctl" aria-label="下一首">▶▶</button></div></div><nav class="nav"><button data-page="home">⌂<span>首页</span></button><button data-page="library">▤<span>音乐库</span></button></nav></section>
<section id="library" class="page"><div class="light-inner"><div class="light-top"><div class="light-title">音乐库</div><button id="add" class="add" aria-label="添加音乐">＋</button></div><div id="libraryList" class="list"></div></div><nav class="nav"><button data-page="home">⌂<span>首页</span></button><button data-page="library">▤<span>音乐库</span></button></nav></section>
<section id="search" class="page"><div class="light-inner"><div class="search-head"><button id="back" class="back" aria-label="返回">‹</button><div class="searchbox"><span>⌕</span><input id="searchInput" placeholder="搜索歌曲或歌手" autocomplete="off"></div></div><div id="searchList" class="list"></div></div></section>
<div id="queueSheet" class="sheet"><div id="scrim" class="scrim"></div><div class="sheet-card"><div class="grab"></div><div class="sheet-title">播放列表</div><div id="queueList"></div></div></div>
<div id="installTip" class="install"><span>Safari 点“分享” → “添加到主屏幕”，以后就像 App 一样打开。</span><button id="hideTip">知道了</button></div>
<input id="fileInput" class="hidden" type="file" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg">
</div>
<script src="./app.js"></script>
</body></html>
