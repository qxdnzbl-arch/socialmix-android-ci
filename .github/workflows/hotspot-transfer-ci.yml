name: Hotspot File Transfer CI

on:
  push:
    branches: [hotspot-file-transfer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile APK and test APK
        run: gradle --no-daemon :transferapp:assembleDebug :transferapp:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android emulator acceptance tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon :transferapp:connectedDebugAndroidTest
            adb install -r transferapp/build/outputs/apk/debug/transferapp-debug.apk
            adb shell am force-stop com.qxdnzbl.hotspotshare || true
            adb shell am start -W -n com.qxdnzbl.hotspotshare/.MainActivity
            sleep 2
            adb shell pidof com.qxdnzbl.hotspotshare
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml | grep '热点传文件'
            adb shell cat /sdcard/window.xml | grep '选择要传的文件'

      - name: Prepare verified APK
        if: success()
        run: |
          mkdir -p deliverable
          cp transferapp/build/outputs/apk/debug/transferapp-debug.apk deliverable/Hotspot-File-Transfer.apk
          sha256sum deliverable/Hotspot-File-Transfer.apk | tee deliverable/SHA256.txt

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hotspot-File-Transfer-Verified
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
