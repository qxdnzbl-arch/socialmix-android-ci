name: Kehua Native Production Acceptance

on:
  push:
    branches:
      - kehua-native-prod-repair

permissions:
  contents: read

concurrency:
  group: kehua-native-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-acceptance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android emulator production acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server 8.8.8.8
          script: |
            adb uninstall com.qxdnzbl.kehua || true
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.suisuinian.app.KehuaNativeE2ETest,com.suisuinian.app.KehuaNativeLaunchTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.qxdnzbl.kehua || true
            adb shell am start -W -n com.qxdnzbl.kehua/com.suisuinian.app.KehuaNativeActivity
            sleep 3
            adb shell pidof com.qxdnzbl.kehua
            mkdir -p deliverable
            adb exec-out screencap -p > deliverable/Kehua-Native.png
            test -s deliverable/Kehua-Native.png

      - name: Prepare deliverable APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/Kehua-Native-Production.apk
          sha256sum deliverable/Kehua-Native-Production.apk > deliverable/SHA256.txt

      - name: Upload accepted APK
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-Native-Production
          path: deliverable/
          if-no-files-found: error
          retention-days: 14