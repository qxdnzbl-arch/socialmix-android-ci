# build-input-revision: v2-newline-fix
name: Build NZBL Private VPN APK

on:
  push:
    branches:
      - nzbl-private-vpn-apk-20261004
    paths:
      - ".github/workflows/nzbl-private-vpn-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout trigger repo
        uses: actions/checkout@v4

      - name: Checkout v2rayNG stable source
        run: |
          git clone --branch 2.2.6 --depth 1 --recurse-submodules --shallow-submodules https://github.com/2dust/v2rayNG.git v2rayng-src

      - name: Apply NZBL multi-node patch
        run: |
          python3 private-vpn/patch_v2.py v2rayng-src
          cp v2rayng-src/V2rayNG/app/src/main/assets/nzbl_nodes.txt /tmp/nzbl-placeholders.txt
          grep -q "autoSelectFinishedAction" v2rayng-src/V2rayNG/app/src/main/java/com/v2ray/ang/viewmodel/MainViewModel.kt
          grep -q "testAllRealPing(autoSelect = true)" v2rayng-src/V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt

      - name: Put temporary verified nodes in debug build
        run: |
          cat > v2rayng-src/V2rayNG/app/src/main/assets/nzbl_nodes.txt <<'EOF'
          vless://22222222-2222-4222-8222-222222222222@kehua-original-verifier.onrender.com:443?encryption=none&security=tls&sni=kehua-original-verifier.onrender.com&type=ws&host=kehua-original-verifier.onrender.com&path=%2Fws-ee876e404c2e8bb99b9b4a63#NZBL-AUTO-Render-SG
          vless://33333333-3333-4333-8333-333333333333@kehua-native-prod-api-production.up.railway.app:443?encryption=none&security=tls&sni=kehua-native-prod-api-production.up.railway.app&type=ws&host=kehua-native-prod-api-production.up.railway.app&path=%2Fws-railway-6f8a1c#NZBL-AUTO-Railway-SG
          EOF

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools emulator"

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          sed -i '10i\
          \
              ndkVersion = "30.0.16248370"' v2rayng-src/V2rayNG/app/build.gradle.kts

      - name: Build libhevtun
        working-directory: v2rayng-src
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r v2rayng-src/libs v2rayng-src/V2rayNG/app

      - name: Resolve Xray AAR tag
        id: xraytag
        run: |
          git -C v2rayng-src/AndroidLibXrayLite fetch --tags --force
          TAG="$(git -C v2rayng-src/AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download libv2ray AAR
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "2dust/AndroidLibXrayLite"
          tag: ${{ steps.xraytag.outputs.tag }}
          fileName: "libv2ray.aar"
          out-file-path: "v2rayng-src/V2rayNG/app/libs/"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: v2rayng-src/V2rayNG
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:compilePlaystoreDebugKotlin :app:assemblePlaystoreDebug

      - name: Collect debug APK
        run: |
          DEBUG_APK="$(find v2rayng-src/V2rayNG/app/build/outputs/apk -type f -name '*x86_64*.apk' | grep '/debug/' | head -1)"
          test -n "$DEBUG_APK"
          cp "$DEBUG_APK" PrivateVPN-x86_64-debug.apk

      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r PrivateVPN-x86_64-debug.apk
            adb shell monkey -p com.nzbl.privatevpn -c android.intent.category.LAUNCHER 1
            sleep 7
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml ui.xml
            grep -q "NZBL-AUTO-Render-SG" ui.xml
            grep -q "NZBL-AUTO-Railway-SG" ui.xml
            adb shell dumpsys activity activities | grep -q "com.nzbl.privatevpn"

      - name: Restore private placeholders and build ARM64 release
        working-directory: v2rayng-src/V2rayNG
        run: |
          cp /tmp/nzbl-placeholders.txt app/src/main/assets/nzbl_nodes.txt
          ./gradlew :app:assemblePlaystoreRelease -PABI_FILTERS=arm64-v8a

      - name: Validate release APK
        run: |
          RELEASE_APK="$(find v2rayng-src/V2rayNG/app/build/outputs/apk -type f -name '*.apk' | grep '/release/' | head -1)"
          test -n "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$RELEASE_APK" | tee apk-badging.txt
          grep -q "package: name='com.nzbl.privatevpn'" apk-badging.txt
          grep -q "application-label:'私人VPN'" apk-badging.txt
          unzip -p "$RELEASE_APK" assets/nzbl_nodes.txt | tee bundled-nodes.txt
          grep -q "render-placeholder.invalid" bundled-nodes.txt
          grep -q "railway-placeholder.invalid" bundled-nodes.txt
          cp "$RELEASE_APK" PrivateVPN-arm64-unsigned.apk

      - name: Collect local signing tools
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/37.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" signing-tools/
          cp "$ANDROID_HOME/build-tools/37.0.0/zipalign" signing-tools/

      - name: Upload final build inputs
        uses: actions/upload-artifact@v4
        with:
          name: private-vpn-v2-build
          retention-days: 3
          path: |
            PrivateVPN-arm64-unsigned.apk
            apk-badging.txt
            bundled-nodes.txt
            ui.xml
            signing-tools/
