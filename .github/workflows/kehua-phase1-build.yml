name: Kehua Phase1 APK

on:
  push:
    branches: [kehua-phase1-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout phase1 branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enforce Phase1 hard gate
        run: python3 ci/kehua_phase1_hard_gate.py

      - name: Build APK and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload compiled APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-Phase1-Compiled
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Native Android acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb uninstall com.qxdnzbl.kehua || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.qxdnzbl.kehua || true
            adb shell monkey -p com.qxdnzbl.kehua -c android.intent.category.LAUNCHER 1
            sleep 4
            adb shell pidof com.qxdnzbl.kehua
            mkdir -p qa-captures
            adb exec-out screencap -p > qa-captures/login.png
            adb shell input tap 540 1980
            sleep 2
            adb exec-out screencap -p > qa-captures/home.png
            adb shell input tap 540 2190
            sleep 2
            adb exec-out screencap -p > qa-captures/messages.png
            adb shell input tap 900 2190
            sleep 2
            adb exec-out screencap -p > qa-captures/profile.png

      - name: Prepare verified APK
        if: success()
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/Kehua-Phase1.apk
          cp qa-captures/*.png deliverable/
          sha256sum deliverable/Kehua-Phase1.apk | tee deliverable/SHA256.txt

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-Phase1-Verified
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
