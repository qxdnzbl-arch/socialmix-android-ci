name: Zhiyin Android Keyboard Acceptance

on:
  push:
    branches:
      - zhiyin-keyboard-verify
    paths:
      - "ci/zhiyin-keyboard/**"
      - ".github/workflows/zhiyin-keyboard-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact candidate
        shell: bash
        run: |
          mkdir -p /tmp/zhiyin-site ci/zhiyin-keyboard/artifacts
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ci/zhiyin-keyboard/zhiyin_v3.9.2.html").read_text()
          marker="function MeetCard(pid, postId, ctx, more) {  const pe = S.people[pid], po = post(postId);"
          assert marker in p, "chunk boundary marker missing"
          p=p.replace(marker, "function MeetCard(pid, postId, ctx, more) {\n  const pe = S.people[pid], po = post(postId);", 1)
          Path("/tmp/zhiyin-site/index.html").write_text(p+"\n")
          PY
          base64 -d ci/zhiyin-keyboard/tail.b64 >> /tmp/zhiyin-site/index.html
          python3 - <<'PY'
          from pathlib import Path
          path=Path("/tmp/zhiyin-site/index.html")
          p=path.read_text()

          p=p.replace(', interactive-widget=resizes-content','')
          p=p.replace(
              '<button class="wcancel" data-a="w-cancel" data-nofocus aria-label="取消编辑并保存草稿">取消</button>',
              '<button class="wcancel" data-a="w-cancel" aria-label="取消编辑并保存草稿">取消</button>',
              1
          )

          needle='.write-wrap.hasdraft:not(.typing) .wcardbox #w-text{pointer-events:none}\n\n'
          css='''/* ===== Android 写页键盘：只处理写页，不改变其他页面 =====
   键盘打开时保留原来的完整编辑页，只把写页底部工具栏抬到键盘上方。 */
@media (max-width:639px){
  html.write-kbd #stage{height:var(--vvmax,100dvh);min-height:var(--vvmax,100dvh)}
  html.write-kbd #phone{height:var(--vvmax,100dvh)!important}
  html.write-kbd .write-wrap.focused .wbar{
    z-index:12;
    background:var(--bg);
    transform:translateY(calc(-1 * var(--kbd-shift,0px)));
  }
}

'''
          assert needle in p
          p=p.replace(needle, needle+css, 1)

          old="T.wFocus = false; T.visOpen = false; T.keyboardOpen = false;\n    if (t) t.blur();"
          new="T.wFocus = false; T.visOpen = false; T.keyboardOpen = false;\n    document.documentElement.classList.remove('write-kbd');\n    if (t) t.blur();"
          assert old in p
          p=p.replace(old,new,1)

          oldvv='''  const vv = () => {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--vvh', h + 'px');
    T.vvMax = Math.max(T.vvMax || 0, h);
    const open = (T.vvMax - h) > 120;
    const wasOpen = !!T.keyboardOpen;
    T.keyboardOpen = open;
    // 安卓用键盘收起键时 focusout 有时不会可靠触发；视口恢复后兜底恢复写页导航。
    if (wasOpen && !open && T.wFocus && topR().r === 'write') {
      T.wFocus = false;
      const t = $('#w-text'); if (t) t.blur();
      if (!T.sheet) render();
    }
  };'''
          newvv='''  const vv = () => {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const root = document.documentElement;
    root.style.setProperty('--vvh', h + 'px');
    T.vvMax = Math.max(T.vvMax || 0, h);
    root.style.setProperty('--vvmax', (T.vvMax || h) + 'px');
    const shift = Math.max(0, (T.vvMax || h) - h);
    root.style.setProperty('--kbd-shift', shift + 'px');
    const open = shift > 120;
    const wasOpen = !!T.keyboardOpen;
    T.keyboardOpen = open;
    root.classList.toggle('write-kbd', !!(open && T.wFocus && topR().r === 'write'));
    // 安卓用键盘收起键时 focusout 有时不会可靠触发；视口恢复后兜底恢复写页导航。
    if (wasOpen && !open && T.wFocus && topR().r === 'write') {
      root.classList.remove('write-kbd');
      T.wFocus = false;
      const t = $('#w-text'); if (t) t.blur();
      if (!T.sheet) render();
    }
  };'''
          assert oldvv in p
          p=p.replace(oldvv,newvv,1)
          path.write_text(p)
          PY
          echo "58625fb468b6ae3fbc127d12266476ca813640631d645d74c235b7f96a20c1ad  /tmp/zhiyin-site/index.html" | sha256sum -c -
          wc -c -l /tmp/zhiyin-site/index.html

      - name: Prepare Android test shell asset
        shell: bash
        run: |
          mkdir -p ci/zhiyin-keyboard/android-shell/app/src/main/assets
          cp /tmp/zhiyin-site/index.html ci/zhiyin-keyboard/android-shell/app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Android test shell
        working-directory: ci/zhiyin-keyboard/android-shell
        run: gradle --no-daemon :app:assembleDebug

      - name: Install test dependency
        run: python3 -m pip install --user websocket-client

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Run on Android emulator with real IME
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r ci/zhiyin-keyboard/android-shell/app/build/outputs/apk/debug/app-debug.apk
            python3 ci/zhiyin-keyboard/run_android_keyboard.py

      - name: Upload acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhiyin-android-keyboard-acceptance
          path: |
            ci/zhiyin-keyboard/artifacts
          if-no-files-found: warn
