name: Dual Phone v5.8 Secure Signed APK
on:
  push:
    branches: [dualphone-v58-private-pairing]
    paths: ['.github/workflows/dual-phone-v58-signed-only.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Native release and installed-upgrade signature
        working-directory: dualphone
        run: |
          set -eu
          base64 -d keystore.b64 > app/shuangjichuan-release.jks
          gradle --no-daemon :app:assembleRelease
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p accepted
          cp app/build/outputs/apk/release/app-release.apk accepted/ShuangJiChuan_v5.8_private_pairing.apk
          sha256sum accepted/ShuangJiChuan_v5.8_private_pairing.apk > accepted/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DualPhone-v58-Private-Signed
          path: dualphone/accepted/
          if-no-files-found: error
          retention-days: 3
