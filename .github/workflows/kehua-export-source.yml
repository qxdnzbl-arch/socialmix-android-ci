name: kehua-export-source
on:
  workflow_dispatch:
  push:
    branches: [kehua-v1133-native-cleanroom]
    paths:
      - '.github/workflows/kehua-export-source.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unpack source
        run: bash kehua-native-bootstrap.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kehua-native-source
          path: kehua-native
