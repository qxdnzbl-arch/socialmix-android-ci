name: Kehua Native APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prove launcher is native
        run: |
          grep -q 'android:name=".KehuaNativeActivity"' app/src/main/AndroidManifest.xml
          ! grep -q 'WebView' app/src/main/java/com/suisuinian/app/KehuaNativeActivity.kt
      - name: Build APK and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-Native-Compiled
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Native Android acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -dns-server 8.8.8.8
          script: |
            adb uninstall com.qxdnzbl.kehua || true
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.suisuinian.app.KehuaNativeE2ETest,com.suisuinian.app.KehuaNativeLaunchTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.qxdnzbl.kehua || true
            adb shell am start -W -n com.qxdnzbl.kehua/com.suisuinian.app.KehuaNativeActivity
            sleep 3
            adb shell pidof com.qxdnzbl.kehua
            mkdir -p deliverable
            adb exec-out screencap -p > deliverable/Kehua-Native.png
            test -s deliverable/Kehua-Native.png
      - name: Prepare verified native APK
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/Kehua-Native-Production.apk
          sha256sum deliverable/Kehua-Native-Production.apk > deliverable/SHA256.txt
      - name: Upload verified native APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-Native-Production
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
