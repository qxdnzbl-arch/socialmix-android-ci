name: Kehua Android Tablet Acceptance

on:
  push:
    branches: [kehua-public-release]
    paths:
      - 'app/**'
      - 'ci/prepare_kehua_release.py'
      - '.github/workflows/kehua-android-tablet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tablet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare public release auth
        run: python3 ci/prepare_kehua_release.py
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Launch on Android tablet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.qxdnzbl.kehua -c android.intent.category.LAUNCHER 1
            sleep 6
            adb shell pidof com.qxdnzbl.kehua
            mkdir -p tablet-artifact
            adb exec-out screencap -p > tablet-artifact/Kehua-Android-Tablet.png
            test -s tablet-artifact/Kehua-Android-Tablet.png
      - name: Upload tablet acceptance screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-Android-Tablet-Verified
          path: tablet-artifact/
          if-no-files-found: error
          retention-days: 14
