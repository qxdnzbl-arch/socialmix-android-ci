name: Build Resonance Android APK

on:
  push:
    branches:
      - resonance-app-build
    paths:
      - "resonance-src/**"
      - ".github/workflows/resonance-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create fresh Expo app
        run: |
          cd /tmp
          npx create-expo-app@latest resonance --template blank --yes

      - name: Apply locked visual source
        run: |
          cp "$GITHUB_WORKSPACE/resonance-src/App.js" /tmp/resonance/App.js
          cp "$GITHUB_WORKSPACE/resonance-src/app.json" /tmp/resonance/app.json

      - name: Generate Android native project
        working-directory: /tmp/resonance
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: /tmp/resonance/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resonance-expression-apk
          path: /tmp/resonance/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
