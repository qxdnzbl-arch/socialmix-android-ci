name: QR Transfer APK CI

on:
  push:
    branches: [transfer-qr-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify live relay health
        run: |
          curl --fail --retry 8 --retry-delay 4 --retry-all-errors --max-time 90 \
            https://oppo-iphone-transfer-qr.onrender.com/health | grep -qx ok

      - name: Build app and instrumentation APKs
        run: gradle --no-daemon :transferqr:assembleDebug :transferqr:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android emulator acceptance and preview
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon :transferqr:connectedDebugAndroidTest
            adb install -r transferqr/build/outputs/apk/debug/transferqr-debug.apk
            adb shell am force-stop com.qxdnzbl.transferqr || true
            adb shell monkey -p com.qxdnzbl.transferqr -c android.intent.category.LAUNCHER 1
            sleep 6
            adb shell pidof com.qxdnzbl.transferqr
            mkdir -p preview
            adb exec-out screencap -p > preview/transfer-qr-preview.png
            test -s preview/transfer-qr-preview.png

      - name: Prepare verified APK
        if: success()
        run: |
          mkdir -p deliverable
          cp transferqr/build/outputs/apk/debug/transferqr-debug.apk deliverable/Phone-Transfer-QR.apk
          cp preview/transfer-qr-preview.png deliverable/transfer-qr-preview.png
          sha256sum deliverable/Phone-Transfer-QR.apk | tee deliverable/SHA256.txt

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Phone-Transfer-QR-Verified
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
