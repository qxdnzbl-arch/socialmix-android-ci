name: kehua-native-android-runtime
on:
  workflow_dispatch:
  push:
    branches: [kehua-v1133-native-cleanroom]
    paths:
      - '.github/workflows/kehua-native-android-runtime.yml'
      - 'kehua_native_bundle_*.b64'
      - 'kehua-native-bootstrap.sh'
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: unpack canonical native source
        run: |
          bash kehua-native-bootstrap.sh
          grep -F 'JSONObject obj(Object... kv)' kehua-native/android/app/src/main/java/com/kehua/revival/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: build release directly from canonical source
        working-directory: kehua-native/android
        run: gradle :app:assembleRelease --stacktrace
      - name: verify production backend embedded
        run: |
          unzip -p kehua-native/android/app/build/outputs/apk/release/app-release.apk classes.dex | strings | grep -F 'https://kehua-api-production.up.railway.app'
          ! unzip -p kehua-native/android/app/build/outputs/apk/release/app-release.apk classes.dex | strings | grep -E 'onrender\.com|render\.com'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r kehua-native/android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W com.kehua.revival/.MainActivity | tee /tmp/am-start.txt
            sleep 4
            adb shell pidof com.kehua.revival | tee /tmp/pid.txt
            test -s /tmp/pid.txt
            adb shell uiautomator dump /data/local/tmp/window.xml
            adb pull /data/local/tmp/window.xml /tmp/window.xml
            adb exec-out screencap -p > /tmp/kehua-runtime.png
            grep -q 'com.kehua.revival' /tmp/window.xml
            ! adb logcat -d | grep -E 'FATAL EXCEPTION.*com.kehua.revival|Process: com.kehua.revival.*FATAL'
      - uses: actions/upload-artifact@v4
        with:
          name: kehua-1.13.3-runtime-accepted
          path: |
            kehua-native/android/app/build/outputs/apk/release/app-release.apk
            /tmp/window.xml
            /tmp/kehua-runtime.png
            /tmp/am-start.txt
