name: Dual Phone v5.7 Signed APK
on:
  push:
    branches: [dualphone-v57-fast-notify]
    paths: ['.github/workflows/dual-phone-v57-apk-only.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build same-signer install-over-old APK
        working-directory: dualphone
        run: |
          base64 -d keystore.b64 > app/shuangjichuan-release.jks
          gradle --no-daemon :app:assembleRelease
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p accepted
          cp app/build/outputs/apk/release/app-release.apk accepted/ShuangJiChuan_v5.7_fast_notify.apk
          sha256sum accepted/ShuangJiChuan_v5.7_fast_notify.apk > accepted/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DualPhone-v57-Signed-APK
          path: dualphone/accepted/
          retention-days: 3
          if-no-files-found: error
