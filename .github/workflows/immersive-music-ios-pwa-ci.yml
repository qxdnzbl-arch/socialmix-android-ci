name: Immersive Music iPhone PWA CI

on:
  push:
    branches: [immersive-music-ios-pwa]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-iphone7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ios-pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run iPhone 7 WebKit acceptance
        run: npm test
