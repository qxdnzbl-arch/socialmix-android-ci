name: Verify installed agent runtime
on:
  push:
    branches: [always-on-agent-v0]
    paths: ['always-on-agent/**', '.github/workflows/agent-bootstrap-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r always-on-agent/requirements.txt pytest==8.4.2
      - run: python -m pytest -q always-on-agent
      - run: git diff --exit-code
