name: Patch always-on agent bootstrap

on:
  push:
    branches: [always-on-agent-v0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: always-on-agent-v0
      - name: Install runtime patches and acceptance checks
        run: |
          python always-on-agent/patch_budget.py
          python always-on-agent/patch_thinking.py
          python always-on-agent/patch_history.py
          python always-on-agent/patch_search.py
          python always-on-agent/patch_search_fallback.py
          python always-on-agent/patch_quality_first.py
          python always-on-agent/patch_action_guard.py
          python always-on-agent/patch_executor_bridge.py
          python always-on-agent/patch_execution_continuity.py
          python always-on-agent/patch_no_passive_wait.py
          python always-on-agent/patch_self_audit_compat.py
          python always-on-agent/patch_self_audit.py
          python -m py_compile always-on-agent/main.py
          python -m pip install -r always-on-agent/requirements.txt
          cd always-on-agent
          python test_self_audit.py
          python test_execution_continuity.py
      - name: Commit patch
        run: |
          if git diff --quiet -- always-on-agent/main.py; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "always-on-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add always-on-agent/main.py
          git commit -m "Enforce no-passive-wait execution continuity"
          git push origin HEAD:always-on-agent-v0
