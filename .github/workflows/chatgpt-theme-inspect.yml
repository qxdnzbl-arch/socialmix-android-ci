name: ChatGPT theme bundle inspect
on:
  push:
    branches: [chatgpt-theme-build-20260907]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact arm64 XAPK
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://d.apkpure.net/b/XAPK/com.openai.chatgpt?nc=arm64-v8a&sv=29&versionCode=2623716' -o chatgpt.xapk
          echo '7b0c10ea7486a83b7d319e37d28cc5dd012be94c  chatgpt.xapk' | sha1sum -c -
          mkdir xapk
          unzip -q chatgpt.xapk -d xapk
          find xapk -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Upload exact bundle
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-1.2026.237-arm64-xapk
          path: chatgpt.xapk
          if-no-files-found: error
          compression-level: 0
