name: Patch DeepSeek compatibility
on:
  push:
    branches: [always-on-agent-v0]
    paths:
      - '.github/workflows/agent-deepseek-compat.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: always-on-agent-v0
      - name: Patch DeepSeek request field
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('always-on-agent/main.py')
          s = p.read_text()
          old = "'max_completion_tokens':1200"
          new = "'max_tokens':1200"
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Expected token field not found')
          PY
      - name: Commit patch
        run: |
          git config user.name 'always-on-agent-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add always-on-agent/main.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Support DeepSeek max_tokens field'
          git push origin HEAD:always-on-agent-v0
