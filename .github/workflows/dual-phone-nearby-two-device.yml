name: Dual Phone Nearby Two Device
on:
  push:
    branches: [dual-phone-transfer-build]
    paths: ['dualphone/ci/run-nearby.txt']
permissions:
  contents: read
jobs:
  nearby:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build debug
        working-directory: dualphone
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Two-emulator Nearby P2P
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -eux
            echo no | avdmanager create avd -n peer2 -k "system-images;android-35;google_apis;x86_64" --device "pixel_6" --force
            "$ANDROID_HOME/emulator/emulator" -avd peer2 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -port 5556 >/tmp/peer2.log 2>&1 &
            for i in $(seq 1 60); do
              BOOT=$(adb -s emulator-5556 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              [ "$BOOT" = "1" ] && break
              sleep 2
            done
            [ "$(adb -s emulator-5556 shell getprop sys.boot_completed | tr -d '\r')" = "1" ]

            for DEV in emulator-5554 emulator-5556; do
              adb -s "$DEV" install -r dualphone/app/build/outputs/apk/debug/app-debug.apk
              adb -s "$DEV" shell pm clear com.qxdnzbl.shuangjichuan.offline
              adb -s "$DEV" shell pm grant com.qxdnzbl.shuangjichuan.offline android.permission.BLUETOOTH_ADVERTISE || true
              adb -s "$DEV" shell pm grant com.qxdnzbl.shuangjichuan.offline android.permission.BLUETOOTH_CONNECT || true
              adb -s "$DEV" shell pm grant com.qxdnzbl.shuangjichuan.offline android.permission.BLUETOOTH_SCAN || true
              adb -s "$DEV" shell pm grant com.qxdnzbl.shuangjichuan.offline android.permission.NEARBY_WIFI_DEVICES || true
              adb -s "$DEV" shell svc data disable || true
              adb -s "$DEV" shell svc wifi disable || true
              adb -s "$DEV" shell cmd bluetooth_manager enable || true
              adb -s "$DEV" logcat -c
            done

            adb -s emulator-5556 shell am start -n com.qxdnzbl.shuangjichuan.offline/com.qxdnzbl.shuangjichuan.MainActivity
            sleep 3
            adb -s emulator-5554 shell am start -n com.qxdnzbl.shuangjichuan.offline/com.qxdnzbl.shuangjichuan.MainActivity --ez ciSend true --ez ciSendFile true

            for i in $(seq 1 90); do
              adb -s emulator-5556 logcat -d -s DualPhoneUi:I "*:S" >/tmp/receiver.log 2>/dev/null || true
              grep -q "messages=2" /tmp/receiver.log && break
              sleep 1
            done
            cat /tmp/receiver.log
            grep -q "messages=2" /tmp/receiver.log
            adb -s emulator-5556 exec-out screencap -p > nearby-receiver.png
