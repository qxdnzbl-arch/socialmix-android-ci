name: Dual Phone Nearby Two Device
on:
  push:
    branches: [dual-phone-transfer-build]
    paths: ['dualphone/ci/run-nearby.txt']
permissions:
  contents: read
jobs:
  nearby:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Restore signing key
        working-directory: dualphone
        run: base64 -d keystore.b64 > app/shuangjichuan-release.jks
      - name: Build debug and signed release
        working-directory: dualphone
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Two-emulator Nearby P2P
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash dualphone/ci/nearby_two_device.sh

      - name: Prepare accepted APK
        run: |
          mkdir -p accepted
          cp dualphone/app/build/outputs/apk/release/app-release.apk accepted/ShuangJiChuan_v5_1_PermissionFix.apk
          cp nearby-receiver.png accepted/nearby-receiver.png
          sha256sum accepted/ShuangJiChuan_v5_1_PermissionFix.apk > accepted/SHA256.txt
      - name: Upload accepted APK
        uses: actions/upload-artifact@v4
        with:
          name: shuangjichuan-v5-1-permission-fix
          path: accepted/
          if-no-files-found: error
          retention-days: 14
