name: Prompt Notebook Polished Acceptance

on:
  push:
    branches:
      - prompt-notebook-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build polished APK
        run: gradle --no-daemon :promptapp:assembleDebug

      - name: Verify APK structure
        run: |
          test -s promptapp/build/outputs/apk/debug/promptapp-debug.apk
          unzip -t promptapp/build/outputs/apk/debug/promptapp-debug.apk >/dev/null

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r promptapp/build/outputs/apk/debug/promptapp-debug.apk
            adb shell am force-stop com.promptnotebook.app || true
            adb shell am start -n com.promptnotebook.app/.MainActivity
            sleep 3
            adb shell pidof com.promptnotebook.app
            adb shell uiautomator dump /sdcard/home.xml >/dev/null
            adb pull /sdcard/home.xml /tmp/home.xml >/dev/null
            grep -q '提示词记事本' /tmp/home.xml
            grep -q '新建提示词' /tmp/home.xml
            grep -q '搜索名称' /tmp/home.xml
            adb shell input tap 850 2180
            sleep 2
            adb shell uiautomator dump /sdcard/editor.xml >/dev/null
            adb pull /sdcard/editor.xml /tmp/editor.xml >/dev/null
            grep -q '新建提示词' /tmp/editor.xml
            grep -q '名称' /tmp/editor.xml
            grep -q '完整提示词' /tmp/editor.xml
            grep -q '保存' /tmp/editor.xml
            adb shell input tap 540 360
            adb shell input text PromptTest
            adb shell input keyevent 4
            adb shell input swipe 540 1700 540 800 450
            adb shell pidof com.promptnotebook.app
            adb shell input tap 965 120
            sleep 2
            adb shell uiautomator dump /sdcard/saved.xml >/dev/null
            adb pull /sdcard/saved.xml /tmp/saved.xml >/dev/null
            grep -q 'PromptTest' /tmp/saved.xml
            adb shell am force-stop com.promptnotebook.app
            adb shell am start -n com.promptnotebook.app/.MainActivity
            sleep 2
            adb shell uiautomator dump /sdcard/relaunch.xml >/dev/null
            adb pull /sdcard/relaunch.xml /tmp/relaunch.xml >/dev/null
            grep -q 'PromptTest' /tmp/relaunch.xml
            adb shell input tap 540 480
            sleep 1
            adb shell uiautomator dump /sdcard/reopen.xml >/dev/null
            adb pull /sdcard/reopen.xml /tmp/reopen.xml >/dev/null
            grep -q '编辑提示词' /tmp/reopen.xml
            adb shell input keyevent 4
            sleep 1
            adb shell pidof com.promptnotebook.app

      - name: Package deliverable
        run: |
          mkdir -p deliverable
          cp promptapp/build/outputs/apk/debug/promptapp-debug.apk deliverable/PromptNotebook-v1.0.0.apk
          sha256sum deliverable/PromptNotebook-v1.0.0.apk > deliverable/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PromptNotebook-Polished-APK
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
