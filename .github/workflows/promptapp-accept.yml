name: Prompt Notebook Polished Acceptance

on:
  push:
    branches:
      - prompt-notebook-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build polished APK
        run: gradle --no-daemon :promptapp:assembleDebug

      - name: Verify APK structure
        run: |
          test -s promptapp/build/outputs/apk/debug/promptapp-debug.apk
          unzip -t promptapp/build/outputs/apk/debug/promptapp-debug.apk >/dev/null

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            APK=promptapp/build/outputs/apk/debug/promptapp-debug.apk
            PKG=com.promptnotebook.app
            ACT=com.promptnotebook.app/.MainActivity

            dump_ui() {
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null
            }

            tap_match() {
              MATCH="$1"
              dump_ui
              python3 - "$MATCH" <<'PY'
import re, sys, xml.etree.ElementTree as ET, subprocess
match=sys.argv[1]
root=ET.parse('/tmp/ui.xml').getroot()
for node in root.iter('node'):
    text=(node.attrib.get('text') or '') + ' ' + (node.attrib.get('content-desc') or '')
    if match in text:
        m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
        if m:
            x1,y1,x2,y2=map(int,m.groups())
            subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
            sys.exit(0)
raise SystemExit('UI match not found: '+match)
PY
            }

            adb install -r "$APK"
            adb shell am force-stop "$PKG" || true
            adb shell am start -n "$ACT"
            sleep 3
            adb shell pidof "$PKG"

            dump_ui
            grep -q '提示词记事本' /tmp/ui.xml
            grep -q '新建提示词' /tmp/ui.xml
            grep -q '搜索名称' /tmp/ui.xml

            tap_match '新建提示词'
            sleep 1
            dump_ui
            grep -q '新建提示词' /tmp/ui.xml
            grep -q '名称' /tmp/ui.xml
            grep -q '完整提示词' /tmp/ui.xml
            grep -q '保存' /tmp/ui.xml

            python3 <<'PY'
import re, xml.etree.ElementTree as ET, subprocess
root=ET.parse('/tmp/ui.xml').getroot()
edits=[n for n in root.iter('node') if n.attrib.get('class')=='android.widget.EditText']
if not edits:
    raise SystemExit('No editable field found')
m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', edits[0].attrib['bounds'])
x1,y1,x2,y2=map(int,m.groups())
subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
PY
            adb shell input text PromptTest
            adb shell input keyevent 4
            adb shell input swipe 540 1700 540 800 450
            adb shell pidof "$PKG"

            tap_match '保存'
            sleep 2
            dump_ui
            grep -q 'PromptTest' /tmp/ui.xml

            adb shell am force-stop "$PKG"
            adb shell am start -n "$ACT"
            sleep 2
            dump_ui
            grep -q 'PromptTest' /tmp/ui.xml

            tap_match 'PromptTest'
            sleep 1
            dump_ui
            grep -q '编辑提示词' /tmp/ui.xml
            adb shell input keyevent 4
            sleep 1
            adb shell pidof "$PKG"

      - name: Package deliverable
        run: |
          mkdir -p deliverable
          cp promptapp/build/outputs/apk/debug/promptapp-debug.apk deliverable/PromptNotebook-v1.0.0.apk
          sha256sum deliverable/PromptNotebook-v1.0.0.apk > deliverable/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PromptNotebook-Polished-APK
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
