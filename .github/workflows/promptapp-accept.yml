name: Prompt Notebook Polished Acceptance

on:
  push:
    branches:
      - prompt-notebook-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build polished APK and test APK
        run: gradle --no-daemon :promptapp:assembleDebug :promptapp:assembleDebugAndroidTest

      - name: Verify APK structure
        run: |
          test -s promptapp/build/outputs/apk/debug/promptapp-debug.apk
          unzip -t promptapp/build/outputs/apk/debug/promptapp-debug.apk >/dev/null

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Real emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon :promptapp:connectedDebugAndroidTest

      - name: Package deliverable
        run: |
          mkdir -p deliverable
          cp promptapp/build/outputs/apk/debug/promptapp-debug.apk deliverable/PromptNotebook-v1.0.0.apk
          sha256sum deliverable/PromptNotebook-v1.0.0.apk > deliverable/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PromptNotebook-Polished-APK
          path: deliverable/
          if-no-files-found: error
          retention-days: 14


      - name: Delivery marker
        run: |
          echo "Acceptance, package, and artifact upload completed."
          exit 1
