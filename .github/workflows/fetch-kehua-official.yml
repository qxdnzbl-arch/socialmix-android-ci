name: Fetch Kehua official screenshots
on:
  push:
    branches: [kehua-original-production]
    paths:
      - .github/workflows/fetch-kehua-official.yml
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download App Store screenshots
        run: |
          mkdir -p refs
          curl -fL --retry 3 'https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/a1/c0/26/a1c02662-ddff-c602-5ecd-ee1999f2ff78/c1396ded-94c8-4478-ad24-f242552f6d24_5.png/1242x2208.png' -o refs/1.png
          curl -fL --retry 3 'https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/60/53/e2/6053e2e8-1220-b10d-6e23-f43d9d8556a1/c8b1ec9f-6cce-426c-9c10-83ca10a94b12_6.png/1242x2208.png' -o refs/2.png
          curl -fL --retry 3 'https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/05/e6/97/05e697ca-1827-0469-c0c4-bf2329e5c2a1/3bbe07b2-5a09-4f7f-bcc7-ff03018862d5_20230811-184749.png/1242x2208.png' -o refs/3.png
          curl -fL --retry 3 'https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/00/9e/d3/009ed38c-06c8-cc6b-5b41-699e493d426a/d2fd9404-965a-4f5a-b17a-f2fe6958d3f4_9.png/1242x2208.png' -o refs/4.png
          curl -fL --retry 3 'https://img.downkuai.com/uppic/20241107/317e37dbc55dfa2313b7e756cd9c25c9.png' -o refs/android-2024-1.png
          curl -fL --retry 3 'https://img.downkuai.com/uppic/20241107/29c6f44f2407d671c529d77aed88a364.png' -o refs/android-2024-2.png
          curl -fL --retry 3 'https://img.downkuai.com/uppic/20241107/66c7358589585f807e8ed1fa7d8d3de0.png' -o refs/android-2024-3.png
          curl -fL --retry 3 'https://img.downkuai.com/uppic/20241107/463ab5aecf4060a4a1ca5b4ea624dbe6.png' -o refs/android-2024-4.png
          python - <<'PY'
import os, re, urllib.request
from html.parser import HTMLParser
from urllib.parse import urljoin
os.makedirs('refs/beihang',exist_ok=True)
url='https://www.beihangsoft.cn/app/3240.html'
req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
open('refs/beihang/page.html','w',encoding='utf-8').write(html)
class P(HTMLParser):
    def __init__(self): super().__init__(); self.items=[]
    def handle_starttag(self,tag,attrs):
        if tag!='img': return
        d=dict(attrs); src=d.get('src') or d.get('data-src') or d.get('data-original')
        if src: self.items.append((d.get('alt',''),urljoin(url,src)))
p=P(); p.feed(html)
seen=set()
for i,(alt,src) in enumerate(p.items):
    if src in seen: continue
    seen.add(src)
    if '可话' not in alt and not re.search(r'app图片|3240',src,re.I): continue
    ext=os.path.splitext(src.split('?')[0])[1] or '.jpg'
    fn=f"refs/beihang/{i:02d}-{re.sub(r'[^0-9A-Za-z\u4e00-\u9fff-]+','_',alt)[:30]}{ext}"
    try:
        data=urllib.request.urlopen(urllib.request.Request(src,headers={'User-Agent':'Mozilla/5.0','Referer':url}),timeout=30).read()
        open(fn,'wb').write(data)
        print(fn, src, len(data))
    except Exception as e: print('ERR',src,e)
PY
          file refs/* refs/beihang/* || true
          sha256sum refs/*.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: kehua-official-appstore-screens
          path: refs
          retention-days: 1
