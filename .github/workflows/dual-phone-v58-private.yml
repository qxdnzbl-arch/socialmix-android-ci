name: Dual Phone v5.8 Private Pairing and E2E Acceptance
on:
  workflow_dispatch:
  push:
    branches: [dualphone-v58-private-pairing]
    paths:
      - 'dualphone/app/**'
      - 'dualphone/acceptance/private_e2e.py'
      - '.github/workflows/dual-phone-v58-private.yml'
permissions:
  contents: read
concurrency:
  group: dualphone-v58-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Security static gates
        run: |
          set -eu
          ! grep -R '6686986c94d4a4d34fd705665b962491078a94688d3f730b568d36a2c526c470' dualphone/app/src/main
          grep -q 'AES/GCM/NoPadding' dualphone/app/src/main/java/com/qxdnzbl/shuangjichuan/PairCrypto.java
          grep -q 'crypto.fromPeer(sender)' dualphone/app/src/main/java/com/qxdnzbl/shuangjichuan/TransferService.java
          grep -q 'encrypted.sjc' dualphone/app/src/main/java/com/qxdnzbl/shuangjichuan/TransferService.java
          grep -q 'pair_secret_v58' dualphone/app/src/main/java/com/qxdnzbl/shuangjichuan/PairCrypto.java
          ! grep -q 'x-dual-token",SECRET' dualphone/app/src/main/java/com/qxdnzbl/shuangjichuan/TransferService.java
      - name: Signed release and debug APK builds
        working-directory: dualphone
        run: |
          set -eu
          base64 -d keystore.b64 > app/shuangjichuan-release.jks
          gradle --no-daemon :app:assembleRelease :app:assembleDebug
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p accepted
          cp app/build/outputs/apk/release/app-release.apk accepted/ShuangJiChuan_v5.8_private_pairing.apk
          sha256sum accepted/ShuangJiChuan_v5.8_private_pairing.apk > accepted/SHA256.txt
      - name: Enable hardware-assisted Android emulator
        run: |
          ls -la /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Android emulator private transfer and system notification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            PKG=com.qxdnzbl.shuangjichuan.offline
            adb root
            adb install -r dualphone/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.qxdnzbl.shuangjichuan.offline android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n com.qxdnzbl.shuangjichuan.offline/com.qxdnzbl.shuangjichuan.MainActivity --es ciPairCode ABCDEFGHJKLMNPQRSTUV --es ciPairPeer 00000000-0000-0000-0000-000000000001
            sleep 7
            adb shell input keyevent 3
            python3 -m pip install --quiet cryptography
            python3 dualphone/acceptance/private_e2e.py
            adb shell am start -W -n com.qxdnzbl.shuangjichuan.offline/com.qxdnzbl.shuangjichuan.MainActivity
            sleep 2
            adb shell uiautomator dump /sdcard/private.xml
            adb pull /sdcard/private.xml dualphone/accepted/private-ui.xml
            grep -q '我的两台手机' dualphone/accepted/private-ui.xml
            adb logcat -d -s AndroidRuntime:E > dualphone/accepted/crash.log
            ! grep -q 'FATAL EXCEPTION' dualphone/accepted/crash.log
            adb exec-out screencap -p > dualphone/accepted/private-chat.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DualPhone-v58-Private-Verified
          path: dualphone/accepted/
          retention-days: 5
          if-no-files-found: error
