name: VoiceForge Offline Android

on:
  workflow_dispatch:
  push:
    branches:
      - voiceforge-offline
    paths:
      - "voiceforge/**"
      - ".github/workflows/voiceforge-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build controller
        uses: actions/checkout@v4
        with:
          ref: voiceforge-offline

      - name: Clone on-device Qwen Android runtime
        run: |
          set -euxo pipefail
          git clone --depth 1 --recurse-submodules https://github.com/Danmoreng/qwen3-tts-android.git work
          git -C work/external/qwen3-tts.cpp fetch --depth 1 origin main
          git -C work/external/qwen3-tts.cpp checkout --detach FETCH_HEAD\n          git -C work/external/qwen3-tts.cpp submodule update --init --recursive

      - name: Apply VoiceForge product patch
        run: |
          set -euxo pipefail
          python3 voiceforge/patch_qwen_android.py work
          grep -n "VoiceDesign\|声音描述\|instruction = _uiState" work/app/src/main/java/com/qwen/tts/android/MainActivity.kt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Build release APK
        working-directory: work
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleRelease

      - name: Verify APK structure and signature
        run: |
          set -euxo pipefail
          APK="work/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee voiceforge-badging.txt
          grep -q "package: name='com.voiceforge.offline'" voiceforge-badging.txt
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" VoiceForge-Offline-arm64-v8a.apk
          sha256sum VoiceForge-Offline-arm64-v8a.apk | tee VoiceForge-Offline-arm64-v8a.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceForge-Offline-arm64-v8a
          path: |
            VoiceForge-Offline-arm64-v8a.apk
            VoiceForge-Offline-arm64-v8a.sha256
            voiceforge-badging.txt
          retention-days: 7
