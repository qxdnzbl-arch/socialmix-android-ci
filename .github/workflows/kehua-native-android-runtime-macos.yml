name: kehua-native-android-runtime-macos
on:
  workflow_dispatch:
  push:
    branches: [kehua-v1133-native-cleanroom]
    paths:
      - '.github/workflows/kehua-native-android-runtime-macos.yml'
jobs:
  runtime:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: unpack native source
        run: bash kehua-native-bootstrap.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: build debug and release
        working-directory: kehua-native/android
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r kehua-native/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.app.tideswing.qa/com.kehua.revival.MainActivity --ez qa_auto_login true | tee /tmp/am-start.txt
            sleep 10
            adb shell pidof com.app.tideswing.qa | tee /tmp/pid.txt
            test -s /tmp/pid.txt
            adb exec-out screencap -p > /tmp/kehua-runtime.png
            test -s /tmp/kehua-runtime.png
            ! adb logcat -d | grep -E 'FATAL EXCEPTION.*com.kehua.revival|Process: com.app.tideswing.qa.*FATAL'
      - uses: actions/upload-artifact@v4
        with:
          name: kehua-1.13.3-runtime-macos
          path: |
            kehua-native/android/app/build/outputs/apk/release/app-release.apk
            /tmp/kehua-runtime.png
            /tmp/am-start.txt
