name: Kehua Original Production Android
on:
  push:
    branches: [kehua-original-production-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify public production endpoint
        run: |
          curl --fail --retry 5 --retry-delay 3 -sS https://kehua-original-production.onrender.com | grep -q '<title>可话</title>'
      - name: Vendor browser runtime
        shell: bash
        run: |
          set -euo pipefail
          entry="$(curl -fsSL 'https://esm.sh/@supabase/supabase-js@2.116.0?bundle')"
          path="$(printf '%s' "$entry" | sed -n 's/.*"\(\/@supabase\/supabase-js@[^"]*bundle.mjs\)".*/\1/p' | head -1)"
          test -n "$path"
          curl -fsSL "https://esm.sh$path" -o app/src/main/assets/supabase.mjs
          test -s app/src/main/assets/supabase.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install and launch on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.qxdnzbl.kehua || true
            adb shell monkey -p com.qxdnzbl.kehua -c android.intent.category.LAUNCHER 1
            ok=0; for i in $(seq 1 25); do sleep 1; adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true; adb pull /sdcard/window.xml /tmp/window.xml >/dev/null 2>&1 || true; if grep -q '可话' /tmp/window.xml 2>/dev/null; then ok=1; break; fi; done; adb shell pidof com.qxdnzbl.kehua; mkdir -p deliverable; adb exec-out screencap -p > deliverable/Kehua-Original-Android.png; test -s deliverable/Kehua-Original-Android.png; test "$ok" = "1"
      - name: Prepare deliverable
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/Kehua-Original.apk
          sha256sum deliverable/Kehua-Original.apk > deliverable/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kehua-Original-Android-Verified
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
