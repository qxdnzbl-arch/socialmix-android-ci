name: Delete old Kehua revival branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-old-kehua-revival.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-old-revival:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only old revival branch
        run: |
          git push origin --delete kehua-revival-v3
