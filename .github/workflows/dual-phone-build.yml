name: Dual Phone Auto WebShell Acceptance

on:
  push:
    branches: [dual-phone-transfer-build]
    paths:
      - 'dualphone/**'
      - '.github/workflows/dual-phone-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: dualphone
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify live web app reachable
        run: curl -fL --max-time 20 https://shuangji-chuan.floot.app/ -o /tmp/live.html && test -s /tmp/live.html
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Emulator visual acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -eux
            mkdir -p deliverable
            adb install -r dualphone/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.qxdnzbl.shuangjichuan.live || true
            adb shell monkey -p com.qxdnzbl.shuangjichuan.live -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof com.qxdnzbl.shuangjichuan.live
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | grep com.qxdnzbl.shuangjichuan.live
            adb exec-out screencap -p > deliverable/01-live-webshell.png
            cp dualphone/app/build/outputs/apk/debug/app-debug.apk deliverable/ShuangJiChuan_v2_AutoUpdate.apk
            sha256sum deliverable/ShuangJiChuan_v2_AutoUpdate.apk > deliverable/SHA256.txt
            test -s deliverable/01-live-webshell.png
            test -s deliverable/ShuangJiChuan_v2_AutoUpdate.apk
      - name: Upload APK and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: dual-phone-auto-v2
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
