name: Dual Phone Install-Once Acceptance
on:
  push:
    branches: [dual-phone-transfer-build]
    paths: ['dualphone/ci/run-acceptance.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dual-phone-install-once
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Restore signing key
        working-directory: dualphone
        run: base64 -d keystore.b64 > app/shuangjichuan-release.jks
      - name: Build signed APK
        working-directory: dualphone
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Verify release
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose dualphone/app/build/outputs/apk/release/app-release.apk
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Offline + no-reinstall OTA acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -eux
            mkdir -p deliverable
            adb install -r dualphone/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.qxdnzbl.shuangjichuan.offline
            adb shell svc data disable || true
            adb shell svc wifi disable || true
            adb logcat -c
            adb shell am start -n com.qxdnzbl.shuangjichuan.offline/com.qxdnzbl.shuangjichuan.MainActivity --ez ciAuto true
            sleep 4
            adb logcat -d -s DualPhoneUi:I '*:S' > deliverable/offline.log
            grep -q 'screen=chat' deliverable/offline.log
            adb exec-out screencap -p > deliverable/01-offline.png

            adb forward tcp:47000 tcp:39732
            python3 dualphone/ci/send_incoming.py 47000
            sleep 2
            adb logcat -d -s DualPhoneUi:I '*:S' > deliverable/incoming.log
            grep -q 'messages=1' deliverable/incoming.log

            python3 -m http.server 8765 --directory dualphone/ci/ota-test >/tmp/ota.log 2>&1 &
            adb reverse tcp:8765 tcp:8765
            adb logcat -c
            adb shell am force-stop com.qxdnzbl.shuangjichuan.offline
            adb shell am start -n com.qxdnzbl.shuangjichuan.offline/com.qxdnzbl.shuangjichuan.MainActivity --ez ciAuto true --es ciManifest http://127.0.0.1:8765/manifest.json
            sleep 5
            adb logcat -d -s DualPhoneOta:I DualPhoneUi:I '*:S' > deliverable/ota.log
            grep -q 'OTA_APPLIED 99' deliverable/ota.log
            grep -q 'OTA_TEST_APPLIED' deliverable/ota.log

            adb shell am force-stop com.qxdnzbl.shuangjichuan.offline
            adb shell svc wifi disable || true
            adb logcat -c
            adb shell am start -n com.qxdnzbl.shuangjichuan.offline/com.qxdnzbl.shuangjichuan.MainActivity --ez ciAuto true
            sleep 3
            adb logcat -d -s DualPhoneUi:I '*:S' > deliverable/persist.log
            grep -q 'OTA_TEST_APPLIED' deliverable/persist.log
            adb exec-out screencap -p > deliverable/02-updated-without-reinstall.png

            cp dualphone/app/build/outputs/apk/release/app-release.apk deliverable/ShuangJiChuan_v4_InstallOnce.apk
            sha256sum deliverable/ShuangJiChuan_v4_InstallOnce.apk > deliverable/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shuangjichuan-v4-install-once
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
