name: Dual Phone Transfer APK

on:
  push:
    branches: [dual-phone-transfer-build]
    paths:
      - 'dualphone/**'
      - '.github/workflows/dual-phone-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: dualphone
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Emulator visual acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -eux
            mkdir -p deliverable
            adb install -r dualphone/app/build/outputs/apk/debug/app-debug.apk

            adb shell am force-stop com.qxdnzbl.shuangjichuan || true
            adb shell monkey -p com.qxdnzbl.shuangjichuan -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > deliverable/01-login.png
            adb shell uiautomator dump /sdcard/login.xml
            adb pull /sdcard/login.xml deliverable/login.xml
            grep -q 'text="双机传"' deliverable/login.xml
            grep -q 'text="登录并进入"' deliverable/login.xml

            adb shell am force-stop com.qxdnzbl.shuangjichuan
            adb shell am start -n com.qxdnzbl.shuangjichuan/.MainActivity --ez demo true
            sleep 4
            adb exec-out screencap -p > deliverable/02-chat.png
            adb shell uiautomator dump /sdcard/chat.xml
            adb pull /sdcard/chat.xml deliverable/chat.xml
            grep -q 'text="我的两台手机"' deliverable/chat.xml
            grep -q 'text="发送"' deliverable/chat.xml

            coords=$(python3 - <<'PY'
import re
s=open('deliverable/chat.xml', encoding='utf-8').read()
m=re.search(r'class="android.widget.EditText"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', s)
if not m:
    raise SystemExit("EditText not found")
x1,y1,x2,y2=map(int,m.groups())
print(f"{(x1+x2)//2},{(y1+y2)//2}")
PY
)
            x=$(echo "$coords" | cut -d, -f1)
            y=$(echo "$coords" | cut -d, -f2)
            adb shell input tap "$x" "$y"
            adb shell input text test
            sleep 2
            adb exec-out screencap -p > deliverable/03-chat-keyboard.png
            adb shell uiautomator dump /sdcard/chat_keyboard.xml
            adb pull /sdcard/chat_keyboard.xml deliverable/chat_keyboard.xml
            grep -q 'text="test"' deliverable/chat_keyboard.xml

            cp dualphone/app/build/outputs/apk/debug/app-debug.apk deliverable/双机传-v1.0.apk
            sha256sum deliverable/双机传-v1.0.apk > deliverable/SHA256.txt
            test -s deliverable/01-login.png
            test -s deliverable/02-chat.png
            test -s deliverable/03-chat-keyboard.png
            test -s deliverable/双机传-v1.0.apk
      - name: Upload APK and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: dual-phone-transfer-v1
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
