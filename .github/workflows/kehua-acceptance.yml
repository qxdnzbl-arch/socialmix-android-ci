name: Kehua Android Acceptance

on:
  push:
    branches: [main]
    paths: ['.github/workflows/kehua-acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kehua-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Kehua production branch
        uses: actions/checkout@v4
        with:
          ref: kehua-firebase-auth-prod
      - name: Prepare release auth and dedicated acceptance test
        run: |
          python3 ci/prepare_kehua_release.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          fixture = Path('app/src/androidTest/java/com/suisuinian/app/CoreResponsivenessAcceptanceTest.kt').read_text(encoding='utf-8')
          pairs = re.findall(r'\.signIn\("([^"]+)",\s*"([^"]+)"\)', fixture)
          if not pairs:
              raise SystemExit('No existing CI auth fixture found')
          email, password = pairs[0]
          out = Path('app/src/androidTest/java/com/suisuinian/app/KehuaReleaseAcceptanceTest.kt')
          out.write_text(f'''package com.suisuinian.app

          import androidx.test.core.app.ActivityScenario
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import androidx.test.platform.app.InstrumentationRegistry
          import kotlinx.coroutines.runBlocking
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class KehuaReleaseAcceptanceTest {{
              @Test
              fun launcherStartsWithoutCrash() {{
                  ActivityScenario.launch(KehuaActivity::class.java).use {{ scenario ->
                      scenario.onActivity {{ activity ->
                          assertFalse(activity.isFinishing)
                          assertFalse(activity.isDestroyed)
                      }}
                  }}
              }}

              @Test
              fun realAuthProfilePublishAndCoreReadsWork() = runBlocking {{
                  val context = InstrumentationRegistry.getInstrumentation().targetContext
                  val api = KehuaApi(context)
                  api.logout()
                  val login = api.signIn("{{email}}", "{{password}}")
                  assertTrue("Kehua login failed: ${{login.message}}", login.success && !login.needsVerification)
                  val profile = api.ensureProfile()
                  assertTrue("Kehua profile missing", profile.id.isNotBlank())
                  val marker = "kehua-release-${{System.currentTimeMillis()}}"
                  val result = api.publish(marker, null)
                  val postId = result.first
                  assertTrue("Kehua publish did not return post id", postId.isNotBlank())
                  assertTrue("Published post not returned by myPosts", api.myPosts().any {{ it.id == postId && it.body == marker }})
                  api.resonances(postId)
                  api.conversations()
                  api.incomingFriendRequests()
                  api.friends()
              }}
          }}
          ''', encoding='utf-8')
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Kehua APK and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Kehua emulator scenario acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb uninstall com.qxdnzbl.kehua || true
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.suisuinian.app.KehuaReleaseAcceptanceTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.qxdnzbl.kehua || true
            adb shell monkey -p com.qxdnzbl.kehua -c android.intent.category.LAUNCHER 1
            sleep 4
            adb shell pidof com.qxdnzbl.kehua
      - name: Prepare verified Kehua APK
        if: success()
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/Kehua-Verified.apk
          sha256sum deliverable/Kehua-Verified.apk | tee deliverable/SHA256.txt
      - name: Upload verified Kehua APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-Android-Verified
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
