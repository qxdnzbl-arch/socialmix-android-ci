name: Agent OpenAI error detail
on:
  push:
    paths:
      - '.github/workflows/agent-openai-error-detail.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: always-on-agent-v0
      - name: Patch safe HTTP error logging
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('always-on-agent/main.py')
          s=p.read_text()
          old="        r=await c.post(LLM_BASE_URL+'/chat/completions',headers={'Authorization':f'Bearer {LLM_API_KEY}'},json=body); r.raise_for_status()\n"
          new="        r=await c.post(LLM_BASE_URL+'/chat/completions',headers={'Authorization':f'Bearer {LLM_API_KEY}'},json=body)\n        if r.status_code >= 400:\n            print('PLANNER_HTTP_ERROR', r.status_code, r.text[:1000], flush=True)\n        r.raise_for_status()\n"
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name always-on-agent-bot
          git config user.email actions@users.noreply.github.com
          git add always-on-agent/main.py
          git commit -m 'Log safe OpenAI planner error details' || exit 0
          git push origin HEAD:always-on-agent-v0
