name: Suishoucun Offline Android
on:
  push:
    branches: [suishoucun-offline]
    paths: ['pocket-notes/**', '.github/workflows/suishoucun.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure native SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Ensure compilation platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore stable signing identity
        uses: actions/cache@v4
        with:
          path: pocket-notes/build/pocket-signing.jks
          key: suishoucun-signing-v1
      - name: Retrieve delivered release for update preservation test
        uses: actions/download-artifact@v4
        with:
          name: Suishoucun-Android
          run-id: 37325204455
          github-token: ${{ github.token }}
          path: pocket-notes/build/previous
      - name: Ensure original signing key
        run: cp pocket-notes/build/previous/build/pocket-signing.jks pocket-notes/build/pocket-signing.jks
      - name: Build native app and acceptance instrumentation
        run: |
          bash pocket-notes/build.sh
          cd pocket-notes
          python3 qa/fixture.py
      - name: Enable accelerated Android
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash pocket-notes/qa/run.sh
      - name: Archive installation file and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Suishoucun-Android
          path: |
            pocket-notes/out/
            pocket-notes/build/pocket-signing.jks
          retention-days: 14
          if-no-files-found: error
