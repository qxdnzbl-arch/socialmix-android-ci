name: Suishoucun Offline Android
on:
  push:
    branches: [suishoucun-offline]
    paths: ['pocket-notes/**', '.github/workflows/suishoucun.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: suishoucun-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-acceptance:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-22.04]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure native SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Ensure compilation platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore stable signing identity
        uses: actions/cache@v4
        with:
          path: pocket-notes/build/pocket-signing.jks
          key: suishoucun-signing-v1
      - name: Retrieve delivered release for update preservation test
        uses: actions/download-artifact@v4
        with:
          name: Suishoucun-Android
          run-id: 37325204455
          github-token: ${{ github.token }}
          path: pocket-notes/build/previous
      - name: Ensure original signing key
        run: cp pocket-notes/build/previous/build/pocket-signing.jks pocket-notes/build/pocket-signing.jks
      - name: Build native app and acceptance instrumentation
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          bash pocket-notes/build.sh
          cd pocket-notes
          python3 qa/fixture.py
      - name: Enable accelerated Android
        if: runner.os == 'Linux'
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-boot-timeout: 600
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -cores 2
          script: bash pocket-notes/qa/run.sh
      - name: Archive installation file and actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Suishoucun-Android-${{ runner.os }}
          path: |
            pocket-notes/out/
            pocket-notes/build/pocket-signing.jks
          retention-days: 14
          if-no-files-found: error

  publish-update:
    needs: native-acceptance
    if: success()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified Linux build
        uses: actions/download-artifact@v4
        with:
          name: Suishoucun-Android-Linux
          path: release
      - name: Publish permanent in-app update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ github.run_number }}
          TITLE: 随手存 1.${{ github.run_number }}
        run: |
          set -euo pipefail
          test -f release/out/Suishoucun.apk
          test -f release/out/SHA256.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/out/Suishoucun.apk release/out/SHA256.txt --clobber
          else
            gh release create "$TAG" release/out/Suishoucun.apk release/out/SHA256.txt --title "$TITLE" --notes "随手存自动更新版本。已通过 Android 真机环境模拟验收、升级保留检查和小屏布局检查。"
          fi
