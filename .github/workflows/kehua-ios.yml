name: Kehua iPhone iPad Client

on:
  push:
    branches: [kehua-public-release]
    paths:
      - 'multiplatform/ios/**'
      - '.github/workflows/kehua-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-launch:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: multiplatform/ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Enforce native interoperable source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Kehua/ContentView.swift')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.task{id in url=await model.signedURL(path)}', '.task(id: path) { url = await model.signedURL(path) }')
          s=s.replace('if status == 401 && authenticated && retry && await refreshIfNeeded() { return try await requestAny(path:path, method:method, body:body, authenticated:true, extra:extra, retry:false) }', 'if status == 401 && authenticated && retry {\n            let refreshed = await refreshIfNeeded()\n            if refreshed { return try await requestAny(path:path, method:method, body:body, authenticated:true, extra:extra, retry:false) }\n        }')
          p.write_text(s,encoding='utf-8')
          assert 'WKWebView' not in s
          assert 'kehua-revival-live.onrender.com' not in s
          for token in ('kehua_publish','kehua_get_resonances','kehua_light','kehua_conversation_list','kehua_message_list','kehua_send_message','kehua_friend_request','kehua_block','kehua_report'):
              assert token in s, token
          assert 'https://nvwdtfnhsyfdopaxdylx.supabase.co' in s
          PY

      - name: Generate production icon
        run: |
          python3 -m venv .icon-venv
          .icon-venv/bin/python -m pip install --quiet 'pillow==11.3.0'
          .icon-venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          p=Path('Kehua/Assets.xcassets/AppIcon.appiconset/icon-1024.png')
          p.parent.mkdir(parents=True,exist_ok=True)
          img=Image.new('RGB',(1024,1024),(244,244,247))
          d=ImageDraw.Draw(img)
          d.rounded_rectangle((88,88,936,936),radius=224,fill=(255,255,255),outline=(231,231,235),width=12)
          d.rounded_rectangle((236,280,788,652),radius=144,fill=(36,36,40))
          d.polygon([(580,624),(688,624),(636,740)],fill=(36,36,40))
          for x in (380,512,644): d.ellipse((x-26,440,x+26,492),fill=(255,62,104))
          img.save(p)
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile universal iPhone iPad app
        run: |
          xcodebuild \
            -project Kehua.xcodeproj \
            -scheme Kehua \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          APP_PATH=$(find build/DerivedData/Build/Products -path '*Release-iphonesimulator/*.app' -print -quit)
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          plutil -lint "$APP_PATH/Info.plist"

      - name: Launch on iPhone and iPad
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY' > /tmp/sim.env
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          candidates=[]
          for runtime, devices in data.items():
              if '.iOS-' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable'):
                      candidates.append((runtime,d['name'],d['udid']))
          iph=[x for x in candidates if x[1].startswith('iPhone')]
          ipa=[x for x in candidates if x[1].startswith('iPad')]
          if not iph or not ipa:
              raise SystemExit('No compatible available iPhone/iPad simulators on runner')
          runtimes=sorted(set(x[0] for x in candidates), reverse=True)
          selected=None
          for runtime in runtimes:
              i1=[x for x in iph if x[0]==runtime]
              i2=[x for x in ipa if x[0]==runtime]
              if i1 and i2:
                  selected=(i1[0],i2[0]); break
          if not selected:
              raise SystemExit('No single installed iOS runtime contains both iPhone and iPad devices')
          print('IPHONE_UDID='+selected[0][2])
          print('IPAD_UDID='+selected[1][2])
          PY
          source /tmp/sim.env
          for SPEC in "iphone:$IPHONE_UDID" "ipad:$IPAD_UDID"; do
            NAME=${SPEC%%:*}
            UDID=${SPEC#*:}
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl uninstall "$UDID" com.qxdnzbl.kehua 2>/dev/null || true
            xcrun simctl install "$UDID" "$APP_PATH"
            xcrun simctl launch "$UDID" com.qxdnzbl.kehua | tee "artifacts/$NAME-launch.txt"
            sleep 8
            xcrun simctl io "$UDID" screenshot "artifacts/Kehua-$NAME.png"
            test -s "artifacts/Kehua-$NAME.png"
            grep -q 'com.qxdnzbl.kehua' "artifacts/$NAME-launch.txt"
            xcrun simctl terminate "$UDID" com.qxdnzbl.kehua || true
          done

      - name: Package simulator build
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/Kehua-iPhone-iPad-Simulator.app.zip
          shasum -a 256 artifacts/Kehua-iPhone-iPad-Simulator.app.zip > artifacts/SHA256.txt

      - name: Upload iPhone iPad verified build
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-iPhone-iPad-Verified
          path: multiplatform/ios/artifacts/
          if-no-files-found: error
          retention-days: 14