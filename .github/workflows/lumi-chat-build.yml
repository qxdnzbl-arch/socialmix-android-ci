name: Build Lumi Chat RMB APK

on:
  push:
    branches: [ lumi-chat-rmb ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumi-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Static checks and build APK
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android UI acceptance test and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: |
            cd lumi-chat
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb shell pm clear com.qxdnzbl.lumichat
            adb shell am start -n com.qxdnzbl.lumichat/.MainActivity
            sleep 2
            adb shell input keyevent 4
            sleep 1
            adb exec-out screencap -p > acceptance-home.png
      - uses: actions/upload-artifact@v4
        with:
          name: lumi-chat-rmb-apk
          path: lumi-chat/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lumi-chat-ui-screenshot
          path: lumi-chat/acceptance-home.png
