name: Build ChatGPT Skin Layer APK

on:
  push:
    branches: [ chatgpt-skin-layer ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumi-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check and build APK
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render preview on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r lumi-chat/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.qxdnzbl.lumichat
            adb shell am start -n com.qxdnzbl.lumichat/.MainActivity --ez preview true
            sleep 4
            adb exec-out screencap -p > lumi-chat/chatgpt-skin-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-skin-layer-apk
          path: lumi-chat/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-skin-preview
          path: lumi-chat/chatgpt-skin-preview.png
