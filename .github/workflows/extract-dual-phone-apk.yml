name: Extract Dual Phone APK and QA

on:
  push:
    branches:
      - tmp/dual-phone-apk-20261004

jobs:
  apk-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download packaged Android build
        run: |
          curl -fL --retry 3             "https://pwabuilder-cloudapk.azurewebsites.net/downloadPackageZip?id=googleplaypackagejob%3Ashuangji-chuan.floot.app%3A535c4908-750a-4bfe-91fe-2ca058c68706"             -o android-package.zip
          mkdir extracted
          unzip -q android-package.zip -d extracted
          APK_PATH="$(find extracted -type f -iname '*.apk' | head -1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" shuangjichuan-v1.0.apk
          ls -lh shuangjichuan-v1.0.apk
          unzip -t shuangjichuan-v1.0.apk >/dev/null

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null

      - name: Mobile visual and interaction QA
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 412, height: 915 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
          });
          const page = await context.newPage();
          const errors = [];
          page.on('console', msg => {
            if (msg.type() === 'error') errors.push('console: ' + msg.text());
          });
          page.on('pageerror', err => errors.push('pageerror: ' + err.message));

          await page.goto('https://shuangji-chuan.floot.app/login', { waitUntil: 'networkidle', timeout: 60000 });
          await page.screenshot({ path: '01-login.png', fullPage: true });

          const metrics = await page.evaluate(() => ({
            innerWidth: window.innerWidth,
            scrollWidth: document.documentElement.scrollWidth,
            innerHeight: window.innerHeight,
            bodyText: document.body.innerText,
          }));
          if (metrics.scrollWidth > metrics.innerWidth + 1) {
            throw new Error('Horizontal overflow on login: ' + JSON.stringify(metrics));
          }
          if (!metrics.bodyText.includes('双机传')) throw new Error('Login title missing');
          if (!metrics.bodyText.includes('登录并进入')) throw new Error('Login button missing');

          const email = `qa-${Date.now()}@example.com`;
          const password = 'QaPass1234';
          await page.getByRole('button', { name: '第一次使用' }).click();
          await page.getByPlaceholder('用同一个邮箱登录两台手机').fill(email);
          await page.getByPlaceholder('至少 8 位').fill(password);
          await page.getByRole('button', { name: '创建并进入' }).click();
          await page.waitForURL('**/', { timeout: 30000 });
          await page.getByPlaceholder('输入消息').waitFor({ state: 'visible', timeout: 30000 });
          await page.screenshot({ path: '02-chat-empty.png', fullPage: true });

          await page.getByPlaceholder('输入消息').fill('双机传自动验收消息');
          await page.getByRole('button', { name: '发送' }).click();
          await page.getByText('双机传自动验收消息').waitFor({ state: 'visible', timeout: 20000 });

          fs.writeFileSync('qa-file.txt', 'dual phone file transfer QA');
          const chooserPromise = page.waitForEvent('filechooser');
          await page.getByRole('button', { name: '发送文件' }).click();
          const chooser = await chooserPromise;
          await chooser.setFiles('qa-file.txt');
          await page.getByText('qa-file.txt').waitFor({ state: 'visible', timeout: 30000 });
          await page.screenshot({ path: '03-chat-message-file.png', fullPage: true });

          const chatMetrics = await page.evaluate(() => {
            const vv = window.visualViewport;
            const composer = document.querySelector('footer');
            const input = document.querySelector('textarea');
            const send = [...document.querySelectorAll('button')].find(b => b.getAttribute('aria-label') === '发送');
            const rect = el => el ? el.getBoundingClientRect().toJSON() : null;
            return {
              innerWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              viewportHeight: vv?.height ?? window.innerHeight,
              composer: rect(composer),
              input: rect(input),
              send: rect(send),
            };
          });
          if (chatMetrics.scrollWidth > chatMetrics.innerWidth + 1) {
            throw new Error('Horizontal overflow on chat: ' + JSON.stringify(chatMetrics));
          }
          for (const [name, rect] of Object.entries({ input: chatMetrics.input, send: chatMetrics.send })) {
            if (!rect || rect.left < -1 || rect.right > chatMetrics.innerWidth + 1 || rect.bottom > chatMetrics.viewportHeight + 1) {
              throw new Error(name + ' outside viewport: ' + JSON.stringify(chatMetrics));
            }
          }

          await page.getByPlaceholder('输入消息').focus();
          await page.evaluate(() => {
            Object.defineProperty(window, 'visualViewport', {
              configurable: true,
              value: { width: 412, height: 560, offsetTop: 0, offsetLeft: 0, scale: 1, addEventListener(){}, removeEventListener(){} }
            });
            window.dispatchEvent(new Event('resize'));
          });
          const keyboardMetrics = await page.evaluate(() => {
            const composer = document.querySelector('footer');
            const input = document.querySelector('textarea');
            const send = [...document.querySelectorAll('button')].find(b => b.getAttribute('aria-label') === '发送');
            const rect = el => el ? el.getBoundingClientRect().toJSON() : null;
            return { composer: rect(composer), input: rect(input), send: rect(send), h: 560 };
          });
          await page.screenshot({ path: '04-keyboard-sim.png', fullPage: false });
          for (const [name, rect] of Object.entries({ input: keyboardMetrics.input, send: keyboardMetrics.send })) {
            if (!rect || rect.bottom > keyboardMetrics.h + 1) {
              throw new Error(name + ' clipped by keyboard simulation: ' + JSON.stringify(keyboardMetrics));
            }
          }

          if (errors.length) throw new Error('Browser errors: ' + errors.join(' | '));
          fs.writeFileSync('qa-result.json', JSON.stringify({
            ok: true,
            login: metrics,
            chat: chatMetrics,
            keyboard: keyboardMetrics,
          }, null, 2));
          await browser.close();
          EOF
          node qa.mjs

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shuangjichuan-apk
          path: shuangjichuan-v1.0.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: shuangjichuan-qa
          path: |
            01-login.png
            02-chat-empty.png
            03-chat-message-file.png
            04-keyboard-sim.png
            qa-result.json
          if-no-files-found: error
          retention-days: 3
