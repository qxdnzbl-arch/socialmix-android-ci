name: Prompt Notebook APK

on:
  push:
    branches: [prompt-notebook-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prompt-notebook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Smoke-check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - name: Package
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/PromptNotebook-v1.0.0.apk
          sha256sum deliverable/PromptNotebook-v1.0.0.apk > deliverable/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PromptNotebook-APK
          path: prompt-notebook/deliverable/
          if-no-files-found: error
          retention-days: 14
