name: Prompt Notebook APK

on:
  push:
    branches: [prompt-notebook-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prompt-notebook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Package structure check
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Real emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            click_text() {
              local target="$1"
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null
              read X Y < <(python3 - "$target" <<'PY'
import re,sys,xml.etree.ElementTree as ET
target=sys.argv[1]
root=ET.parse('/tmp/ui.xml').getroot()
for n in root.iter('node'):
    if n.attrib.get('text')==target:
        m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib['bounds'])
        if m:
            x1,y1,x2,y2=map(int,m.groups())
            print((x1+x2)//2,(y1+y2)//2)
            raise SystemExit
raise SystemExit(1)
PY
)
              adb shell input tap "$X" "$Y"
            }
            click_first_edittext() {
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null
              read X Y < <(python3 - <<'PY'
import re,xml.etree.ElementTree as ET
root=ET.parse('/tmp/ui.xml').getroot()
for n in root.iter('node'):
    if n.attrib.get('class')=='android.widget.EditText':
        m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib['bounds'])
        if m:
            x1,y1,x2,y2=map(int,m.groups())
            print((x1+x2)//2,(y1+y2)//2)
            raise SystemExit
raise SystemExit(1)
PY
)
              adb shell input tap "$X" "$Y"
            }

            adb install -r prompt-notebook/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.nzbl.promptbook || true
            adb shell am start -n com.nzbl.promptbook/.MainActivity
            sleep 3
            adb shell pidof com.nzbl.promptbook

            adb shell uiautomator dump /sdcard/home.xml >/dev/null
            adb pull /sdcard/home.xml /tmp/home.xml >/dev/null
            grep -q '提示词本' /tmp/home.xml
            grep -q '新建提示词' /tmp/home.xml

            click_text '＋  新建提示词'
            sleep 1
            adb shell uiautomator dump /sdcard/editor.xml >/dev/null
            adb pull /sdcard/editor.xml /tmp/editor.xml >/dev/null
            grep -q '完整提示词' /tmp/editor.xml
            grep -q '保存' /tmp/editor.xml

            click_first_edittext
            adb shell input text PromptTest
            adb shell input keyevent 4
            sleep 1
            click_text '保存'
            sleep 2

            adb shell uiautomator dump /sdcard/saved.xml >/dev/null
            adb pull /sdcard/saved.xml /tmp/saved.xml >/dev/null
            grep -q 'PromptTest' /tmp/saved.xml

            adb shell am force-stop com.nzbl.promptbook
            adb shell am start -n com.nzbl.promptbook/.MainActivity
            sleep 2
            adb shell uiautomator dump /sdcard/relaunch.xml >/dev/null
            adb pull /sdcard/relaunch.xml /tmp/relaunch.xml >/dev/null
            grep -q 'PromptTest' /tmp/relaunch.xml
      - name: Package
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/PromptNotebook-v1.0.0.apk
          sha256sum deliverable/PromptNotebook-v1.0.0.apk > deliverable/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PromptNotebook-APK
          path: prompt-notebook/deliverable/
          if-no-files-found: error
          retention-days: 14
