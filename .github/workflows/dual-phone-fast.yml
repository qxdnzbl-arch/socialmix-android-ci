name: Dual Phone Fast APK

on:
  push:
    branches: [dual-phone-transfer-build]
    paths:
      - 'dualphone/**'
      - '.github/workflows/dual-phone-fast.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: dualphone
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p deliverable-fast
          cp dualphone/app/build/outputs/apk/debug/app-debug.apk deliverable-fast/双机传-v1.1-极速同步.apk
          sha256sum deliverable-fast/双机传-v1.1-极速同步.apk > deliverable-fast/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dual-phone-fast-v1.1
          path: deliverable-fast/
          retention-days: 14
