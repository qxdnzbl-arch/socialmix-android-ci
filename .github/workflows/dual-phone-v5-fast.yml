name: Dual Phone V5 Fast APK
on:
  push:
    branches: [dual-phone-transfer-build]
    paths: ['dualphone/ci/run-fast.txt']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Restore signing key
        working-directory: dualphone
        run: base64 -d keystore.b64 > app/shuangjichuan-release.jks
      - name: Build signed APK
        working-directory: dualphone
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare
        run: |
          mkdir -p deliverable-fast
          cp dualphone/app/build/outputs/apk/release/app-release.apk deliverable-fast/ShuangJiChuan_v5_Final.apk
          sha256sum deliverable-fast/ShuangJiChuan_v5_Final.apk > deliverable-fast/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shuangjichuan-v5-fast
          path: deliverable-fast/
          if-no-files-found: error
          retention-days: 14
