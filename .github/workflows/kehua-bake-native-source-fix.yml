name: kehua-bake-native-source-fix
on:
  workflow_dispatch:
  push:
    branches: [kehua-v1133-native-cleanroom]
    paths:
      - '.github/workflows/kehua-bake-native-source-fix.yml'
      - 'kehua-native/android/app/src/main/java/com/kehua/revival/MainActivity.java'
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kehua-v1133-native-cleanroom
          fetch-depth: 0
      - name: preserve canonical Android UI source
        run: cp kehua-native/android/app/src/main/java/com/kehua/revival/MainActivity.java /tmp/MainActivity.java
      - name: unpack current native bundle
        run: bash kehua-native-bootstrap.sh
      - name: replace bundled Android source with canonical UI
        run: |
          cp /tmp/MainActivity.java kehua-native/android/app/src/main/java/com/kehua/revival/MainActivity.java
          grep -F '此刻，说你想说的话～' kehua-native/android/app/src/main/java/com/kehua/revival/MainActivity.java
          grep -F 'https://kehua-api-production.up.railway.app' kehua-native/android/app/src/main/java/com/kehua/revival/MainActivity.java || true
      - name: repack canonical native bundle
        shell: bash
        run: |
          rm -f kehua_native_bundle.tar.gz kehua_native_bundle_0*.b64
          tar -czf kehua_native_bundle.tar.gz kehua-native
          python - <<'PY'
          from pathlib import Path
          import base64, math
          raw=base64.b64encode(Path('kehua_native_bundle.tar.gz').read_bytes()).decode()
          n=4
          chunk=math.ceil(len(raw)/n)
          for i in range(n):
              Path(f'kehua_native_bundle_0{i}.b64').write_text(raw[i*chunk:(i+1)*chunk]+'\n')
          PY
          bash kehua-native-bootstrap.sh
          grep -F '此刻，说你想说的话～' kehua-native/android/app/src/main/java/com/kehua/revival/MainActivity.java
      - name: commit baked source
        shell: bash
        run: |
          git config user.name "kehua-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kehua_native_bundle_00.b64 kehua_native_bundle_01.b64 kehua_native_bundle_02.b64 kehua_native_bundle_03.b64
          if git diff --cached --quiet; then
            echo "already baked"
          else
            git commit -m "Bake canonical Kehua Android UI into native source bundle"
            git push origin HEAD:kehua-v1133-native-cleanroom
          fi
