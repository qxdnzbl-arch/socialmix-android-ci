name: Dual Phone v5.8.1 Accurate Delivery Receipt
on:
  push:
    branches: [dualphone-v581-receipt-accuracy]
    paths:
      - ".github/workflows/dual-phone-v581-receipt-fix.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Exact receipt wording and no regression
        run: |
          set -eu
          FILE=dualphone/app/src/main/java/com/qxdnzbl/shuangjichuan/TransferService.java
          grep -Fq '消息已到达另一台手机' "$FILE"
          ! grep -Fq '另一台手机已收到并保存' "$FILE"
          grep -Fq 'ackRelay(base,id)' "$FILE"
          grep -Fq 'crypto.fromPeer(sender)' "$FILE"
          grep -Fq 'versionCode 581' dualphone/app/build.gradle
      - name: Build signed install-in-place APK
        working-directory: dualphone
        run: |
          set -eu
          base64 -d keystore.b64 > app/shuangjichuan-release.jks
          gradle --no-daemon :app:assembleRelease
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p accepted
          cp app/build/outputs/apk/release/app-release.apk accepted/ShuangJiChuan_v5.8.1_accurate_receipt.apk
          sha256sum accepted/ShuangJiChuan_v5.8.1_accurate_receipt.apk > accepted/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DualPhone-v581-Accurate-Receipt
          path: dualphone/accepted/
          retention-days: 3
          if-no-files-found: error
