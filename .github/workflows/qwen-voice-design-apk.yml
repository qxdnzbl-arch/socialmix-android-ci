name: Build Qwen VoiceDesign APK

on:
  push:
    branches:
      - qwen-voice-design-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager --install             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.2.12479018"             "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch upstream Android app
        run: |
          git clone --recurse-submodules https://github.com/Danmoreng/qwen3-tts-android.git upstream
          cd upstream
          git checkout 35738304b31c425cc08fb5405372fedfd6531b3b
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Apply VoiceDesign patch
        run: |
          python3 voice-design-build/patch.py "$GITHUB_WORKSPACE/upstream"
          grep -n "qwen-talker-1.7b-voicedesign-Q4_K_M.gguf" upstream/app/src/main/java/com/qwen/tts/android/MainActivity.kt
          grep -n "instruction = _uiState.value.instruction" upstream/app/src/main/java/com/qwen/tts/android/MainActivity.kt

      - name: Build release APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Static APK validation
        run: |
          APK=upstream/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libqwen3_tts_jni.so"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -20
          ls -lh "$APK"

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp upstream/app/build/outputs/apk/release/app-release.apk artifacts/QwenVoiceDesign_Android_arm64_v0.2.0.apk
          sha256sum artifacts/QwenVoiceDesign_Android_arm64_v0.2.0.apk > artifacts/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenVoiceDesign-Android-v0.2.0
          path: |
            artifacts/QwenVoiceDesign_Android_arm64_v0.2.0.apk
            artifacts/SHA256.txt
          if-no-files-found: error
