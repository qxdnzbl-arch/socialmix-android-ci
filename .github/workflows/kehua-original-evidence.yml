name: Kehua Original Evidence

on:
  push:
    branches: [kehua-original-evidence-rebuild]
    paths:
      - ".github/workflows/kehua-original-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collect verified original references
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence
          curl -L --fail --retry 3             'https://raw.githubusercontent.com/SkeathyTomas/img/main/img/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20220216004426.jpg'             -o evidence/original-home-v1.7.6.jpg
          curl -L --fail --retry 3             'https://raw.githubusercontent.com/SkeathyTomas/img/main/img/image-20220218001548382.png'             -o evidence/original-finding-resonance-v1.7.6.png
          curl -L --fail --retry 3             'https://is5-ssl.mzstatic.com/image/thumb/PurpleSource126/v4/31/cc/d2/31ccd2ab-0c86-4dca-1bff-5fc7b4913043/6f025b78-22df-4587-b354-25786bfc3328_2.png/600x0w.webp'             -o evidence/original-light-conversation.webp
          curl -L --fail --retry 3             'https://is4-ssl.mzstatic.com/image/thumb/PurpleSource126/v4/67/76/59/677659ce-5a4a-3c9f-2467-df290d924249/597602f6-8ed2-4ae3-9018-86fbe03778c5_3.png/600x0w.webp'             -o evidence/original-dynamic-messages.webp
          curl -L --fail --retry 3             'https://skeathytomas.github.io/post/%E8%81%8A%E4%B8%80%E8%81%8A%E7%A4%BE%E4%BA%A4%E2%80%94%E2%80%94%E5%8F%AF%E8%AF%9Dapp%E4%BA%A7%E5%93%81%E4%BD%93%E9%AA%8C%E6%89%8B%E8%AE%B0/'             -o evidence/source-article.html
          sha256sum evidence/* > evidence/SHA256.txt
          file evidence/*
      - uses: actions/upload-artifact@v4
        with:
          name: Kehua-Original-Evidence
          path: evidence
          if-no-files-found: error
