name: Prompt Notebook APK

on:
  push:
    branches:
      - prompt-notebook-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable debug APK
        run: gradle :promptapp:assembleDebug --stacktrace

      - name: Rename APK
        run: cp promptapp/build/outputs/apk/debug/promptapp-debug.apk prompt-notebook.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prompt-notebook-apk
          path: prompt-notebook.apk
          if-no-files-found: error
