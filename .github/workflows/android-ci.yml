name: Kehua Android Acceptance

on:
  push:
    branches: [main, socialmix-chat-production-core, kehua-firebase-auth-prod, kehua-public-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-acceptance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare public release auth
        run: |
          python3 ci/prepare_kehua_release.py
          ! grep -R "com.google.firebase\|FirebaseAuth\|FirebaseApp\|FirebaseOptions\|awaitTask" app/src/main/java/com/suisuinian/app/KehuaApi.kt

      - name: Build debug APK and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android emulator acceptance tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb uninstall com.qxdnzbl.kehua || true
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.qxdnzbl.kehua || true
            adb shell monkey -p com.qxdnzbl.kehua -c android.intent.category.LAUNCHER 1
            sleep 4
            adb shell pidof com.qxdnzbl.kehua

      - name: Build unsigned release APK
        if: success()
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare release candidate and signing tools
        if: success()
        run: |
          set -euo pipefail
          mkdir -p release-package/signing-tools/lib
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-package/Kehua-Release-Unsigned.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          cp "$BT/apksigner" release-package/signing-tools/apksigner
          cp "$BT/zipalign" release-package/signing-tools/zipalign
          cp "$BT/lib/apksigner.jar" release-package/signing-tools/lib/apksigner.jar
          sha256sum release-package/Kehua-Release-Unsigned.apk | tee release-package/UNSIGNED-SHA256.txt

      - name: Upload unsigned release package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-Android-Release-Unsigned
          path: release-package/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare verified debug APK
        if: success()
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/Kehua-Verified.apk
          sha256sum deliverable/Kehua-Verified.apk | tee deliverable/SHA256.txt

      - name: Upload verified debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-Android-Verified
          path: deliverable/
          if-no-files-found: error
          retention-days: 14