name: SocialMix Android CI

on:
  push:
    branches: [main, socialmix-chat-production-core]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-acceptance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Phase 1 auth fixtures
        run: |
          curl --fail-with-body -sS -X POST \
            'https://nvwdtfnhsyfdopaxdylx.supabase.co/functions/v1/ensure-phase1-test-fixtures' \
            -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_S4IE-ziO7WQ_JAK9tuQGgQ_cszwKBWB' \
            -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52d2R0Zm5oc3lmZG9wYXhkeWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTExNTcsImV4cCI6MjEwMzU4NzE1N30.wXmcZ6KIQOt-eet6ONUgl9HI1eJhJAofdf2_JPD_0Ek' \
            -d '{}'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android emulator acceptance tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb uninstall com.socialmix.experiment.b || true
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.socialmix.experiment.b || true
            adb shell monkey -p com.socialmix.experiment.b -c android.intent.category.LAUNCHER 1
            sleep 4
            adb shell pidof com.socialmix.experiment.b

      - name: Prepare deliverable APK
        if: success()
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/SocialMix-Chat-Production-Core.apk
          sha256sum deliverable/SocialMix-Chat-Production-Core.apk | tee deliverable/SHA256.txt

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SocialMix-Chat-Production-Core-Verified
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
