name: Immersive Music Phase 1 CI

on:
  push:
    branches: [music-immersive-phase1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply confirmed NetEase-reference UI corrections
        run: |
          python ci/refine_netease_ui.py
          python ci/final_tonearm.py
          python ci/final_visual_alignment.py
          python ci/final_visual_polish.py
          python ci/user_requested_v79.py
          python ci/user_requested_v80.py
          python ci/user_requested_v81.py
          python ci/user_requested_v82.py
          python ci/user_requested_v82_fix.py
          python ci/user_requested_v83.py
          python ci/user_requested_v84.py
          python ci/user_requested_v85.py
          python ci/user_requested_v86.py
          python ci/user_requested_v87.py
          python ci/user_requested_v88.py
          python ci/user_requested_v89.py
          python ci/user_requested_v90.py
          python ci/user_requested_v90_fix.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Emulator acceptance tests and visual capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.immersive.music android.permission.READ_MEDIA_AUDIO || true
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.immersive.music.Phase1AcceptanceTest

            adb shell pm clear com.immersive.music || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.immersive.music android.permission.READ_MEDIA_AUDIO || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1 || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/window.xml 2>/dev/null | grep -q "Pixel Launcher isn't responding" && adb shell input tap 410 1235 || true

            adb shell am force-stop com.immersive.music || true
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.immersive.music/com.immersive.music.MainActivity
            sleep 4
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1 || true
            adb shell am start -W -n com.immersive.music/com.immersive.music.MainActivity >/dev/null
            sleep 1
            adb shell pidof com.immersive.music
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.immersive.music'
            mkdir -p deliverable
            adb exec-out screencap -p > deliverable/home-paused.png

            adb shell input tap 800 1735
            sleep 1
            adb exec-out screencap -p > deliverable/home-single-loop.png
            adb shell input tap 800 1735
            sleep 1

            adb shell input tap 952 1735
            sleep 2
            adb exec-out screencap -p > deliverable/queue-empty.png
            adb shell input keyevent KEYCODE_BACK || true
            sleep 1

            adb shell input tap 815 2250
            sleep 2
            adb exec-out screencap -p > deliverable/library-empty.png

            adb shell input tap 270 2250
            sleep 1
            adb shell input tap 950 220
            sleep 2
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null 2>&1 || true
            adb exec-out screencap -p > deliverable/search-screen.png

      - name: Prepare deliverable
        if: success()
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/Immersive-Music-v90.apk
          cp SPEC-music-phase1.md deliverable/SPEC-music-phase1.md
          sha256sum deliverable/Immersive-Music-v90.apk | tee deliverable/SHA256.txt

      - name: Upload verified deliverable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Immersive-Music-v90-Verified
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
