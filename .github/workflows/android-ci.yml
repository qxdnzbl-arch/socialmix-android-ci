name: Immersive Music Phase 1 CI

on:
  push:
    branches: [music-immersive-phase1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Emulator acceptance tests and visual capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.immersive.music android.permission.READ_MEDIA_AUDIO || true

            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.immersive.music.Phase1AcceptanceTest

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.immersive.music android.permission.READ_MEDIA_AUDIO || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am force-stop com.immersive.music || true
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.immersive.music/com.immersive.music.MainActivity
            sleep 5

            adb shell pidof com.immersive.music
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.immersive.music'
            mkdir -p deliverable

            adb shell uiautomator dump /sdcard/home-paused.xml
            adb pull /sdcard/home-paused.xml home-paused.xml
            grep '心动' home-paused.xml
            grep 'First Light' home-paused.xml
            grep '唱针:唱片外' home-paused.xml
            grep '播放' home-paused.xml
            adb exec-out screencap -p > deliverable/home-paused.png

            adb shell input tap 540 2020
            sleep 1
            adb shell uiautomator dump /sdcard/home-playing.xml
            adb pull /sdcard/home-playing.xml home-playing.xml
            grep '唱针:唱片上' home-playing.xml
            grep '暂停' home-playing.xml
            adb exec-out screencap -p > deliverable/home-playing.png

            adb shell input tap 850 2020
            sleep 1
            adb shell uiautomator dump /sdcard/home-next.xml
            adb pull /sdcard/home-next.xml home-next.xml
            grep 'Blue Hour' home-next.xml
            grep '唱针:唱片上' home-next.xml
            grep '暂停' home-next.xml

            adb shell input tap 230 2020
            sleep 1
            adb shell uiautomator dump /sdcard/home-previous.xml
            adb pull /sdcard/home-previous.xml home-previous.xml
            grep 'First Light' home-previous.xml
            grep '唱针:唱片上' home-previous.xml
            grep '暂停' home-previous.xml

            adb shell input tap 540 2020
            sleep 1
            adb shell uiautomator dump /sdcard/home-paused-again.xml
            adb pull /sdcard/home-paused-again.xml home-paused-again.xml
            grep '唱针:唱片外' home-paused-again.xml
            grep '播放' home-paused-again.xml

            adb shell input tap 850 2260
            sleep 2
            adb shell uiautomator dump /sdcard/library-window.xml
            adb pull /sdcard/library-window.xml library-window.xml
            grep '音乐库' library-window.xml
            grep '我喜欢的音乐' library-window.xml
            grep '本地音乐' library-window.xml
            grep '最近播放' library-window.xml
            adb exec-out screencap -p > deliverable/library-screen.png

            adb shell input tap 975 175
            sleep 2
            adb shell uiautomator dump /sdcard/local-picker.xml
            adb pull /sdcard/local-picker.xml local-picker.xml
            grep '选择手机音乐' local-picker.xml
            adb exec-out screencap -p > deliverable/local-picker-screen.png
            adb shell input keyevent KEYCODE_BACK
            sleep 1

            adb shell input tap 220 2260
            sleep 1
            adb shell input tap 965 165
            sleep 2
            adb shell uiautomator dump /sdcard/search-window.xml
            adb pull /sdcard/search-window.xml search-window.xml
            grep '搜索歌曲或歌手' search-window.xml
            grep '只搜索你的歌曲' search-window.xml
            adb exec-out screencap -p > deliverable/search-screen.png

      - name: Prepare deliverable
        if: success()
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/Immersive-Music-Phase1.apk
          cp SPEC-music-phase1.md deliverable/SPEC-music-phase1.md
          sha256sum deliverable/Immersive-Music-Phase1.apk | tee deliverable/SHA256.txt

      - name: Upload verified deliverable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Immersive-Music-Phase1-Verified
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
