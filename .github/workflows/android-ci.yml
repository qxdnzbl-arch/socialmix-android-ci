name: Kehua Native Production Acceptance

on:
  push:
    branches: [kehua-native-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout native production
        uses: actions/checkout@v4

      - name: Reject WebView runtime
        run: |
          test ! -f app/src/main/java/com/suisuinian/app/KehuaActivity.kt
          test ! -f app/src/main/assets/kehua.html
          grep -q 'android:name=".KehuaNativeActivity"' app/src/main/AndroidManifest.xml
          ! grep -R "WebView" app/src/main/java app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build native APK and instrumentation APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Native UI + real backend acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb uninstall com.qxdnzbl.kehua || true
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.qxdnzbl.kehua || true
            adb shell monkey -p com.qxdnzbl.kehua -c android.intent.category.LAUNCHER 1
            sleep 4
            adb shell pidof com.qxdnzbl.kehua
            mkdir -p deliverable
            adb exec-out screencap -p > deliverable/Kehua-Native-Launch.png

      - name: Package native APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/Kehua-Native-Public.apk
          sha256sum deliverable/Kehua-Native-Public.apk | tee deliverable/SHA256.txt

      - name: Upload native APK and launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-Native-Public
          path: deliverable/
          if-no-files-found: error
          retention-days: 30
