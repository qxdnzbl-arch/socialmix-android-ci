name: SocialMix Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Phase 1 auth fixtures
        run: |
          curl --fail-with-body -sS -X POST \
            'https://nvwdtfnhsyfdopaxdylx.supabase.co/functions/v1/ensure-phase1-test-fixtures' \
            -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_S4IE-ziO7WQ_JAK9tuQGgQ_cszwKBWB' \
            -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52d2R0Zm5oc3lmZG9wYXhkeWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTExNTcsImV4cCI6MjEwMzU4NzE1N30.wXmcZ6KIQOt-eet6ONUgl9HI1eJhJAofdf2_JPD_0Ek' \
            -d '{}'

      - name: Apply Phase 1 signup fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/suisuinian/app/SupabaseApi.kt')
          s = p.read_text()
          old = '''            val json = callAuth("/auth/v1/signup", payload)\n            val user = json.optJSONObject("user")\n                ?: return@withContext AuthResult(false, message = errorText(json, "注册失败"))\n            val token = json.optString("access_token")'''
          new = '''            val json = callAuth("/auth/v1/signup", payload)\n            // A successful signup can legitimately return no session while email confirmation is required.\n            val token = json.optString("access_token")'''
          if old not in s:
              raise SystemExit('signup patch target not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Apply realtime readiness fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/suisuinian/app/SupabaseApi.kt')
          s = p.read_text()
          s = s.replace('import kotlinx.coroutines.CoroutineScope\n', 'import kotlinx.coroutines.CompletableDeferred\nimport kotlinx.coroutines.CoroutineScope\n')
          s = s.replace('import kotlinx.coroutines.withContext\n', 'import kotlinx.coroutines.withContext\nimport kotlinx.coroutines.withTimeoutOrNull\n')
          s = s.replace('    private val chatJobs = ConcurrentHashMap<String, Job>()\n    private val sessionLock = Any()', '    private val chatJobs = ConcurrentHashMap<String, Job>()\n    private val chatReady = ConcurrentHashMap<String, CompletableDeferred<Unit>>()\n    private val sessionLock = Any()')
          s = s.replace('        chatJobs.clear()\n        chatCaches.clear()', '        chatJobs.clear()\n        chatReady.values.forEach { it.cancel() }\n        chatReady.clear()\n        chatCaches.clear()')
          old = '''    private fun ensureRealtimeListener(conversationId: String, cache: ChatCache) {
        if (chatJobs[conversationId]?.isActive == true) return
        chatJobs[conversationId] = realtimeScope.launch {
            runCatching {
                watchTextMessages(conversationId) { incoming ->
                    mainHandler.post {
                        val index = cache.state.indexOfFirst { it.id == incoming.id }
                        if (index < 0) {
                            cache.state.add(incoming)
                        } else if (cache.state[index] != incoming) {
                            cache.state[index] = incoming
                        }
                    }
                }
            }
        }
    }

    private suspend fun watchTextMessages(conversationId: String, onMessage: (LiveMessage) -> Unit) {
        requireSession()
        if (accessToken().isBlank()) return
'''
          new = '''    private suspend fun ensureRealtimeListener(conversationId: String, cache: ChatCache) {
        val existingReady = chatReady[conversationId]
        if (chatJobs[conversationId]?.isActive == true && existingReady != null) {
            withTimeoutOrNull(8_000) { existingReady.await() }
                ?: throw IllegalStateException("实时聊天连接超时")
            return
        }

        val ready = CompletableDeferred<Unit>()
        chatReady[conversationId] = ready
        chatJobs[conversationId] = realtimeScope.launch {
            try {
                watchTextMessages(conversationId, ready) { incoming ->
                    mainHandler.post {
                        val index = cache.state.indexOfFirst { it.id == incoming.id }
                        if (index < 0) {
                            cache.state.add(incoming)
                        } else if (cache.state[index] != incoming) {
                            cache.state[index] = incoming
                        }
                    }
                }
            } catch (e: Exception) {
                if (!ready.isCompleted) ready.completeExceptionally(e)
            } finally {
                chatReady.remove(conversationId, ready)
            }
        }
        withTimeoutOrNull(8_000) { ready.await() }
            ?: throw IllegalStateException("实时聊天连接超时")
    }

    private suspend fun watchTextMessages(
        conversationId: String,
        ready: CompletableDeferred<Unit>,
        onMessage: (LiveMessage) -> Unit
    ) {
        requireSession()
        if (accessToken().isBlank()) {
            ready.completeExceptionally(IllegalStateException("登录已过期，请重新登录"))
            return
        }
'''
          if old not in s:
              raise SystemExit('realtime listener patch target not found')
          s = s.replace(old, new)
          old2 = '''            try {
                channel.subscribe(blockUntilSubscribed = true)
                awaitCancellation()
            } finally {'''
          new2 = '''            try {
                channel.subscribe(blockUntilSubscribed = true)
                if (!ready.isCompleted) ready.complete(Unit)
                awaitCancellation()
            } finally {'''
          if old2 not in s:
              raise SystemExit('realtime subscribe patch target not found')
          s = s.replace(old2, new2)
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb uninstall com.socialmix.experiment.b || true
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.socialmix.experiment.b || true
            adb shell monkey -p com.socialmix.experiment.b -c android.intent.category.LAUNCHER 1
            sleep 4
            adb shell pidof com.socialmix.experiment.b

      - name: Prepare deliverable APK
        if: success()
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/SocialMix-B-Phase1.apk
          sha256sum deliverable/SocialMix-B-Phase1.apk | tee deliverable/SHA256.txt

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SocialMix-B-Phase1-Verified
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
