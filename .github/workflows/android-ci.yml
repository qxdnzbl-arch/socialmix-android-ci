name: Immersive Music Phase 1 CI

on:
  push:
    branches: [music-immersive-phase1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply confirmed NetEase-reference UI corrections
        run: python ci/refine_netease_ui.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Emulator acceptance tests and visual capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.immersive.music android.permission.READ_MEDIA_AUDIO || true
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.immersive.music.Phase1AcceptanceTest

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.immersive.music android.permission.READ_MEDIA_AUDIO || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell am force-stop com.immersive.music || true
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.immersive.music/com.immersive.music.MainActivity
            sleep 5
            adb shell pidof com.immersive.music
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep 'com.immersive.music'
            mkdir -p deliverable
            adb exec-out screencap -p > deliverable/home-paused.png
            adb shell input tap 540 2080
            sleep 2
            adb exec-out screencap -p > deliverable/home-playing.png
            adb shell input tap 850 2260
            sleep 2
            adb exec-out screencap -p > deliverable/library-screen.png

      - name: Prepare deliverable
        if: success()
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/Immersive-Music-Phase1.apk
          cp SPEC-music-phase1.md deliverable/SPEC-music-phase1.md
          sha256sum deliverable/Immersive-Music-Phase1.apk | tee deliverable/SHA256.txt

      - name: Upload verified deliverable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Immersive-Music-Phase1-Verified
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
