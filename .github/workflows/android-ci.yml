name: Kehua Android Engineering Acceptance

on:
  push:
    branches: [main, socialmix-chat-production-core, kehua-firebase-auth-prod, kehua-v1133-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-acceptance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce revival product authority
        run: |
          test -f KEHUA-REVIVAL-AUTHORITY.md
          grep -q '状态：ACTIVE' KEHUA-REVIVAL-AUTHORITY.md
          grep -q '当前视觉复刻尚未经过用户实际看过并确认通过' KEHUA-REVIVAL-AUTHORITY.md
          grep -q '注册 / 找回密码流程尚未最终定案' KEHUA-REVIVAL-AUTHORITY.md

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android emulator infrastructure regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb uninstall com.qxdnzbl.kehua || true
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.suisuinian.app.KehuaReleaseAcceptanceTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.qxdnzbl.kehua || true
            adb shell monkey -p com.qxdnzbl.kehua -c android.intent.category.LAUNCHER 1
            sleep 4
            adb shell pidof com.qxdnzbl.kehua

      - name: Prepare engineering candidate APK
        if: success()
        run: |
          mkdir -p deliverable
          cp app/build/outputs/apk/debug/app-debug.apk deliverable/Kehua-Android-Engineering-Candidate.apk
          sha256sum deliverable/Kehua-Android-Engineering-Candidate.apk | tee deliverable/SHA256.txt
          printf '%s\n' 'ENGINEERING CANDIDATE ONLY - NOT USER-CONFIRMED REVIVAL - NOT FINAL RELEASE' > deliverable/NOT-FINAL.txt

      - name: Upload engineering candidate APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kehua-Android-Engineering-Candidate
          path: deliverable/
          if-no-files-found: error
          retention-days: 14
