<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>小世界 · 第一段</title>
<style>
:root{--ink:#35423e;--paper:rgba(255,255,255,.82);--line:rgba(67,93,84,.12)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff3eb;font-family:"Noto Serif SC","Songti SC",serif;color:var(--ink)}
canvas{display:block;width:100%;height:100%}
#veil{position:fixed;inset:0;display:grid;place-items:center;background:
radial-gradient(circle at 70% 18%,rgba(255,234,244,.8),transparent 34%),
linear-gradient(160deg,#edf9f2,#d9edf4 55%,#f6e9ef);z-index:30;transition:opacity 1.4s ease,visibility 1.4s}
#veil.hidden{opacity:0;visibility:hidden}
.door{width:min(78vw,340px);height:min(60vh,520px);border:1px solid rgba(255,255,255,.78);border-radius:32px 32px 18px 18px;background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(225,246,238,.16));box-shadow:0 30px 90px rgba(74,116,104,.14),inset 0 0 0 1px rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;backdrop-filter:blur(7px);position:relative;overflow:hidden}
.door:before{content:"";position:absolute;width:170%;height:40%;left:-35%;top:10%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(-14deg)}
.door h1{font-size:24px;font-weight:500;letter-spacing:.18em;margin:0;z-index:1}
button{font:inherit;color:inherit}
.primary{border:1px solid rgba(73,108,96,.18);background:rgba(255,255,255,.72);border-radius:999px;padding:14px 24px;min-height:48px;box-shadow:0 10px 30px rgba(74,116,104,.1)}
#top{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
.pill{pointer-events:auto;border:1px solid var(--line);background:var(--paper);backdrop-filter:blur(12px);border-radius:999px;padding:10px 14px;box-shadow:0 9px 24px rgba(54,90,78,.08);font-size:13px}
#status{max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint{position:fixed;left:50%;top:86px;transform:translateX(-50%);z-index:8;background:rgba(255,255,255,.7);padding:8px 14px;border-radius:999px;font-size:12px;opacity:.9;transition:opacity .5s}
#thoughtBtn{position:fixed;right:18px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:12;border:1px solid var(--line);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.82);box-shadow:0 10px 30px rgba(54,90,78,.12);font-size:22px}
#panel{position:fixed;left:12px;right:12px;bottom:calc(94px + env(safe-area-inset-bottom));z-index:20;background:rgba(255,255,255,.91);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 24px 70px rgba(54,90,78,.18);transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#panel.show{transform:translateY(0)}
#panel textarea{width:100%;min-height:88px;border:0;outline:0;resize:none;background:rgba(233,246,240,.72);border-radius:16px;padding:14px;font:inherit;color:inherit}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.small{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;min-height:44px}
#reflection{margin-top:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(238,249,244,.9),rgba(244,240,250,.9));line-height:1.7;font-size:14px;display:none}
#joystick{position:fixed;left:20px;bottom:calc(28px + env(safe-area-inset-bottom));z-index:11;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.44);touch-action:none;display:none}
#knob{position:absolute;width:48px;height:48px;border-radius:50%;left:32px;top:32px;background:rgba(255,255,255,.72);box-shadow:0 6px 16px rgba(57,86,77,.12)}
#zone{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-size:12px;opacity:0;transition:opacity .3s}
#zone.on{opacity:1}
@media(max-width:700px){#joystick{display:block}#hint{top:76px}.door h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="veil"><div class="door"><h1>进来待一会儿。</h1><button class="primary" id="enter">推门进去</button></div></div>
<div id="top">
  <div class="pill" id="status">今天：随便看看</div>
  <button class="pill" id="outside">门外</button>
</div>
<div id="hint">WASD / 方向键移动 · 手机拖动左下角</div>
<div id="zone"></div>
<button id="thoughtBtn" aria-label="碎碎念">✦</button>
<div id="joystick"><div id="knob"></div></div>
<div id="panel">
  <div style="font-size:15px;margin-bottom:10px">现在脑子里有什么，就放在这里。</div>
  <textarea id="thought" placeholder="不用整理，随便说。"></textarea>
  <div class="row">
    <button class="small" id="sendThought">让它先听懂我</button>
    <button class="small" id="closePanel">收起来</button>
  </div>
  <div id="reflection"></div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdff3eb);
scene.fog=new THREE.FogExp2(0xdff3eb,0.025);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,180);
camera.position.set(0,6,12);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xfaffff,0x89a88d,2.25));
const sun=new THREE.DirectionalLight(0xfff0dc,2.8);sun.position.set(-10,18,8);sun.castShadow=true;scene.add(sun);

const ground=new THREE.Mesh(new THREE.CircleGeometry(52,96),new THREE.MeshStandardMaterial({color:0xcfe7d5,roughness:.98}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

function mound(x,z,s,c=0xb8d8bf){
 const m=new THREE.Mesh(new THREE.SphereGeometry(s,24,16),new THREE.MeshStandardMaterial({color:c,roughness:1}));
 m.scale.y=.28;m.position.set(x,-s*.72,z);m.receiveShadow=true;scene.add(m);return m
}
mound(-12,-7,12);mound(15,-8,14,0xc7dfc3);mound(0,17,16,0xb9d9c2);

const trunkMat=new THREE.MeshStandardMaterial({color:0x8f7a69,roughness:1});
const leafMat=new THREE.MeshStandardMaterial({color:0x8fc8a1,roughness:1});
function tree(x,z,s=1){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.26*s,2.7*s,8),trunkMat);trunk.position.set(x,1.25*s,z);trunk.castShadow=true;scene.add(trunk);
 for(let i=0;i<5;i++){const l=new THREE.Mesh(new THREE.IcosahedronGeometry(.8*s,1),leafMat);const a=i/5*Math.PI*2;l.position.set(x+Math.cos(a)*.55*s,2.65*s+Math.sin(i)*.25*s,z+Math.sin(a)*.55*s);l.castShadow=true;scene.add(l)}
}
[[-10,-8,1.5],[-14,-1,1.1],[11,-10,1.35],[15,2,1.15],[8,12,1.2],[-7,15,1.25]].forEach(v=>tree(...v));

const flowerGroup=new THREE.Group();flowerGroup.position.set(-8,0,-1);scene.add(flowerGroup);
const stemMat=new THREE.MeshStandardMaterial({color:0x6fb58a});
for(let i=0;i<22;i++){
 const a=Math.random()*Math.PI*2,r=1.2+Math.random()*3.2,h=.6+Math.random()*.9;
 const stem=new THREE.Mesh(new THREE.CylinderGeometry(.025,.04,h,6),stemMat);stem.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);flowerGroup.add(stem);
 const petalColor=[0xffd9e7,0xe3e8ff,0xfff0b9,0xffffff][i%4];
 const blossom=new THREE.Mesh(new THREE.SphereGeometry(.12+Math.random()*.08,10,8),new THREE.MeshStandardMaterial({color:petalColor,emissive:petalColor,emissiveIntensity:.55}));
 blossom.position.set(stem.position.x,h,stem.position.z);flowerGroup.add(blossom);
}

const quiet=new THREE.Group();quiet.position.set(8,0,5);scene.add(quiet);
const shell=new THREE.Mesh(new THREE.SphereGeometry(3.4,32,20,0,Math.PI*2,0,Math.PI*.58),new THREE.MeshPhysicalMaterial({color:0xeaf5f2,roughness:.45,transmission:.08,transparent:true,opacity:.76}));
shell.scale.y=.55;shell.position.y=.4;quiet.add(shell);
const cushion=new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.1,.42,28),new THREE.MeshStandardMaterial({color:0xe9dfe9,roughness:.9}));cushion.position.y=.2;quiet.add(cushion);

const tea=new THREE.Group();tea.position.set(2,0,-10);scene.add(tea);
const table=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.95,.35,24),new THREE.MeshStandardMaterial({color:0xd9c2a2,roughness:.82}));table.position.y=.35;tea.add(table);
const cup=new THREE.Mesh(new THREE.CylinderGeometry(.42,.34,.7,20),new THREE.MeshPhysicalMaterial({color:0xf8f0e8,roughness:.35}));cup.position.y=.9;tea.add(cup);
const glow=new THREE.PointLight(0xffc48f,2.8,8);glow.position.set(0,2,0);tea.add(glow);

const steam=[];
for(let i=0;i<16;i++){
 const p=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.42}));
 p.position.set((Math.random()-.5)*.3,1.3+Math.random()*1.6,(Math.random()-.5)*.3);tea.add(p);steam.push(p)
}

// firefly / petals
const motes=[];
for(let i=0;i<36;i++){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.035,6,6),new THREE.MeshBasicMaterial({color:i%3===0?0xffe7f0:0xffffdd,transparent:true,opacity:.75}));
 m.position.set((Math.random()-.5)*32,.4+Math.random()*4,(Math.random()-.5)*32);scene.add(m);motes.push({m,phase:Math.random()*6.28,s:.2+Math.random()*.3});
}

// avatar
const avatar=new THREE.Group();scene.add(avatar);avatar.position.set(0,0,4);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.95,6,12),new THREE.MeshStandardMaterial({color:0xf7eee9,roughness:.7}));body.position.y=1.15;body.castShadow=true;avatar.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.48,20,16),new THREE.MeshStandardMaterial({color:0xfff7ef,roughness:.8}));head.position.y=2.15;head.castShadow=true;avatar.add(head);
const cape=new THREE.Mesh(new THREE.ConeGeometry(.85,1.5,12,1,true),new THREE.MeshStandardMaterial({color:0xb9c7ef,side:THREE.DoubleSide,roughness:.7}));cape.rotation.x=Math.PI;cape.position.set(0,1.25,.15);avatar.add(cape);
const eyeMat=new THREE.MeshBasicMaterial({color:0x435a58});
[-.17,.17].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),eyeMat);e.position.set(x,2.2,.45);avatar.add(e)});

const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={x:0,y:0};const joyEl=document.getElementById('joystick'),knob=document.getElementById('knob');
function joyMove(e){
 const r=joyEl.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
 let x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2);const d=Math.hypot(x,y),max=38;if(d>max){x=x/d*max;y=y/d*max}
 joy={x:x/max,y:y/max};knob.style.transform=`translate(${x}px,${y}px)`
}
joyEl.addEventListener('touchstart',joyMove,{passive:false});joyEl.addEventListener('touchmove',e=>{e.preventDefault();joyMove(e)},{passive:false});
joyEl.addEventListener('touchend',()=>{joy={x:0,y:0};knob.style.transform='translate(0,0)'});

let currentZone='';const zoneEl=document.getElementById('zone');
function zoneCheck(){
 const p=avatar.position;
 const zones=[
  {n:'花与微光',x:-8,z:-1,r:5},
  {n:'安静窝',x:8,z:5,r:4},
  {n:'茶香暖角',x:2,z:-10,r:4}
 ];
 let hit='';for(const q of zones){if(Math.hypot(p.x-q.x,p.z-q.z)<q.r){hit=q.n;break}}
 if(hit!==currentZone){currentZone=hit;zoneEl.textContent=hit?('你到了 · '+hit):'';zoneEl.classList.toggle('on',!!hit)}
}

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=performance.now()/1000;
 let dx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joy.x;
 let dz=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0)+joy.y;
 const len=Math.hypot(dx,dz);if(len>.08){dx/=Math.max(1,len);dz/=Math.max(1,len);avatar.position.x+=dx*4*dt;avatar.position.z+=dz*4*dt;avatar.rotation.y=Math.atan2(dx,dz);body.position.y=1.15+Math.sin(t*8)*.035}else{body.position.y=1.15+Math.sin(t*2)*.025;head.rotation.y=Math.sin(t*.7)*.08}
 cape.rotation.z=Math.sin(t*2.3)*.03;
 avatar.position.x=THREE.MathUtils.clamp(avatar.position.x,-22,22);avatar.position.z=THREE.MathUtils.clamp(avatar.position.z,-22,22);
 const target=new THREE.Vector3(avatar.position.x,1.2,avatar.position.z+8.5);camera.position.lerp(target,.035);camera.lookAt(avatar.position.x,1.35,avatar.position.z);
 motes.forEach(o=>{o.m.position.y+=Math.sin(t*o.s+o.phase)*.002;o.m.position.x+=Math.cos(t*.2+o.phase)*.0015});
 steam.forEach((p,i)=>{p.position.y+=.006;if(p.position.y>3)p.position.y=1.25;p.material.opacity=.25+.15*Math.sin(t+i)});
 zoneCheck();renderer.render(scene,camera)
}
animate();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

document.getElementById('enter').onclick=()=>document.getElementById('veil').classList.add('hidden');
document.getElementById('outside').onclick=()=>document.getElementById('veil').classList.remove('hidden');
const panel=document.getElementById('panel');document.getElementById('thoughtBtn').onclick=()=>panel.classList.add('show');document.getElementById('closePanel').onclick=()=>panel.classList.remove('show');
document.getElementById('sendThought').onclick=()=>{
 const v=document.getElementById('thought').value.trim();if(!v)return;
 const r=document.getElementById('reflection');let text='我先不替你下结论。这里更像是：你现在希望有一个地方能接住这句话，而不是立刻要求你解释、回应或解决什么。';
 if(/累|烦|不想|懒/.test(v))text='候选理解：你现在介意的可能不只是这件事本身，而是它正在要求你继续输出精力。你更想先把负担停下来，再决定要不要处理。';
 if(/喜欢|舒服|好看|香|温暖/.test(v))text='候选理解：你不是只在评价一个东西“不错”，你在记录一种会让自己身体和注意力自然愿意停留的感觉。这个体验值得被保留下来。';
 r.innerHTML=text+'<div class="row"><button class="small" onclick="this.closest(\'#reflection\').dataset.feedback=\'right\'">对</button><button class="small" onclick="this.closest(\'#reflection\').dataset.feedback=\'wrong\'">不对</button><button class="small" onclick="this.closest(\'#reflection\').dataset.feedback=\'context\'">只在这种情况下</button></div>';
 r.style.display='block';document.getElementById('status').textContent='此刻：'+v.slice(0,16)+(v.length>16?'…':'');
};
</script>
</body>
</html>
