plugins {
    id 'com.android.application'
}
android {
    namespace 'com.nzbl.pocketclean'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nzbl.pocket.clean'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    buildTypes {
        debug { }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
