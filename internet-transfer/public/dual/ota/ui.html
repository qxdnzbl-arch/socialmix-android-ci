<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>双机传</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100vw;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1c242c;background:#f4f6f8;-webkit-text-size-adjust:100%;overscroll-behavior:none}button,input,textarea{font:inherit}button{touch-action:manipulation}#app{height:100dvh;overflow:hidden}.chat{height:100%;display:flex;flex-direction:column}.head{flex:0 0 auto;background:#fff;padding:max(34px,calc(env(safe-area-inset-top) + 10px)) 18px 11px;border-bottom:1px solid #e4e8ec}.headtop{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}.head strong{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.2px}.iconbtn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;border-radius:12px;background:transparent;color:#5d6873;padding:0}.iconbtn:active{background:#eef1f4}.iconbtn svg{width:21px;height:21px;display:block}.status{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.4;margin-top:4px;color:#3b9270}.status.warn{color:#aa7b27}.status .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}.searchbar{display:flex;align-items:center;gap:6px;margin-top:10px}.searchbar[hidden]{display:none}.searchbox{position:relative;min-width:0;flex:1}.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#8b949d;pointer-events:none}.searchinput{width:100%;height:40px;border:0;border-radius:13px;background:#f0f2f4;padding:0 11px 0 35px;outline:none;font-size:14px;color:#252d34}.searchinput::placeholder{color:#9aa2aa}.searchcount{min-width:30px;text-align:center;font-size:12px;color:#7c858e;white-space:nowrap}.searchnav,.searchclose{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;border-radius:10px;background:transparent;color:#5f6973;font-size:18px}.searchnav:active,.searchclose:active{background:#eef1f4}.messages{flex:1;min-height:0;width:100%;max-width:100vw;overflow-y:auto;overflow-x:hidden;padding:14px 14px 18px;scroll-behavior:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.empty{text-align:center;color:#7a848e;line-height:1.6;padding:80px 26px}.row{display:flex;width:100%;min-width:0;margin-bottom:10px;overflow:hidden}.row.mine{justify-content:flex-end}.bubble{min-width:0;max-width:min(82%,calc(100vw - 48px));overflow:hidden;border-radius:17px;padding:10px 12px 9px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.025);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.mine .bubble{background:#4380d8;color:#fff}.message-text{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.45}.file{font-weight:650}.file-name{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-title{display:flex;align-items:center;gap:8px;min-width:0;font-weight:650}.file-title svg{width:19px;height:19px;flex:0 0 auto;color:#66727d}.file-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:12px;color:#76818b;margin-top:4px}.mine .meta{color:#dfeafd}.state{text-align:right;font-size:11px;color:#dfeafd;margin-top:5px}.save{font-size:12px;color:#3976cd;margin-top:5px}.match .bubble{outline:2px solid #e9b85a;outline-offset:2px}.active-match .bubble{outline:3px solid #d9932f;outline-offset:2px}mark{background:#ffe2a0;color:inherit;border-radius:3px;padding:0 1px}.mine mark{background:#ffe7aa;color:#24313c}.composer{flex:0 0 auto;background:#fff;padding:8px calc(10px + env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));display:flex;gap:8px;align-items:flex-end;border-top:1px solid #edf0f2}.attach{display:flex;align-items:center;justify-content:center;width:46px;height:48px;border:0;background:transparent;color:#202930;font-size:29px;padding:0}.input{flex:1;min-height:48px;max-height:112px;border:0;border-radius:15px;background:#eef1f4;padding:12px 13px;outline:none;resize:none;line-height:1.45;color:#222c34}.input::placeholder{color:#8e979f}.send{width:66px;height:48px;border:0;border-radius:14px;background:#4380d8;color:#fff;font-weight:600}.ctx{position:fixed;z-index:120;display:flex;align-items:center;gap:2px;padding:5px;background:rgba(255,255,255,.98);border:1px solid rgba(32,41,48,.08);border-radius:14px;box-shadow:0 8px 26px rgba(27,35,42,.16);transform:translate(-50%,-100%)}.ctx[hidden]{display:none}.ctx button{height:38px;border:0;border-radius:10px;background:transparent;padding:0 14px;color:#283139;font-size:14px;white-space:nowrap}.ctx button:active{background:#eef1f4}.ctx:after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#fff;border-right:1px solid rgba(32,41,48,.08);border-bottom:1px solid rgba(32,41,48,.08);transform:translateX(-50%) rotate(45deg)}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(28,36,44,.92);color:#fff;padding:9px 14px;border-radius:18px;font-size:13px;z-index:140;pointer-events:none;opacity:0;transition:opacity .18s}.toast.show{opacity:1}
</style></head><body><div id="app"></div><div id="contextMenu" class="ctx" hidden></div><div id="toast" class="toast"></div><script>
const app=document.getElementById('app');
const toast=document.getElementById('toast');
const ctx=document.getElementById('contextMenu');
let last='',currentState=null,searchOpen=false,searchQuery='',searchIndex=0,searchMatches=[];
let longPressTimer=null,longPressFired=false,pressStartX=0,pressStartY=0;

const SEARCH_SVG='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2" stroke="currentColor" stroke-width="2.1"/><path d="M15.2 15.2L20 20" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function size(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
function get(){try{return JSON.parse(Android.getState())}catch(e){return{messages:[]}}}
function refreshFromNative(){const s=get();currentState=s;render(false,s)}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('show'),1200)}
function highlight(text,q){const raw=String(text??''),needle=String(q??'').trim();if(!needle)return esc(raw);const low=raw.toLocaleLowerCase(),find=needle.toLocaleLowerCase();let out='',pos=0,i;while((i=low.indexOf(find,pos))!==-1){out+=esc(raw.slice(pos,i))+'<mark>'+esc(raw.slice(i,i+needle.length))+'</mark>';pos=i+needle.length}return out+esc(raw.slice(pos))}
function searchable(m){return m.kind==='text'?String(m.text||''):String(m.fileName||'')}
function friendlyFileLabel(name){
 const n=String(name||'文件'),low=n.toLocaleLowerCase();
 if(/\.(jpe?g|png|gif|webp|bmp|heic|heif)$/.test(low)||/^(camera|img|screenshot|xhs)[_\-]/i.test(n))return '图片';
 if(/\.(mp4|mov|m4v|avi|mkv|webm)$/.test(low))return '视频';
 if(/\.(mp3|m4a|wav|aac|flac|ogg)$/.test(low))return '音频';
 if(/\.(pdf)$/.test(low))return 'PDF 文件';
 const base=n.replace(/^.*[\\/]/,'');
 if(base.length<=34)return base;
 const dot=base.lastIndexOf('.');
 const ext=dot>0&&base.length-dot<=8?base.slice(dot):'';
 const stem=ext?base.slice(0,dot):base;
 return stem.slice(0,18)+'…'+stem.slice(-8)+ext;
}
const FILE_SVG='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.2 12.7l5.7-5.7a3.2 3.2 0 114.5 4.5l-7.1 7.1a5 5 0 11-7.1-7.1l7.6-7.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>'
function statusInfo(s){if(s.linkState==='nearby'||s.linkState==='relay')return['已连接',''];if(s.linkState==='permission')return['需要附近设备权限','warn'];if(s.linkState==='connecting')return['自动连接中',''];return['自动同步','']}
function copyText(text){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';ta.style.pointerEvents='none';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();showToast(ok?'已复制':'复制失败')}
function hideContext(){ctx.hidden=true;ctx.innerHTML=''}
function openSearch(){hideContext();searchOpen=true;searchQuery='';searchIndex=0;render(true,currentState);setTimeout(()=>document.getElementById('searchInput')?.focus(),30)}
function showContext(row,m,x,y){hideContext();const actions=[];if(m.kind==='text')actions.push(['复制',()=>copyText(m.text||'')]);else actions.push(['复制文件名',()=>copyText(m.fileName||'')]);actions.push(['搜索',openSearch]);if(m.kind==='file'&&!m.mine)actions.unshift(['保存',()=>{Android.saveFile(m.id);showToast('正在保存')}]);actions.forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=e=>{e.stopPropagation();hideContext();fn()};ctx.appendChild(b)});ctx.hidden=false;const vw=window.innerWidth,vh=window.innerHeight;const r=ctx.getBoundingClientRect();let left=Math.max(r.width/2+10,Math.min(vw-r.width/2-10,x));let top=Math.max(r.height+12,Math.min(vh-70,y-8));ctx.style.left=left+'px';ctx.style.top=top+'px'}
function bindLongPress(row,m){const start=e=>{if(e.touches&&e.touches.length!==1)return;const p=e.touches?e.touches[0]:e;pressStartX=p.clientX;pressStartY=p.clientY;longPressFired=false;clearTimeout(longPressTimer);longPressTimer=setTimeout(()=>{longPressFired=true;showContext(row,m,pressStartX,pressStartY)},430)};const move=e=>{const p=e.touches?e.touches[0]:e;if(Math.abs(p.clientX-pressStartX)>12||Math.abs(p.clientY-pressStartY)>12)clearTimeout(longPressTimer)};const end=()=>clearTimeout(longPressTimer);row.addEventListener('touchstart',start,{passive:true});row.addEventListener('touchmove',move,{passive:true});row.addEventListener('touchend',end,{passive:true});row.addEventListener('touchcancel',end,{passive:true});row.addEventListener('contextmenu',e=>e.preventDefault());}

function render(force=false,stateOverride=null){
 const s=stateOverride||currentState||get();currentState=s;const js=JSON.stringify(s);if(!force&&js===last)return;last=js;
 const oldBox=document.getElementById('messages');const oldScroll=oldBox?{top:oldBox.scrollTop,atBottom:(oldBox.scrollHeight-oldBox.scrollTop-oldBox.clientHeight)<90}:null;const oldInput=document.getElementById('message');const draft=oldInput?oldInput.value:'';const inputFocused=oldInput&&document.activeElement===oldInput;
 const q=searchQuery.trim(),messages=s.messages||[];
 searchMatches=q?messages.filter(m=>searchable(m).toLocaleLowerCase().includes(q.toLocaleLowerCase())).map(m=>m.id):[];
 if(searchIndex>=searchMatches.length)searchIndex=Math.max(0,searchMatches.length-1);
 const matchSet=new Set(searchMatches),activeId=searchMatches[searchIndex];
 const msgs=messages.map(m=>{const matched=q&&matchSet.has(m.id),active=matched&&activeId===m.id;const label=friendlyFileLabel(m.fileName);const body=m.kind==='text'?'<div class="message-text">'+highlight(m.text,q)+'</div>':'<div class="file-title">'+FILE_SVG+'<span class="file-label">'+highlight(label,q)+'</span></div><div class="meta">'+size(m.fileSize)+'</div>'+(m.mine?'':'<div class="save">点一下保存到下载</div>');return '<div class="row '+(m.mine?'mine ':'')+(matched?'match ':'')+(active?'active-match ':'')+(m.kind==='file'?'file-row ':'')+'" data-id="'+esc(m.id)+'"><div class="bubble">'+body+(m.mine?'<div class="state">'+(m.status==='sent'?'已送达':'等待自动发送')+'</div>':'')+'</div></div>'}).join('');
 const [st,stClass]=statusInfo(s);
 const search='<div class="searchbar" '+(searchOpen?'':'hidden')+'><div class="searchbox">'+SEARCH_SVG+'<input id="searchInput" class="searchinput" placeholder="搜索消息或文件名" value="'+esc(searchQuery)+'"></div><span id="searchCount" class="searchcount">'+(q?(searchMatches.length?(searchIndex+1)+'/'+searchMatches.length:'0/0'):'')+'</span><button id="searchPrev" class="searchnav" aria-label="上一个">↑</button><button id="searchNext" class="searchnav" aria-label="下一个">↓</button><button id="searchClose" class="searchclose" aria-label="关闭">×</button></div>';
 app.innerHTML='<div class="chat"><div class="head"><div class="headtop"><strong>我的两台手机</strong><button id="searchToggle" class="iconbtn" aria-label="搜索">'+SEARCH_SVG+'</button></div><div class="status '+stClass+'"><span class="dot"></span><span>'+st+'</span></div>'+search+'</div><div id="messages" class="messages">'+(msgs||'<div class="empty">直接发就行<br>不用配对，不用切网络。</div>')+'</div><div id="composer" class="composer"><button id="attach" class="attach">+</button><textarea id="message" class="input" rows="1" placeholder="输入消息"></textarea><button id="send" class="send">发送</button></div></div>';
 wire(s,messages,oldScroll,draft,inputFocused);Android.reportUi('screen=chat messages='+messages.length+' ui='+s.uiVersion+' search='+searchMatches.length);reportGeometry();
}
function wire(s,messages,oldScroll,draft,inputFocused){
 const msg=document.getElementById('message');
 if(draft){msg.value=draft;growInput(msg)}
 if(inputFocused){setTimeout(()=>{msg.focus();msg.setSelectionRange(msg.value.length,msg.value.length)},0)}
 document.getElementById('send').onclick=send;
 document.getElementById('attach').onclick=()=>Android.pickFiles();
 msg.addEventListener('input',()=>growInput(msg));
 msg.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
 const byId=new Map(messages.map(m=>[m.id,m]));
 document.querySelectorAll('.row').forEach(row=>{const m=byId.get(row.dataset.id);if(!m)return;bindLongPress(row,m);if(m.kind==='file'&&!m.mine)row.onclick=()=>{if(longPressFired){longPressFired=false;return}Android.saveFile(m.id)}});
 document.getElementById('searchToggle').onclick=openSearch;
 if(searchOpen){
   const si=document.getElementById('searchInput');
   si.oninput=e=>{searchQuery=e.target.value;searchIndex=0;clearTimeout(si._t);si._t=setTimeout(()=>{render(true,currentState);setTimeout(()=>{const i=document.getElementById('searchInput');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}jumpToCurrent()},0)},90)};
   si.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();stepSearch(e.shiftKey?-1:1)}else if(e.key==='Escape'){searchOpen=false;searchQuery='';searchIndex=0;render(true,currentState)}};
   document.getElementById('searchPrev').onclick=()=>stepSearch(-1);
   document.getElementById('searchNext').onclick=()=>stepSearch(1);
   document.getElementById('searchClose').onclick=()=>{searchOpen=false;searchQuery='';searchIndex=0;render(true,currentState)};
 }
 const box=document.getElementById('messages');
 box.scrollLeft=0;
 box.addEventListener('scroll',()=>{if(box.scrollLeft!==0)box.scrollLeft=0;if(!ctx.hidden)hideContext()},{passive:true});
 if(searchOpen&&searchQuery.trim()) jumpToCurrent();
 else if(oldScroll&&!oldScroll.atBottom) box.scrollTop=oldScroll.top;
 else box.scrollTop=box.scrollHeight;
}
function stepSearch(dir){if(!searchMatches.length){showToast('没有找到');return}searchIndex=(searchIndex+dir+searchMatches.length)%searchMatches.length;render(true,currentState);jumpToCurrent()}
function jumpToCurrent(){if(!searchMatches.length)return;const id=searchMatches[searchIndex];const row=[...document.querySelectorAll('.row')].find(x=>x.dataset.id===id);row?.scrollIntoView({block:'center',behavior:'smooth'})}
function growInput(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,112)+'px'}
function send(){hideContext();const e=document.getElementById('message'),t=e.value.trim();if(!t)return;e.value='';e.style.height='';Android.sendText(t);setTimeout(refreshFromNative,60)}
function reportGeometry(){const c=document.getElementById('composer');if(!c)return;const vv=window.visualViewport;Android.reportLayout(vv?vv.height:window.innerHeight,c.getBoundingClientRect().bottom)}
document.addEventListener('touchstart',e=>{if(!ctx.hidden&&!ctx.contains(e.target)&&!e.target.closest('.row'))hideContext()},{passive:true});let refreshQueued=false;window.nativeRefresh=()=>{if(refreshQueued)return;refreshQueued=true;requestAnimationFrame(()=>{refreshQueued=false;refreshFromNative()})};if(window.visualViewport){visualViewport.addEventListener('resize',()=>{document.getElementById('app').style.height=visualViewport.height+'px';setTimeout(reportGeometry,80)})}currentState=get();render(true,currentState);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshFromNative()});
</script></body></html>
