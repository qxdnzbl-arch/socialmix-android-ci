<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>双机传</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1c242c;background:#f5f7f9}button,input,textarea{font:inherit}button{touch-action:manipulation}#app{height:100dvh;overflow:hidden}.chat{height:100%;display:flex;flex-direction:column}.head{background:#fff;padding:12px 14px 10px;border-bottom:1px solid #e0e5ea}.headtop{display:flex;align-items:center;justify-content:space-between;gap:12px}.head strong{font-size:19px}.iconbtn{width:40px;height:40px;border:0;border-radius:20px;background:transparent;font-size:22px;color:#59636d}.status{font-size:12px;margin-top:2px;color:#24895c}.searchbar{display:flex;align-items:center;gap:7px;margin-top:9px}.searchbar[hidden]{display:none}.searchinput{min-width:0;flex:1;height:40px;border:0;border-radius:12px;background:#eef1f4;padding:0 12px;outline:none;font-size:14px}.searchcount{font-size:12px;color:#7a858f;white-space:nowrap}.searchnav,.searchclose{width:34px;height:34px;border:0;border-radius:10px;background:#f2f4f6;color:#56616c}.messages{flex:1;overflow:auto;padding:14px 14px 18px;scroll-behavior:smooth}.empty{text-align:center;color:#707b86;line-height:1.6;padding:80px 26px}.row{display:flex;margin-bottom:9px}.row.mine{justify-content:flex-end}.bubble{max-width:82%;border-radius:16px;padding:9px 12px 8px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.025)}.mine .bubble{background:#4380d8;color:#fff}.message-text,.file-name{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}.message-text{white-space:pre-wrap;word-break:break-word}.file{font-weight:650}.meta{font-size:12px;color:#707b86;margin-top:4px}.mine .meta{color:#deebfc}.state{text-align:right;font-size:11px;color:#deebfc;margin-top:5px}.save{font-size:12px;color:#3774cd;margin-top:5px}.match .bubble{outline:2px solid #f2ba57;outline-offset:2px}.active-match .bubble{outline:3px solid #e6992f;outline-offset:2px}mark{background:#ffe19a;color:inherit;border-radius:3px;padding:0 1px}.mine mark{background:#ffe7a8;color:#25313d}.composer{background:#fff;padding:8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));display:flex;gap:7px;align-items:flex-end}.attach{width:48px;height:48px;border:0;background:transparent;font-size:28px}.input{flex:1;min-height:48px;max-height:112px;border:0;border-radius:14px;background:#eef1f4;padding:12px;outline:none;resize:none}.send{width:68px;height:48px;border:0;border-radius:12px;background:#427ed6;color:#fff}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(28,36,44,.92);color:#fff;padding:9px 14px;border-radius:18px;font-size:13px;z-index:99;pointer-events:none;opacity:0;transition:opacity .18s}.toast.show{opacity:1}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const app=document.getElementById('app');
const toast=document.getElementById('toast');
let last='';
let searchOpen=false;
let searchQuery='';
let searchIndex=0;
let searchMatches=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function size(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
function get(){try{return JSON.parse(Android.getState())}catch(e){return{messages:[]}}}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('show'),1200)}
function highlight(text,q){const raw=String(text??''),needle=String(q??'').trim();if(!needle)return esc(raw);const low=raw.toLocaleLowerCase(),find=needle.toLocaleLowerCase();let out='',pos=0,i;while((i=low.indexOf(find,pos))!==-1){out+=esc(raw.slice(pos,i))+'<mark>'+esc(raw.slice(i,i+needle.length))+'</mark>';pos=i+needle.length}return out+esc(raw.slice(pos))}
function searchable(m){return (m.kind==='text'?String(m.text||''):String(m.fileName||''))}
function statusText(s){return s.linkState==='nearby'?'● 两台手机已直连':s.linkState==='relay'?'● 两台手机已联网同步':s.linkState==='connecting'?'● 正在连接另一台手机':s.linkState==='permission'?'● 等待系统权限':'● 正在自动寻找另一台手机'}

function render(force=false){
 const s=get(); const js=JSON.stringify(s);
 if(!force&&js===last)return; last=js;
 const q=searchQuery.trim();
 const messages=s.messages||[];
 searchMatches=q?messages.filter(m=>searchable(m).toLocaleLowerCase().includes(q.toLocaleLowerCase())).map(m=>m.id):[];
 if(searchIndex>=searchMatches.length)searchIndex=Math.max(0,searchMatches.length-1);
 const msgs=messages.map(m=>{
   const matched=q&&searchMatches.includes(m.id);
   const active=matched&&searchMatches[searchIndex]===m.id;
   const body=m.kind==='text'
     ?'<div class="message-text">'+highlight(m.text,q)+'</div>'
     :'<div class="file file-name">📎 '+highlight(m.fileName||'文件',q)+'</div><div class="meta">'+size(m.fileSize)+'</div>'+(m.mine?'':'<div class="save">点一下保存到下载</div>');
   return '<div class="row '+(m.mine?'mine ':'')+(matched?'match ':'')+(active?'active-match ':'')+(m.kind==='file'?'file-row ':'')+'" data-id="'+esc(m.id)+'"><div class="bubble">'+body+(m.mine?'<div class="state">'+(m.status==='sent'?'已送达':'等待自动发送')+'</div>':'')+'</div></div>';
 }).join('');
 const search='<div class="searchbar" '+(searchOpen?'':'hidden')+'><input id="searchInput" class="searchinput" placeholder="搜索消息或文件名" value="'+esc(searchQuery)+'"><span id="searchCount" class="searchcount">'+(q?(searchMatches.length?(searchIndex+1)+'/'+searchMatches.length:'0/0'):'')+'</span><button id="searchPrev" class="searchnav" aria-label="上一个">↑</button><button id="searchNext" class="searchnav" aria-label="下一个">↓</button><button id="searchClose" class="searchclose" aria-label="关闭">×</button></div>';
 app.innerHTML='<div class="chat"><div class="head"><div class="headtop"><strong>我的两台手机</strong><button id="searchToggle" class="iconbtn" aria-label="搜索">⌕</button></div><div class="status">'+statusText(s)+'</div>'+search+'</div><div id="messages" class="messages">'+(msgs||'<div class="empty">直接发就行<br>不用配对，不用切网络。</div>')+'</div><div id="composer" class="composer"><button id="attach" class="attach">+</button><textarea id="message" class="input" rows="1" placeholder="输入消息"></textarea><button id="send" class="send">发送</button></div></div>';
 wire(s);
 Android.reportUi('screen=chat messages='+messages.length+' ui='+s.uiVersion+' search='+searchMatches.length);
 reportGeometry();
}

function wire(s){
 const msg=document.getElementById('message');
 document.getElementById('send').onclick=send;
 document.getElementById('attach').onclick=()=>Android.pickFiles();
 msg.addEventListener('input',()=>growInput(msg));msg.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
 document.querySelectorAll('.file-row:not(.mine)').forEach(r=>r.onclick=()=>Android.saveFile(r.dataset.id));
 document.getElementById('searchToggle').onclick=()=>{searchOpen=true;render(true);setTimeout(()=>document.getElementById('searchInput')?.focus(),30)};
 if(searchOpen){
   const si=document.getElementById('searchInput');
   si.oninput=e=>{searchQuery=e.target.value;searchIndex=0;render(true);setTimeout(()=>{const i=document.getElementById('searchInput');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}jumpToCurrent()},0)};si.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();stepSearch(e.shiftKey?-1:1)}else if(e.key==='Escape'){searchOpen=false;searchQuery='';searchIndex=0;render(true)}};
   document.getElementById('searchPrev').onclick=()=>stepSearch(-1);
   document.getElementById('searchNext').onclick=()=>stepSearch(1);
   document.getElementById('searchClose').onclick=()=>{searchOpen=false;searchQuery='';searchIndex=0;render(true)};
 }
 const box=document.getElementById('messages');
 if(searchOpen&&searchQuery.trim()) jumpToCurrent(); else box.scrollTop=box.scrollHeight;
}

function stepSearch(dir){if(!searchMatches.length){showToast('没有找到');return}searchIndex=(searchIndex+dir+searchMatches.length)%searchMatches.length;render(true);jumpToCurrent()}
function jumpToCurrent(){if(!searchMatches.length)return;const id=searchMatches[searchIndex];const row=[...document.querySelectorAll('.row')].find(x=>x.dataset.id===id);row?.scrollIntoView({block:'center',behavior:'smooth'})}
function growInput(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,112)+'px'}
function send(){const e=document.getElementById('message'),t=e.value.trim();if(!t)return;e.value='';e.style.height='';Android.sendText(t);setTimeout(()=>render(true),50)}
function reportGeometry(){const c=document.getElementById('composer');if(!c)return;const vv=window.visualViewport;Android.reportLayout(vv?vv.height:window.innerHeight,c.getBoundingClientRect().bottom)}
window.nativeRefresh=()=>render(true);
if(window.visualViewport){visualViewport.addEventListener('resize',()=>{document.getElementById('app').style.height=visualViewport.height+'px';setTimeout(reportGeometry,80)})}
render(true);setInterval(()=>render(false),350);
</script></body></html>
