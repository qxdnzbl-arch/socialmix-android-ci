<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="可话">
<link rel="manifest" href="manifest.webmanifest">
<title>可话</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#24252a;--muted:#96979e;--line:#ececf0;--pink:#ff2c64;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#101011;--card:#18181a;--text:#f5f5f6;--muted:#95959c;--line:#2a2a2e}button,input,textarea{font:inherit}.hide{display:none!important}button{cursor:pointer}.shell{max-width:620px;min-height:100dvh;margin:auto;background:var(--bg);position:relative}.login{min-height:100dvh;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:60px 28px 11vh;color:#26272b}.brand{margin:auto 0 30px;text-align:center}.brand b{display:block;font-size:62px;font-weight:900;font-style:italic;letter-spacing:-5px;color:var(--pink)}.brand span{display:block;color:#a7a8ad;font-size:20px;letter-spacing:10px;margin-top:18px;padding-left:10px}.loginbtn{width:min(390px,80vw);height:72px;border:0;border-radius:38px;background:var(--pink);color:#fff;font-size:25px}.note{color:#b0b0b5;font-size:12px;margin-top:16px;text-align:center}.sheet{position:fixed;z-index:99;inset:0;background:#0004;display:flex;align-items:flex-end;justify-content:center}.sheetbox{width:min(620px,100%);background:#fff;color:#222;border-radius:28px 28px 0 0;padding:28px 25px calc(28px + var(--safe))}.tabs{display:flex;gap:26px;margin-bottom:14px}.tabs button{border:0;background:none;padding:7px 0;color:#999;font-weight:700;font-size:20px}.tabs .on{color:#222;border-bottom:3px solid var(--pink)}.field{width:100%;height:56px;border:1px solid #e5e5e9;border-radius:15px;margin:7px 0;padding:0 15px;background:#fff;color:#222}.primary{width:100%;height:56px;border:0;border-radius:16px;background:var(--pink);color:#fff;font-weight:700;font-size:19px;margin-top:12px}.ghost{width:100%;border:0;background:none;padding:13px;color:#777}.screen{min-height:100dvh;padding-bottom:calc(82px + var(--safe))}.home{background:linear-gradient(180deg,#c9dcff 0,#e0d5ff 30%,#f0d9ea 52%,var(--bg) 79%)}body.dark .home{background:linear-gradient(180deg,#20283a,#30283d 40%,#17171a 78%,#101011)}.hero{padding:56px 28px 18px}.date{font-size:17px;color:#5f6066;margin-bottom:25px}.hero h1{font-size:34px;margin:0 0 25px;letter-spacing:-1px}.compose{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 8px 28px #2221}.compose textarea{width:100%;height:205px;border:0;outline:0;resize:none;background:transparent;color:var(--text);font-size:23px;line-height:1.6}.actions{display:flex;align-items:center;justify-content:flex-end;gap:9px}.chip,.small{border:0;border-radius:20px;background:#f2f2f5;color:#6f7076;padding:9px 15px}body.dark .chip,body.dark .small{background:#29292d;color:#ddd}.send{border:0;border-radius:20px;background:var(--pink);color:#fff;padding:10px 22px;font-weight:700}.section{padding:6px 24px 20px}.section h2{font-size:19px}.card{background:var(--card);border-radius:22px;padding:18px;margin:12px 0}.post{font-size:17px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.meta{color:var(--muted);font-size:12px;margin-top:10px}.reshead,.friend{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#8db7d6,#77bea9);display:grid;place-items:center;color:#fff;font-weight:800;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:700}.sub{font-size:13px;color:var(--muted);margin-top:4px}.rowactions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.small.pink{background:#fff0f4;color:var(--pink)}.top{height:72px;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:8}.top h1{font-size:33px;margin:0}.ico{border:0;background:none;font-size:28px;color:var(--text);min-width:44px;min-height:44px}.listrow{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line);min-height:82px}.grow{flex:1;min-width:0}.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:0;width:min(620px,100%);height:calc(76px + var(--safe));padding:9px 50px calc(9px + var(--safe));display:flex;justify-content:space-between;background:#fffc;border-top:1px solid var(--line);backdrop-filter:blur(14px)}body.dark .nav{background:#171717e8}.nav button{width:72px;border:0;background:none;border-radius:25px;font-size:25px;color:#aaa}.nav .on{background:#e8dcfb;color:#222}.cover{height:300px;background:linear-gradient(180deg,#a98c7d,#eaded3);background-size:cover;background-position:center;position:relative}.cover .gear{position:absolute;right:20px;top:22px;color:#fff}.profile{padding:0 24px 105px}.phead{display:flex;gap:18px;align-items:center;padding:24px 0 14px}.pavatar{width:104px;height:104px;border:6px solid var(--bg);margin-top:-56px;font-size:42px}.pname{font-size:29px;font-weight:850}.vip{color:var(--pink);background:#ffe7ee;border-radius:8px;padding:4px 7px;font-size:13px;margin-left:6px}.bio{color:#777;font-size:18px;margin:6px 0 18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card);border-radius:22px;padding:17px}.stat b{font-size:32px}.stat span{float:right;color:var(--muted);margin-top:10px}.wide{margin-top:12px;background:var(--card);border-radius:20px;padding:18px;font-size:19px;font-weight:700}.subpage{min-height:100dvh}.subbar{height:68px;display:flex;align-items:center;border-bottom:1px solid var(--line);padding:8px 15px}.subbar h2{flex:1;text-align:center;font-size:19px}.back{border:0;background:none;color:var(--text);font-size:32px;width:48px}.spacer{width:48px}.chatlist{height:calc(100dvh - 134px);overflow:auto;padding:14px 17px 82px}.bubble{max-width:76%;padding:11px 14px;border-radius:17px;margin:8px 0;line-height:1.5;background:var(--card)}.bubble.me{margin-left:auto;background:#ffd9e4}.chatinput{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(620px,100%);display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe));background:var(--bg);border-top:1px solid var(--line)}.chatinput input{flex:1;border:0;border-radius:20px;padding:11px 14px;background:var(--card);color:var(--text)}.empty{text-align:center;color:var(--muted);padding:42px 20px}.toast{position:fixed;z-index:150;left:50%;transform:translateX(-50%);bottom:110px;background:#222e;color:#fff;padding:10px 15px;border-radius:18px;font-size:14px;max-width:80%;text-align:center}.settings .listrow{min-height:61px}.switch{width:48px;height:28px;border-radius:16px;background:#bbb;padding:3px}.switch i{display:block;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--pink)}.switch.on i{transform:translateX(20px)}
</style>
</head>
<body><div id="app" class="shell"></div>
<script>
(function(){
"use strict";
var URL="https://nvwdtfnhsyfdopaxdylx.supabase.co/rest/v1/rpc/";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52d2R0Zm5oc3lmZG9wYXhkeWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTExNTcsImV4cCI6MjEwMzU4NzE1N30.wXmcZ6KIQOt-eet6ONUgl9HI1eJhJAofdf2_JPD_0Ek";
var app=document.getElementById("app"), token=localStorage.getItem("kh_token")||"", view=token?"home":"login", mode="login", me=null, home=null, threads=[], friends=[], peer=null, timer=null, dark=localStorage.getItem("kh_theme")==="dark";
document.body.classList.toggle("dark",dark);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]})}
function av(u){var t=u&&u.nickname?u.nickname.slice(0,1):"可";return '<div class="avatar">'+esc(t)+'</div>'}
function fmt(t){try{return new Date(t).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
async function rpc(fn,args){var r=await fetch(URL+fn,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+KEY},body:JSON.stringify(args||{})});if(!r.ok)throw new Error("网络请求失败");return await r.json()}
function toast(s){var x=document.createElement("div");x.className="toast";x.textContent=s;document.body.appendChild(x);setTimeout(function(){x.remove()},1800)}
function nav(){return '<nav class="nav"><button class="'+(view==="home"?"on":"")+'" onclick="KH.go(\'home\')">⌂</button><button class="'+(view==="messages"?"on":"")+'" onclick="KH.go(\'messages\')">☏</button><button class="'+(view==="profile"?"on":"")+'" onclick="KH.go(\'profile\')">○</button></nav>'}
function renderLogin(){app.innerHTML='<main class="login"><div class="brand"><b>可话~!</b><span>说你想说的话</span></div><button class="loginbtn" onclick="KH.auth(\'login\')">手机号登录</button><div class="note">公开运营重建版 · 数据跨设备同步</div></main>'}
function auth(m){mode=m;var d=document.createElement("div");d.className="sheet";d.id="sheet";d.innerHTML='<div class="sheetbox"><div class="tabs"><button class="'+(mode==="login"?"on":"")+'" onclick="KH.authMode(\'login\')">登录</button><button class="'+(mode==="register"?"on":"")+'" onclick="KH.authMode(\'register\')">注册</button></div><input id="phone" class="field" inputmode="tel" placeholder="手机号"><input id="pass" class="field" type="password" placeholder="密码（至少6位）">'+(mode==="register"?'<input id="nick" class="field" placeholder="昵称">':"")+'<button class="primary" onclick="KH.submit()">继续</button><button class="ghost" onclick="document.getElementById(\'sheet\').remove()">取消</button></div>';d.onclick=function(e){if(e.target===d)d.remove()};document.body.appendChild(d)}
function authMode(m){document.getElementById("sheet").remove();auth(m)}
async function submit(){var p=document.getElementById("phone").value.trim(),w=document.getElementById("pass").value,n=document.getElementById("nick");if(!p||!w){toast("请填写手机号和密码");return}try{var r=await rpc(mode==="register"?"kehua_prod_register":"kehua_prod_login",mode==="register"?{p_phone:p,p_password:w,p_nickname:n?n.value.trim():null}:{p_phone:p,p_password:w});if(!r.ok)throw new Error(r.error);token=r.token;localStorage.setItem("kh_token",token);me=r.user;document.getElementById("sheet").remove();view="home";await loadHome();render()}catch(e){toast(e.message||"没有成功")}}
function postCard(p,res){var author=res?'<div class="reshead">'+av(p)+'<div><div class="name">'+esc(p.nickname||"可话er")+'</div><div class="sub">'+fmt(p.created_at)+'</div></div></div>':"";return '<article class="card">'+author+'<div class="post">'+esc(p.content||"")+'</div><div class="meta">'+(res?("点亮 "+(p.light_count||0)):(p.is_private?"仅自己 · ":""))+fmt(p.created_at)+'</div>'+(res?'<div class="rowactions"><button class="small pink" onclick="KH.light(\''+p.id+'\')">☀ 点亮</button><button class="small" onclick="KH.profile(\''+p.author_id+'\')">看看TA</button></div>':"")+'</article>'}
function renderHome(){var ds=new Date().toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"short"});var mine=(home&&home.my_posts||[]).map(function(p){return postCard(p,false)}).join("")||'<div class="empty">还没有记录</div>';var rs=(home&&home.resonances||[]).map(function(p){return postCard(p,true)}).join("")||'<div class="empty">暂时没有新的共鸣</div>';app.innerHTML='<main class="screen home"><section class="hero"><div class="date">'+ds+'</div><h1>此刻，说你想说的话~</h1><div class="compose"><textarea id="text" maxlength="3000" placeholder="写下这一刻……"></textarea><div class="actions"><button id="privacy" data-p="0" class="chip" onclick="KH.privacy()">公开</button><button class="send" onclick="KH.publish()">说出去</button></div></div></section><section class="section"><h2>我的记录</h2>'+mine+'<h2>共鸣</h2>'+rs+'</section></main>'+nav()}
function renderMessages(){var list='<div class="listrow" onclick="KH.friends()"><div class="avatar">友</div><div class="grow"><div class="name">我的好友</div><div class="sub">看看已经认识的人</div></div><span>›</span></div><div class="listrow"><div class="avatar" style="background:#f7c52f">☀</div><div class="grow"><div class="name">点亮我的</div><div class="sub">有人被你说的话打动</div></div></div>';list+=(threads||[]).map(function(x){return '<div class="listrow" onclick="KH.chat(\''+x.peer_id+'\',\''+esc(x.nickname).replace(/'/g,"&#39;")+'\')">'+av(x)+'<div class="grow"><div class="name">'+esc(x.nickname)+'</div><div class="sub ellipsis">'+esc(x.body)+'</div></div><div class="sub">'+fmt(x.created_at)+'</div></div>'}).join("");app.innerHTML='<main class="screen"><header class="top"><h1>消息</h1></header>'+list+'</main>'+nav()}
function renderProfile(){var u=me||{},ps=(u.posts||[]).map(function(p){return postCard(p,false)}).join("")||'<div class="empty">还没有说过什么</div>';app.innerHTML='<main class="screen"><section class="cover"><button class="ico gear" onclick="KH.settings()">⚙</button></section><section class="profile"><div class="phead"><div class="avatar pavatar">'+esc((u.nickname||"可").slice(0,1))+'</div><div><div class="pname">'+esc(u.nickname||"可话er")+'<span class="vip">VIP</span></div><div class="sub">'+esc([u.gender,u.region].filter(Boolean).join(" · ")||"")+'</div></div></div><div class="bio">'+esc(u.bio||"")+'</div><div class="stats"><div class="stat"><b>'+Number(u.friend_count||0)+'</b><span>好友</span></div><div class="stat"><b>'+Number(u.light_count||0)+'</b><span>点亮</span></div></div><div class="wide" onclick="KH.vip()">我的VIP <span style="float:right">›</span></div><h3>我说过的</h3>'+ps+'</section></main>'+nav()}
async function renderOther(id){try{var r=await rpc("kehua_prod_profile",{p_token:token,p_account:id});if(!r.ok)throw new Error(r.error);var u=r.user,ps=(u.posts||[]).map(function(p){return postCard(p,false)}).join("");app.innerHTML='<main class="subpage"><header class="subbar"><button class="back" onclick="KH.back()">‹</button><h2>'+esc(u.nickname)+'</h2><span class="spacer"></span></header><section class="profile"><div class="phead"><div class="avatar pavatar">'+esc((u.nickname||"可").slice(0,1))+'</div><div><div class="pname">'+esc(u.nickname)+'</div><div class="sub">'+esc(u.region||"")+'</div></div></div><div class="bio">'+esc(u.bio||"")+'</div><div class="rowactions"><button class="small pink" onclick="KH.add(\''+u.id+'\')">加好友</button><button class="small" onclick="KH.chat(\''+u.id+'\',\''+esc(u.nickname).replace(/'/g,"&#39;")+'\')">回应TA</button></div>'+ps+'</section></main>';view="other"}catch(e){toast(e.message)}}
async function renderFriends(){await loadFriends();app.innerHTML='<main class="subpage"><header class="subbar"><button class="back" onclick="KH.back()">‹</button><h2>我的好友</h2><span class="spacer"></span></header>'+(friends.length?friends.map(function(x){return '<div class="listrow" onclick="KH.chat(\''+x.id+'\',\''+esc(x.nickname).replace(/'/g,"&#39;")+'\')">'+av(x)+'<div class="grow"><div class="name">'+esc(x.nickname)+'</div><div class="sub">'+esc(x.bio||"")+'</div></div><span>›</span></div>'}).join(""):'<div class="empty">还没有好友，去点亮一条共鸣吧</div>')+'</main>';view="friends"}
function settings(){view="settings";app.innerHTML='<main class="subpage settings"><header class="subbar"><button class="back" onclick="KH.back()">‹</button><h2>设置</h2><span class="spacer"></span></header><div class="listrow" onclick="KH.theme()"><div class="grow">深色模式</div><span class="switch '+(dark?"on":"")+'"><i></i></span></div><div class="listrow" onclick="KH.about()"><div class="grow">关于可话</div><span>›</span></div><div class="listrow" onclick="KH.logout()"><div class="grow" style="color:var(--pink)">退出登录</div></div></main>'}
async function renderChat(id,name){view="chat";peer={id:id,name:name,items:[]};await refreshChat();clearInterval(timer);timer=setInterval(function(){if(view==="chat")refreshChat(true)},3000)}
async function refreshChat(quiet){try{var r=await rpc("kehua_prod_chat",{p_token:token,p_other:peer.id});if(!r.ok)throw new Error(r.error);peer.name=r.peer.nickname;peer.items=r.items||[];var bs=peer.items.map(function(m){return '<div class="bubble '+(m.from_id===me.id?"me":"")+'">'+esc(m.body)+'<div class="meta">'+fmt(m.created_at)+'</div></div>'}).join("");app.innerHTML='<main class="subpage"><header class="subbar"><button class="back" onclick="KH.back()">‹</button><h2>'+esc(peer.name)+'</h2><span class="spacer"></span></header><div id="chatlist" class="chatlist">'+bs+'</div><div class="chatinput"><input id="msg" maxlength="2000" placeholder="说点什么"><button class="send" onclick="KH.sendmsg()">发送</button></div></main>';setTimeout(function(){var e=document.getElementById("chatlist");if(e)e.scrollTop=e.scrollHeight},10)}catch(e){if(!quiet)toast(e.message)}}
async function sendmsg(){var i=document.getElementById("msg"),b=i.value.trim();if(!b)return;try{var r=await rpc("kehua_prod_send_message",{p_token:token,p_to:peer.id,p_body:b});if(!r.ok)throw new Error(r.error);i.value="";await refreshChat()}catch(e){toast(e.message)}}
async function loadMe(){var r=await rpc("kehua_prod_me",{p_token:token});if(!r.ok)throw new Error(r.error);me=r.user}
async function loadHome(){var r=await rpc("kehua_prod_home",{p_token:token});if(!r.ok)throw new Error(r.error);home=r}
async function loadThreads(){var r=await rpc("kehua_prod_threads",{p_token:token});if(!r.ok)throw new Error(r.error);threads=r.items||[]}
async function loadFriends(){var r=await rpc("kehua_prod_friends",{p_token:token});if(!r.ok)throw new Error(r.error);friends=r.items||[]}
async function go(v){clearInterval(timer);try{if(!me)await loadMe();view=v;if(v==="home"){await loadHome();renderHome()}else if(v==="messages"){await loadThreads();renderMessages()}else{await loadMe();renderProfile()}}catch(e){sessionError(e)}}
function render(){if(!token){renderLogin();return}go(view==="login"?"home":view)}
function sessionError(e){if(String(e.message).indexOf("失效")>=0){localStorage.removeItem("kh_token");token="";view="login";renderLogin()}else toast(e.message||"网络开小差了")}
async function publish(){var t=document.getElementById("text").value.trim(),pr=document.getElementById("privacy").dataset.p==="1";if(!t){toast("先说点什么吧");return}try{var r=await rpc("kehua_prod_create_post",{p_token:token,p_content:t,p_media_data:null,p_private:pr});if(!r.ok)throw new Error(r.error);toast("已经说出去了");await loadHome();renderHome()}catch(e){toast(e.message)}}
function privacy(){var b=document.getElementById("privacy"),on=b.dataset.p==="1";b.dataset.p=on?"0":"1";b.textContent=on?"公开":"仅自己"}
async function light(id){try{var r=await rpc("kehua_prod_light",{p_token:token,p_post_id:id});if(!r.ok)throw new Error(r.error);toast("点亮了");await loadHome();renderHome()}catch(e){toast(e.message)}}
async function add(id){try{var r=await rpc("kehua_prod_add_friend",{p_token:token,p_other:id});if(!r.ok)throw new Error(r.error);toast("已经成为好友")}catch(e){toast(e.message)}}
async function back(){clearInterval(timer);if(view==="chat"){view="messages";await loadThreads();renderMessages()}else{view="profile";await loadMe();renderProfile()}}
function theme(){dark=!dark;localStorage.setItem("kh_theme",dark?"dark":"light");document.body.classList.toggle("dark",dark);settings()}
function about(){toast("可话 · 独立重建运营版，不代表原开发团队")}
function vip(){toast("VIP 支付尚未开放，不会产生扣费")}
async function logout(){try{await rpc("kehua_prod_logout",{p_token:token})}catch(e){}localStorage.removeItem("kh_token");token="";me=null;view="login";renderLogin()}
window.KH={auth:auth,authMode:authMode,submit:submit,go:go,publish:publish,privacy:privacy,light:light,profile:renderOther,friends:renderFriends,chat:renderChat,sendmsg:sendmsg,add:add,back:back,settings:settings,theme:theme,about:about,vip:vip,logout:logout};
if(token){go("home")}else renderLogin();
})();
</script></body></html>
