<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>表达</title>
<style>
  :root {
    --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;

    --color-bg: #F7F6F3;
    --color-surface: #FFFFFF;
    --color-surface-alt: #FCFBF8;
    --color-ink: #22252A;
    --color-ink-secondary: #96988F;
    --color-ink-tertiary: #C7C6BF;
    --color-divider: rgba(34, 37, 42, 0.08);
    --color-accent: #4B6E63;
    --color-accent-contrast: #FFFFFF;
    --color-disabled-bg: #E7E5DE;
    --color-disabled-fg: #B6B4AC;
    --color-scrim: rgba(23, 24, 22, 0.03);

    --font-size-greeting: 21px;
    --font-size-body: 17px;
    --font-size-meta: 13px;
    --font-size-nav: 10.5px;
    --weight-regular: 400;
    --weight-medium: 500;
    --weight-semibold: 600;

    --space-page-x: 24px;
    --space-xs: 8px;
    --space-sm: 12px;
    --space-md: 20px;
    --space-lg: 32px;
    --space-xl: 48px;

    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-pill: 999px;

    --height-button: 52px;
    --height-input-min: 116px;
    --height-nav: 58px;
    --icon-size: 23px;

    --duration-fast: 120ms;
    --duration-base: 220ms;
    --duration-slow: 360ms;
    --ease: cubic-bezier(.22, .1, .18, 1);

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-bg: #16171A;
      --color-surface: #1E2022;
      --color-surface-alt: #202325;
      --color-ink: #ECEDE8;
      --color-ink-secondary: #85877F;
      --color-ink-tertiary: #55564F;
      --color-divider: rgba(255, 255, 255, 0.07);
      --color-accent: #86A99C;
      --color-accent-contrast: #10201A;
      --color-disabled-bg: #292B2B;
      --color-disabled-fg: #55564F;
      --color-scrim: rgba(255, 255, 255, 0.02);
    }
  }
  :root[data-theme="dark"] {
    --color-bg: #16171A;
    --color-surface: #1E2022;
    --color-surface-alt: #202325;
    --color-ink: #ECEDE8;
    --color-ink-secondary: #85877F;
    --color-ink-tertiary: #55564F;
    --color-divider: rgba(255, 255, 255, 0.07);
    --color-accent: #86A99C;
    --color-accent-contrast: #10201A;
    --color-disabled-bg: #292B2B;
    --color-disabled-fg: #55564F;
    --color-scrim: rgba(255, 255, 255, 0.02);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--color-bg);
    overscroll-behavior: none;
  }
  body {
    font-family: var(--font-family);
    color: var(--color-ink);
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* ---------- Top ---------- */
  .top {
    flex-shrink: 0;
    padding: var(--space-md) var(--space-page-x) var(--space-xs);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: opacity var(--duration-base) var(--ease);
  }
  .top .date {
    font-size: var(--font-size-meta);
    color: var(--color-ink-secondary);
    font-weight: var(--weight-regular);
    letter-spacing: 0.01em;
  }
  .top .mood-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-accent);
    opacity: 0.55;
  }

  /* ---------- View switching ---------- */
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }

  /* ---------- Compose ---------- */
  .compose {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: var(--space-lg) var(--space-page-x) var(--space-md);
    min-height: 0;
    overflow-y: auto;
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  .prompt {
    font-size: var(--font-size-greeting);
    font-weight: var(--weight-semibold);
    line-height: 1.45;
    color: var(--color-ink);
    letter-spacing: 0.002em;
    margin: 0 0 var(--space-md);
    transition: opacity var(--duration-slow) var(--ease),
                transform var(--duration-slow) var(--ease),
                margin var(--duration-base) var(--ease),
                font-size var(--duration-base) var(--ease);
  }
  .page.is-focused .prompt {
    font-size: var(--font-size-meta);
    font-weight: var(--weight-medium);
    color: var(--color-ink-secondary);
    transform: translateY(-2px);
    margin-bottom: var(--space-sm);
  }

  .input-wrap {
    flex: 1;
    display: flex;
    background: var(--color-surface-alt);
    border-radius: var(--radius-lg);
    border: 1px solid transparent;
    padding: var(--space-md);
    min-height: var(--height-input-min);
    transition: background var(--duration-base) var(--ease),
                border-color var(--duration-base) var(--ease),
                box-shadow var(--duration-base) var(--ease);
  }
  .page.is-focused .input-wrap {
    background: var(--color-surface);
    border-color: var(--color-divider);
    box-shadow: 0 1px 2px var(--color-scrim), 0 8px 24px -18px rgba(0,0,0,0.25);
  }

  .textarea {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: var(--font-size-body);
    font-weight: var(--weight-regular);
    line-height: 1.6;
    color: var(--color-ink);
    caret-color: var(--color-accent);
    padding: 0;
    max-height: 46vh;
  }
  .textarea::placeholder {
    color: var(--color-ink-tertiary);
  }

  /* ---------- Action bar ---------- */
  .action-bar {
    flex-shrink: 0;
    padding: 0 var(--space-page-x) var(--space-md);
    display: flex;
    justify-content: flex-end;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity var(--duration-base) var(--ease),
                transform var(--duration-base) var(--ease);
  }
  .page.show-action .action-bar {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .publish-btn {
    height: var(--height-button);
    padding: 0 var(--space-lg);
    border: none;
    border-radius: var(--radius-pill);
    font-family: inherit;
    font-size: var(--font-size-body);
    font-weight: var(--weight-medium);
    background: var(--color-disabled-bg);
    color: var(--color-disabled-fg);
    transition: background var(--duration-base) var(--ease),
                color var(--duration-base) var(--ease),
                transform var(--duration-fast) var(--ease);
  }
  .publish-btn:active {
    transform: scale(0.96);
  }
  .publish-btn.is-enabled {
    background: var(--color-accent);
    color: var(--color-accent-contrast);
  }

  /* ---------- Toast ---------- */
  .toast {
    position: absolute;
    left: 50%;
    top: calc(var(--space-xl) + env(safe-area-inset-top, 0px));
    transform: translate(-50%, -8px);
    background: var(--color-ink);
    color: var(--color-bg);
    font-size: var(--font-size-meta);
    font-weight: var(--weight-medium);
    padding: var(--space-xs) var(--space-md);
    border-radius: var(--radius-pill);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--duration-base) var(--ease),
                transform var(--duration-base) var(--ease);
    white-space: nowrap;
    z-index: 30;
  }
  .toast.show {
    opacity: 0.92;
    transform: translate(-50%, 0);
  }

  /* ---------- Tab bar ---------- */
  .tabbar {
    flex-shrink: 0;
    height: var(--height-nav);
    display: flex;
    align-items: stretch;
    border-top: 1px solid var(--color-divider);
    background: var(--color-bg);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: transform var(--duration-slow) var(--ease),
                opacity var(--duration-base) var(--ease);
  }
  .page.is-focused .tabbar,
  .page.show-detail .tabbar {
    transform: translateY(100%);
    opacity: 0;
    pointer-events: none;
  }

  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: none;
    border: none;
    font-family: inherit;
    color: var(--color-ink-tertiary);
    transition: color var(--duration-base) var(--ease),
                transform var(--duration-fast) var(--ease);
  }
  .tab:active { transform: scale(0.93); }
  .tab svg {
    width: var(--icon-size);
    height: var(--icon-size);
  }
  .tab span {
    font-size: var(--font-size-nav);
    font-weight: var(--weight-medium);
    letter-spacing: 0.01em;
  }
  .tab.active { color: var(--color-accent); }

  /* ---------- Echo (共鸣) ---------- */
  .echo-intro {
    flex-shrink: 0;
    padding: var(--space-lg) var(--space-page-x) var(--space-md);
  }
  .echo-intro-text {
    font-size: var(--font-size-greeting);
    font-weight: var(--weight-semibold);
    line-height: 1.45;
    color: var(--color-ink);
    margin: 0;
    letter-spacing: 0.002em;
  }

  .echo-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 var(--space-page-x) var(--space-xl);
  }

  .echo-item {
    padding: var(--space-lg) 0;
    border-bottom: 1px solid var(--color-divider);
    cursor: pointer;
    transition: opacity var(--duration-fast) var(--ease);
  }
  .echo-item:first-child { padding-top: var(--space-xs); }
  .echo-item:last-child { border-bottom: none; }
  .echo-item:active { opacity: 0.6; }

  .echo-insight {
    font-size: var(--font-size-meta);
    font-weight: var(--weight-medium);
    color: var(--color-accent);
    line-height: 1.5;
    margin: 0 0 var(--space-sm);
  }

  /* Shared quote atom — reused on echo list and detail page */
  .quote-block { margin-bottom: var(--space-sm); }
  .quote-block:last-child { margin-bottom: 0; }
  .quote-label {
    display: block;
    font-size: var(--font-size-nav);
    font-weight: var(--weight-medium);
    color: var(--color-ink-tertiary);
    letter-spacing: 0.02em;
    margin-bottom: 3px;
  }
  .quote-block.mine .quote-label { color: var(--color-accent); }
  .quote-text {
    font-size: var(--font-size-body);
    line-height: 1.6;
    color: var(--color-ink);
    margin: 0;
  }

  /* ---------- Person detail ---------- */
  .detail {
    position: absolute;
    inset: 0;
    background: var(--color-bg);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform var(--duration-slow) var(--ease);
    z-index: 20;
  }
  .detail.open { transform: translateX(0); }

  .detail-top {
    flex-shrink: 0;
    padding: var(--space-md) var(--space-page-x) var(--space-xs);
    display: flex;
    align-items: center;
  }
  .back-btn {
    width: 34px;
    height: 34px;
    margin-left: -8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    color: var(--color-ink-secondary);
    transition: transform var(--duration-fast) var(--ease);
  }
  .back-btn:active { transform: scale(0.9); }
  .back-btn svg { width: 21px; height: 21px; }

  .detail-scroll {
    flex: 1;
    overflow-y: auto;
    padding: var(--space-sm) var(--space-page-x) var(--space-xl);
  }

  .detail-lead {
    font-size: var(--font-size-meta);
    color: var(--color-ink-secondary);
    margin: 0 0 var(--space-md);
    line-height: 1.5;
  }

  .detail-divider {
    height: 1px;
    background: var(--color-divider);
    margin: var(--space-lg) 0;
  }

  .detail-section-label {
    font-size: var(--font-size-meta);
    color: var(--color-ink-tertiary);
    letter-spacing: 0.02em;
    margin: 0 0 var(--space-md);
  }

  .detail-more p {
    font-size: var(--font-size-body);
    line-height: 1.6;
    color: var(--color-ink);
    margin: 0 0 var(--space-lg);
    padding-bottom: var(--space-lg);
    border-bottom: 1px solid var(--color-divider);
  }
  .detail-more p:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  /* ---------- Me (我) ---------- */
  .me-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 0 var(--space-page-x) var(--space-xl);
  }

  .me-intro {
    padding: var(--space-lg) 0 var(--space-lg);
  }
  .me-intro-text {
    font-size: var(--font-size-greeting);
    font-weight: var(--weight-semibold);
    line-height: 1.45;
    color: var(--color-ink);
    letter-spacing: 0.002em;
    margin: 0 0 6px;
  }
  .me-intro-sub {
    font-size: var(--font-size-meta);
    color: var(--color-ink-secondary);
    line-height: 1.5;
    margin: 0;
  }

  .me-section {
    margin-bottom: var(--space-lg);
  }
  .me-section:last-child {
    margin-bottom: 0;
  }
  .me-section-label {
    font-size: var(--font-size-meta);
    color: var(--color-ink-tertiary);
    letter-spacing: 0.02em;
    margin: 0 0 var(--space-md);
  }

  /* Own-expression timeline */
  .me-timeline {
    position: relative;
    padding-left: 18px;
  }
  .me-timeline::before {
    content: '';
    position: absolute;
    left: 4px;
    top: 7px;
    bottom: 7px;
    width: 1px;
    background: var(--color-divider);
  }
  .me-entry {
    position: relative;
    padding-bottom: var(--space-md);
    cursor: pointer;
    transition: opacity var(--duration-fast) var(--ease);
  }
  .me-entry:last-child {
    padding-bottom: 0;
  }
  .me-entry:active {
    opacity: 0.55;
  }
  .me-entry::before {
    content: '';
    position: absolute;
    left: -18px;
    top: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--color-ink-tertiary);
  }
  .me-entry-date {
    display: block;
    font-size: var(--font-size-nav);
    color: var(--color-ink-tertiary);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .me-entry-text {
    font-size: var(--font-size-body);
    line-height: 1.6;
    color: var(--color-ink);
    margin: 0;
  }

  /* Emerging connections between own expressions */
  .me-patterns {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
  }
  .me-pattern {
    background: var(--color-surface-alt);
    border-radius: var(--radius-lg);
    padding: var(--space-md);
    cursor: pointer;
    transition: opacity var(--duration-fast) var(--ease),
                transform var(--duration-fast) var(--ease);
  }
  .me-pattern:active {
    opacity: 0.7;
    transform: scale(0.99);
  }
  .me-pattern-lead {
    font-size: var(--font-size-meta);
    font-weight: var(--weight-medium);
    color: var(--color-accent);
    line-height: 1.5;
    margin: 0 0 var(--space-sm);
  }
  .me-pattern-preview {
    font-size: var(--font-size-body);
    line-height: 1.5;
    color: var(--color-ink);
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .me-pattern-meta {
    display: block;
    margin-top: var(--space-sm);
    font-size: var(--font-size-nav);
    color: var(--color-ink-tertiary);
  }

  /* Me detail overlay — same slide-over mechanics as the person detail panel */
  .me-detail {
    position: absolute;
    inset: 0;
    background: var(--color-bg);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform var(--duration-slow) var(--ease);
    z-index: 20;
  }
  .me-detail.open {
    transform: translateX(0);
  }
  .me-detail-quote {
    font-size: var(--font-size-greeting);
    font-weight: var(--weight-regular);
    line-height: 1.6;
    color: var(--color-ink);
    margin: 0;
  }
  .me-detail-list .quote-block {
    padding-bottom: var(--space-lg);
    margin-bottom: var(--space-lg);
    border-bottom: 1px solid var(--color-divider);
  }
  .me-detail-list .quote-block:last-child {
    padding-bottom: 0;
    margin-bottom: 0;
    border-bottom: none;
  }
</style>
</head>
<body>
  <div class="page" id="page">

    <div class="view active" id="viewExpress">
      <div class="top">
        <span class="date" id="dateExpress"></span>
        <span class="mood-dot"></span>
      </div>
      <div class="compose">
        <p class="prompt">今天，想说点什么</p>
        <div class="input-wrap">
          <textarea
            id="textarea"
            class="textarea"
            placeholder="写下此刻的想法……"
            rows="1"
          ></textarea>
        </div>
      </div>
      <div class="action-bar" id="actionBar">
        <button class="publish-btn" id="publishBtn" disabled>发布</button>
      </div>
    </div>

    <div class="view" id="viewEcho">
      <div class="top">
        <span class="date" id="dateEcho"></span>
        <span class="mood-dot"></span>
      </div>
      <div class="echo-intro">
        <p class="echo-intro-text">这些重合，是你们慢慢靠近的开始</p>
      </div>
      <div class="echo-list" id="echoList"></div>
    </div>

    <div class="view" id="viewMe">
      <div class="top">
        <span class="date" id="dateMe"></span>
        <span class="mood-dot"></span>
      </div>
      <div class="me-scroll" id="meScroll">
        <div class="me-intro">
          <p class="me-intro-text">你说过的话，正在慢慢变成你</p>
          <p class="me-intro-sub">不是标签，是你自己留下的痕迹</p>
        </div>

        <div class="me-section">
          <p class="me-section-label">最近说过</p>
          <div class="me-timeline" id="meTimeline"></div>
        </div>

        <div class="me-section">
          <p class="me-section-label">正在浮现的联系</p>
          <div class="me-patterns" id="mePatterns"></div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="express">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="6" y1="8" x2="18" y2="8"/>
          <line x1="6" y1="12" x2="15" y2="12"/>
          <line x1="6" y1="16" x2="11" y2="16"/>
        </svg>
        <span>表达</span>
      </button>
      <button class="tab" data-tab="echo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="2.1"/>
          <circle cx="12" cy="12" r="6.2" opacity="0.55"/>
          <circle cx="12" cy="12" r="10.2" opacity="0.28"/>
        </svg>
        <span>共鸣</span>
      </button>
      <button class="tab" data-tab="me">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="8.3" r="3.3"/>
          <path d="M5.5 19c1.2-3.2 3.7-4.8 6.5-4.8s5.3 1.6 6.5 4.8"/>
        </svg>
        <span>我</span>
      </button>
    </nav>

    <div class="detail" id="detail">
      <div class="detail-top">
        <button class="back-btn" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5 8 12l7 7"/>
          </svg>
        </button>
      </div>
      <div class="detail-scroll" id="detailScroll">
        <p class="detail-lead">你是从这个重合点看到TA的</p>
        <div class="quote-block">
          <span class="quote-label">TA说</span>
          <p class="quote-text" id="detailTheirQuote"></p>
        </div>
        <div class="quote-block mine">
          <span class="quote-label">你说</span>
          <p class="quote-text" id="detailMyQuote"></p>
        </div>
        <div class="detail-divider"></div>
        <p class="detail-section-label">更多的TA</p>
        <div class="detail-more" id="detailMore"></div>
      </div>
    </div>

    <div class="me-detail" id="meDetail">
      <div class="detail-top">
        <button class="back-btn" id="meBackBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5 8 12l7 7"/>
          </svg>
        </button>
      </div>
      <div class="detail-scroll" id="meDetailScroll">
        <p class="detail-lead" id="meDetailLead"></p>
        <div id="meDetailBody"></div>
      </div>
    </div>

  </div>

<script>
  const page = document.getElementById('page');
  const textarea = document.getElementById('textarea');
  const publishBtn = document.getElementById('publishBtn');
  const tabs = document.querySelectorAll('.tab');
  const views = document.querySelectorAll('.view');
  const toast = document.getElementById('toast');

  // ---------- Date ----------
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  const now = new Date();
  const dateStr = `${now.getMonth() + 1}月${now.getDate()}日 · ${weekdays[now.getDay()]}`;
  document.getElementById('dateExpress').textContent = dateStr;
  document.getElementById('dateEcho').textContent = dateStr;
  document.getElementById('dateMe').textContent = dateStr;

  // ---------- Toast ----------
  let toastTimer;
  function showToast(text, duration = 1400) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
  }

  // ---------- Compose (表达) ----------
  function autoResize() {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
  }
  function updatePublishState() {
    const hasContent = textarea.value.trim().length > 0;
    publishBtn.disabled = !hasContent;
    publishBtn.classList.toggle('is-enabled', hasContent);
    page.classList.toggle('show-action', hasContent || page.classList.contains('is-focused'));
  }
  textarea.addEventListener('input', () => { autoResize(); updatePublishState(); });
  textarea.addEventListener('focus', () => {
    page.classList.add('is-focused');
    page.classList.add('show-action');
  });
  textarea.addEventListener('blur', () => {
    page.classList.remove('is-focused');
    if (textarea.value.trim().length === 0) page.classList.remove('show-action');
  });
  publishBtn.addEventListener('click', () => {
    if (publishBtn.disabled) return;
    textarea.blur();
    showToast('已表达', 900);
    setTimeout(() => {
      textarea.value = '';
      autoResize();
      updatePublishState();
    }, 900);
  });
  autoResize();
  updatePublishState();

  // ---------- Tabs ----------
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const name = tab.dataset.tab;
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      views.forEach(v => v.classList.remove('active'));
      const viewId = name === 'express' ? 'viewExpress' : name === 'echo' ? 'viewEcho' : 'viewMe';
      document.getElementById(viewId).classList.add('active');
    });
  });

  // ---------- Resonance data ----------
  const resonances = [
    {
      id: 'r1',
      insight: '你们都更喜欢不需要持续回应的陪伴方式',
      theirQuote: '我喜欢和一个人各做各的，不需要一直聊天。',
      myQuote: '我喜欢有人在，但不喜欢被时刻需要。',
      more: [
        '有时候我情愿一个人待着，也不想勉强自己出门社交。',
        '安静地待在一起，比找话题聊天更让我放松。',
        '我不太主动找人聊天，但如果对方在，我会很安心。'
      ]
    },
    {
      id: 'r2',
      insight: '你们都在安静的时刻里找一点仪式感',
      theirQuote: '下雨天我喜欢把灯关暗一点，听窗外的声音。',
      myQuote: '我也是，雨天总让我想把手机放下，发一会儿呆。',
      more: [
        '我很少在雨天出门，更喜欢待在屋里看雨。',
        '有时候我会特意留一点安静的时间，什么都不做。',
        '灯光暗一点的时候，我反而更容易想清楚事情。'
      ]
    },
    {
      id: 'r3',
      insight: '你们都不急于用提问填满认识一个人的过程',
      theirQuote: '我很喜欢慢慢认识一个人，不想一开始就问很多问题。',
      myQuote: '比起直接问，我更想通过对方说的话慢慢了解。',
      more: [
        '认识一个人这件事，我不太喜欢用列问题的方式。',
        '有些事情我不会主动说，但如果对方问，我也不会回避。',
        '我更相信慢慢积累出来的了解，而不是快速的判断。'
      ]
    },
    {
      id: 'r4',
      insight: '你们都能自然接受沉默，不觉得需要打破它',
      theirQuote: '有时候两个人不说话也不会尴尬。',
      myQuote: '沉默对我来说不是冷场，是一种舒服的状态。',
      more: [
        '我不太害怕安静，反而觉得那是可以喘口气的时刻。',
        '跟处得来的人在一起，不说话也没关系。',
        '有些相处不需要一直找话题，安静也是一种交流。'
      ]
    }
  ];

  const echoList = document.getElementById('echoList');
  echoList.innerHTML = resonances.map(r => `
    <div class="echo-item" data-id="${r.id}">
      <p class="echo-insight">${r.insight}</p>
      <div class="quote-block">
        <span class="quote-label">TA说</span>
        <p class="quote-text">${r.theirQuote}</p>
      </div>
      <div class="quote-block mine">
        <span class="quote-label">你说</span>
        <p class="quote-text">${r.myQuote}</p>
      </div>
    </div>
  `).join('');

  // ---------- Person detail ----------
  const detail = document.getElementById('detail');
  const detailScroll = document.getElementById('detailScroll');
  const detailTheirQuote = document.getElementById('detailTheirQuote');
  const detailMyQuote = document.getElementById('detailMyQuote');
  const detailMore = document.getElementById('detailMore');
  const backBtn = document.getElementById('backBtn');
  let savedEchoScroll = 0;

  function openDetail(id) {
    const r = resonances.find(x => x.id === id);
    if (!r) return;
    savedEchoScroll = echoList.scrollTop;
    detailTheirQuote.textContent = r.theirQuote;
    detailMyQuote.textContent = r.myQuote;
    detailMore.innerHTML = '';
    r.more.forEach(t => {
      const p = document.createElement('p');
      p.textContent = t;
      detailMore.appendChild(p);
    });
    detailScroll.scrollTop = 0;
    page.classList.add('show-detail');
    detail.classList.add('open');
  }

  function closeDetail() {
    detail.classList.remove('open');
    setTimeout(() => {
      page.classList.remove('show-detail');
      echoList.scrollTop = savedEchoScroll;
    }, 360);
  }

  echoList.addEventListener('click', e => {
    const item = e.target.closest('.echo-item');
    if (item) openDetail(item.dataset.id);
  });
  backBtn.addEventListener('click', closeDetail);

  // ---------- Me page (我) ----------
  const myExpressions = [
    { id: 'e6', date: '9月21日', text: '我不想为了交朋友硬聊。' },
    { id: 'e5', date: '9月14日', text: '我喜欢光遇，但不喜欢强社交，更喜欢安静地和别人待在一起。' },
    { id: 'e4', date: '8月30日', text: '如果你说是真的，那请你拿出证据来。' },
    { id: 'e3', date: '8月10日', text: '有时候我宁愿一个人待着，也不想勉强自己出门社交。' },
    { id: 'e2', date: '6月2日', text: '刚认识一个人的时候，我很少主动开口，怕说错话。' },
    { id: 'e1', date: '3月15日', text: '以前我总觉得，有人在身边就该一直说话，不然会尴尬。' }
  ];
  const myExpressionMap = Object.fromEntries(myExpressions.map(e => [e.id, e]));

  const myPatterns = [
    {
      id: 'p1',
      lead: '这句话，你好像不止说过一次',
      quoteIds: ['e6', 'e5', 'e3']
    },
    {
      id: 'p2',
      lead: '这里，现在的你和从前不太一样',
      quoteIds: ['e1', 'e3']
    }
  ];

  const meTimeline = document.getElementById('meTimeline');
  meTimeline.innerHTML = myExpressions.map(e => `
    <div class="me-entry" data-id="${e.id}">
      <span class="me-entry-date">${e.date}</span>
      <p class="me-entry-text">${e.text}</p>
    </div>
  `).join('');

  const mePatterns = document.getElementById('mePatterns');
  mePatterns.innerHTML = myPatterns.map(p => {
    const first = myExpressionMap[p.quoteIds[0]];
    return `
      <div class="me-pattern" data-id="${p.id}">
        <p class="me-pattern-lead">${p.lead}</p>
        <p class="me-pattern-preview">${first.text}</p>
        <span class="me-pattern-meta">共 ${p.quoteIds.length} 条</span>
      </div>
    `;
  }).join('');

  const meScroll = document.getElementById('meScroll');
  const meDetail = document.getElementById('meDetail');
  const meDetailScroll = document.getElementById('meDetailScroll');
  const meDetailLead = document.getElementById('meDetailLead');
  const meDetailBody = document.getElementById('meDetailBody');
  const meBackBtn = document.getElementById('meBackBtn');
  let savedMeScroll = 0;

  function openMeEntry(id) {
    const e = myExpressionMap[id];
    if (!e) return;
    savedMeScroll = meScroll.scrollTop;
    meDetailLead.textContent = e.date;
    meDetailBody.className = '';
    meDetailBody.innerHTML = `<p class="me-detail-quote">${e.text}</p>`;
    openMeDetailPanel();
  }

  function openMePattern(id) {
    const p = myPatterns.find(x => x.id === id);
    if (!p) return;
    savedMeScroll = meScroll.scrollTop;
    meDetailLead.textContent = p.lead;
    meDetailBody.className = 'me-detail-list';
    meDetailBody.innerHTML = p.quoteIds.map(qid => {
      const e = myExpressionMap[qid];
      return `
        <div class="quote-block">
          <span class="quote-label">${e.date}</span>
          <p class="quote-text">${e.text}</p>
        </div>
      `;
    }).join('');
    openMeDetailPanel();
  }

  function openMeDetailPanel() {
    meDetailScroll.scrollTop = 0;
    page.classList.add('show-detail');
    meDetail.classList.add('open');
  }

  function closeMeDetail() {
    meDetail.classList.remove('open');
    setTimeout(() => {
      page.classList.remove('show-detail');      meScroll.scrollTop = savedMeScroll;
    }, 360);
  }

  meTimeline.addEventListener('click', e => {
    const item = e.target.closest('.me-entry');
    if (item) openMeEntry(item.dataset.id);
  });
  mePatterns.addEventListener('click', e => {
    const item = e.target.closest('.me-pattern');
    if (item) openMePattern(item.dataset.id);
  });
  meBackBtn.addEventListener('click', closeMeDetail);

  // ---------- Keyboard overlap (from express page) ----------
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const baseHeight = vv.height;
    vv.addEventListener('resize', () => {
      const overlap = Math.max(0, baseHeight - vv.height);
      page.style.paddingBottom = overlap > 60 ? overlap + 'px' : '';
    });
  }
</script>
</body>
</html>
