<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5fa">
<link rel="manifest" href="./manifest.webmanifest">
<title>可话</title>
<style>
:root{--bg:#f5f4f8;--card:#fff;--ink:#202025;--sub:#96949e;--line:#eceaf0;--pink:#ff3b6d;--pink2:#ff5d88;--bubble:#f0eff3;--shadow:0 8px 30px rgba(80,72,95,.08);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
html[data-theme=dark]{--bg:#0f0f11;--card:#171719;--ink:#f2f2f4;--sub:#8d8d95;--line:#28282c;--bubble:#25252a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit;color:inherit}button{border:0;background:none}.app{min-height:100dvh;max-width:520px;margin:auto;background:var(--bg);position:relative;padding-bottom:72px}.hidden{display:none!important}
.splash{min-height:100dvh;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.splash-logo{font-size:38px;font-weight:900;font-style:italic;color:var(--pink);letter-spacing:.04em}.splash-sub{font-size:12px;color:#c7c5cc;letter-spacing:.7em;margin:10px 0 180px}.splash button{position:absolute;bottom:58px;background:var(--pink);color:#fff;border-radius:24px;width:220px;height:46px;font-weight:650}
.auth{min-height:100dvh;background:#fff;padding:108px 32px 40px}.auth h1{font-size:32px;margin:0 0 8px}.auth p{color:#9a98a1;margin:0 0 34px}.mode{display:flex;gap:26px;margin-bottom:26px}.mode button{font-size:17px;color:#aaa7b0;padding:8px 0;border-bottom:2px solid transparent}.mode button.on{color:#222;border-color:var(--pink);font-weight:650}.field{width:100%;height:54px;border:1px solid #e8e6ec;background:#fff;border-radius:13px;padding:0 16px;outline:none;margin:7px 0}.go{width:100%;height:52px;border-radius:26px;background:var(--pink);color:#fff;margin-top:18px;font-weight:700}.hint{font-size:12px;color:#aaa7b0;line-height:1.7;margin-top:18px}.status{font-size:12px;color:#d85c6b;min-height:20px;margin-top:8px}
.home-hero{min-height:440px;padding:76px 24px 22px;background:linear-gradient(145deg,#d9e8ff 0%,#f6dcef 45%,#f5eef0 72%,var(--bg) 100%)}html[data-theme=dark] .home-hero{background:linear-gradient(145deg,#1c2130,#211722 55%,#111)}
.date{color:var(--sub);font-size:13px;margin-bottom:8px}.home-hero h2{font-size:25px;margin:0 0 22px;letter-spacing:.01em}.composer{height:260px;border-radius:22px;background:var(--card);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column}.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;font-size:17px;line-height:1.7}.composer textarea::placeholder{color:#c9c7cf}.composer-foot{display:flex;align-items:center;border-top:1px solid var(--line);padding-top:10px;color:var(--sub);font-size:12px}.composer-foot span{flex:1}.send{background:var(--pink);color:#fff;border-radius:18px;padding:8px 16px;font-weight:650}.feed{padding:0 16px 95px}.notice{width:100%;background:var(--card);border-radius:20px;padding:18px;margin:14px 0;box-shadow:var(--shadow);text-align:left}.notice strong{font-size:16px}.notice small{display:block;color:var(--sub);margin-top:7px}.badge{float:right;min-width:26px;height:26px;border-radius:13px;background:var(--pink);color:#fff;display:grid;place-items:center;padding:0 7px}.post{background:var(--card);border-radius:20px;padding:18px;margin:14px 0}.post time{color:var(--sub);font-size:12px}.post p{font-size:16px;line-height:1.65;margin:9px 0}.post .tools{display:flex;gap:18px;color:var(--sub);font-size:13px}
.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,var(--card) 96%,transparent);border-top:1px solid var(--line)}.nav button{font-size:23px;color:#a3a2a9}.nav button.on{color:var(--ink);font-weight:800}.dot{position:absolute;background:var(--pink);color:#fff;border-radius:12px;min-width:22px;height:22px;line-height:22px;font-size:11px;margin:-14px 0 0 -6px}
.top{height:58px;display:flex;align-items:center;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top b{font-size:20px;flex:1}.top button{padding:10px;color:var(--sub)}.list{padding:12px 14px 90px}.msg{width:100%;display:flex;gap:12px;align-items:center;background:var(--card);padding:14px 12px;border-bottom:1px solid var(--line);text-align:left}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,#dfeeff,#ffdce7);display:grid;place-items:center;font-weight:800;flex:none}.msg main{min-width:0;flex:1}.msg strong{display:block;font-size:15px}.msg small{display:block;color:var(--sub);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.msg time{font-size:11px;color:var(--sub)}
.profile-hero{height:470px;background:linear-gradient(180deg,#cfe8ff,#d6efcc 50%,rgba(245,244,248,.1) 78%,var(--bg));padding-top:76px;text-align:center;position:relative}.profile-tools{position:absolute;right:18px;top:52px;display:flex;gap:14px}.circlebtn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.55);font-size:22px}.bigavatar{width:116px;height:116px;border:6px solid rgba(255,255,255,.85);border-radius:50%;background:linear-gradient(135deg,#9ccaf8,#ffd6e7);margin:98px auto 14px;display:grid;place-items:center;font-size:36px;font-weight:800}.profile-hero h2{margin:0;font-size:25px}.profile-hero p{margin:8px 0;color:var(--sub)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-top:-55px;position:relative}.stat{background:var(--card);border-radius:19px;padding:18px}.stat b{font-size:25px}.stat small{display:block;color:var(--sub);margin-top:3px}.panel{background:var(--card);margin:12px 16px;border-radius:20px;padding:18px}.panel h3{margin:0 0 14px}.album{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.album i{aspect-ratio:1;border-radius:9px;background:linear-gradient(145deg,#fde7ed,#dcecff);display:block}.settings{min-height:100dvh;background:var(--card)}.setting{height:54px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--line);font-size:14px}.setting span{flex:1}.switch{width:44px;height:25px;border-radius:13px;background:#ccc;position:relative}.switch:after{content:"";position:absolute;width:21px;height:21px;background:#fff;border-radius:50%;left:2px;top:2px;transition:.2s}.switch.on{background:var(--pink)}.switch.on:after{left:21px}
.chat{position:fixed;inset:0;z-index:40;background:var(--bg);max-width:520px;margin:auto;display:flex;flex-direction:column}.chat-head{height:58px;background:var(--card);display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line)}.chat-head b{flex:1;text-align:center}.chat-body{flex:1;overflow:auto;padding:18px 12px}.bubble{max-width:78%;background:var(--bubble);padding:11px 14px;border-radius:18px;margin:8px 0;line-height:1.5}.bubble.me{margin-left:auto;background:var(--pink);color:#fff}.chat-send{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}.chat-send input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:22px;padding:10px 14px;outline:none}.resonance{position:fixed;inset:0;z-index:35;background:linear-gradient(150deg,#dae9ff,#f8def0 50%,var(--bg));max-width:520px;margin:auto;padding:20px;display:flex;flex-direction:column}.res-card{margin:auto 0;background:var(--card);border-radius:26px;padding:28px;text-align:center}.res-card p{font-size:21px;line-height:1.7}.res-actions{display:flex;gap:10px;justify-content:center}.secondary{border:1px solid var(--line);border-radius:22px;padding:11px 18px}.empty{text-align:center;color:var(--sub);padding:70px 20px;line-height:1.8}.toast{position:fixed;z-index:99;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border-radius:20px;padding:9px 15px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(min-width:700px){body{background:#ddd}.app{box-shadow:0 0 40px rgba(0,0,0,.15)}}
</style>
</head>
<body><div id="app" class="app"></div><div id="toast" class="toast"></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.116.0';
const sb=createClient('https://nvwdtfnhsyfdopaxdylx.supabase.co','sb_publishable_S4IE-ziO7WQ_JAK9tuQGgQ_cszwKBWB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const S={phase:'splash',mode:'login',user:null,profile:null,tab:'home',posts:[],res:[],chats:[],requests:[],chat:null,msgs:[],overlay:null,busy:false};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)};
document.documentElement.dataset.theme=localStorage.kehua_theme||'light';
function dateText(){const d=new Date();return (d.getMonth()+1).toString().padStart(2,'0')+'月'+d.getDate().toString().padStart(2,'0')+'日 星期'+'日一二三四五六'[d.getDay()]}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session){S.user=session.user;S.phase='app';await enter()}render();sb.auth.onAuthStateChange(async(_,x)=>{S.user=x?.user||null;if(S.user){S.phase='app';await enter()}else{S.phase='auth';reset()}render()})}
function reset(){S.profile=null;S.posts=[];S.res=[];S.chats=[];S.requests=[];S.chat=null;S.msgs=[]}
async function enter(){await ensureProfile();await refresh()}
async function ensureProfile(){let q=await sb.from('orig_profiles').select('*').eq('user_id',S.user.id).maybeSingle();if(!q.data){q=await sb.from('orig_profiles').insert({user_id:S.user.id,nickname:S.user.user_metadata?.nickname||'可话er'}).select().single()}S.profile=q.data}
async function refresh(){await Promise.all([loadPosts(),loadRes(),loadChats(),loadReq()])}
async function loadPosts(){const q=await sb.from('orig_posts').select('*').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(50);if(!q.error)S.posts=q.data||[]}
async function loadRes(){const q=await sb.from('orig_resonances').select('id,status,created_at,candidate_user_id,candidate_post_id,orig_posts!orig_resonances_candidate_post_id_fkey(id,content,created_at,user_id),orig_profiles!orig_resonances_candidate_user_id_fkey(user_id,nickname,bio)').eq('user_id',S.user.id).order('created_at',{ascending:false}).limit(50);if(!q.error)S.res=q.data||[]}
async function loadChats(){const q=await sb.from('orig_conversations').select('*').or('user_a.eq.'+S.user.id+',user_b.eq.'+S.user.id).order('created_at',{ascending:false});if(q.error){S.chats=[];return}const rows=q.data||[];const ids=[...new Set(rows.map(c=>c.user_a===S.user.id?c.user_b:c.user_a))];let ps=[];if(ids.length){const z=await sb.from('orig_profiles').select('user_id,nickname,bio').in('user_id',ids);ps=z.data||[]}S.chats=rows.map(c=>Object.assign({},c,{peer:ps.find(p=>p.user_id===(c.user_a===S.user.id?c.user_b:c.user_a))||{nickname:'可话er'}}))}
async function loadReq(){const q=await sb.from('orig_friend_requests').select('*').eq('to_user',S.user.id).eq('status','pending');if(!q.error)S.requests=q.data||[]}
async function auth(){const email=$('#email').value.trim(),password=$('#pass').value;if(!email||password.length<6)return toast('请填写邮箱和至少6位密码');S.busy=true;render();let q=S.mode==='register'?await sb.auth.signUp({email,password,options:{data:{nickname:'可话er'}}}):await sb.auth.signInWithPassword({email,password});S.busy=false;if(q.error){render();return toast(q.error.message)}if(S.mode==='register'&&!q.data.session){render();toast('验证邮件已发送，请完成验证后登录')}else toast('登录成功')}
async function publish(){const e=$('#composer'),v=e.value.trim();if(!v)return;S.busy=true;const q=await sb.from('orig_posts').insert({user_id:S.user.id,content:v});S.busy=false;if(q.error)return toast(q.error.message);e.value='';await loadPosts();await loadRes();render();toast('已经说出去了')}
async function openChat(id){S.chat=S.chats.find(c=>c.id===id)||{id,peer:{nickname:'可话er'}};const q=await sb.from('orig_messages').select('*').eq('conversation_id',id).order('created_at',{ascending:true});S.msgs=q.data||[];render();setTimeout(()=>{$('.chat-body')?.scrollTo(0,999999)},20)}
async function sendMsg(){const e=$('#msg'),body=e.value.trim();if(!body||!S.chat)return;const q=await sb.from('orig_messages').insert({conversation_id:S.chat.id,sender_id:S.user.id,body});if(q.error)return toast(q.error.message);e.value='';const x=await sb.from('orig_messages').select('*').eq('conversation_id',S.chat.id).order('created_at',{ascending:true});S.msgs=x.data||[];render()}
async function light(r){await sb.from('orig_resonances').update({status:'lit'}).eq('id',r.id);const pair=[S.user.id,r.candidate_user_id].sort();let q=await sb.from('orig_conversations').select('*').or('and(user_a.eq.'+pair[0]+',user_b.eq.'+pair[1]+'),and(user_a.eq.'+pair[1]+',user_b.eq.'+pair[0]+')').maybeSingle();if(!q.data){q=await sb.from('orig_conversations').insert({user_a:pair[0],user_b:pair[1]}).select().single()}await loadChats();S.overlay=null;await openChat(q.data.id)}
async function acceptReq(id,yes){const r=S.requests.find(x=>x.id===id);if(!r)return;await sb.from('orig_friend_requests').update({status:yes?'accepted':'rejected',updated_at:new Date().toISOString()}).eq('id',id);if(yes){const p=[r.from_user,r.to_user].sort();await sb.from('orig_friendships').insert({user_a:p[0],user_b:p[1]})}await loadReq();render()}
async function saveProfile(){const n=$('#nick').value.trim()||'可话er',bio=$('#bio').value.trim();const q=await sb.from('orig_profiles').update({nickname:n,bio,updated_at:new Date().toISOString()}).eq('user_id',S.user.id).select().single();if(!q.error){S.profile=q.data;S.overlay=null;render();toast('已保存')}}
function nav(){const n=S.res.filter(x=>x.status==='new').length+S.requests.length;return '<nav class="nav"><button data-tab="home" class="'+(S.tab==='home'?'on':'')+'">⌂'+(n?'<i class="dot">'+n+'</i>':'')+'</button><button data-tab="messages" class="'+(S.tab==='messages'?'on':'')+'">◯</button><button data-tab="me" class="'+(S.tab==='me'?'on':'')+'">♙</button></nav>'}
function splash(){return '<main class="splash"><div class="splash-logo">可话~!</div><div class="splash-sub">说想说的话</div><button id="enterAuth">手机号 / 邮箱登录</button></main>'}
function authView(){return '<main class="auth"><h1>可话</h1><p>说你想说的话</p><div class="mode"><button data-mode="register" class="'+(S.mode==='register'?'on':'')+'">第一次来</button><button data-mode="login" class="'+(S.mode==='login'?'on':'')+'">回来看看</button></div><input id="email" class="field" type="email" placeholder="邮箱"><input id="pass" class="field" type="password" placeholder="密码"><div class="status"></div><button id="authGo" class="go" '+(S.busy?'disabled':'')+'>'+(S.busy?'处理中…':S.mode==='register'?'进去':'登录')+'</button><div class="hint">同一账号可在手机、平板和电脑同步你的记录、共鸣、聊天和好友。</div></main>'}
function postCard(p){return '<article class="post"><time>'+new Date(p.created_at).toLocaleString('zh-CN')+'</time><p>'+esc(p.content)+'</p><div class="tools"><span>☼</span><span>◯</span><span>↗</span></div></article>'}
function home(){const fresh=S.res.filter(x=>x.status==='new');return '<section><div class="home-hero"><div class="date">'+dateText()+'</div><h2>此刻，说你想说的话～</h2><div class="composer"><textarea id="composer" maxlength="1000" placeholder="我想说..."></textarea><div class="composer-foot"><span>真实地说出来就好</span><button id="publish" class="send">发布</button></div></div></div><div class="feed">'+fresh.slice(0,5).map(r=>'<button class="notice" data-res="'+r.id+'"><span class="badge">1</span><strong>🔥 共鸣已到达，请签收～！</strong><small>'+esc(r.orig_posts?.content||'有人和你产生了共鸣')+'</small></button>').join('')+S.posts.map(postCard).join('')+'</div></section>'}
function messages(){let body='<header class="top"><b>消息</b><button id="refresh">刷新</button></header><div class="list">';if(S.requests.length)body+=S.requests.map(r=>'<div class="msg"><div class="avatar">+</div><main><strong>新的好友申请</strong><small>有人想和你成为好友</small></main><button data-accept="'+r.id+'">通过</button><button data-reject="'+r.id+'">拒绝</button></div>').join('');body+=S.chats.map(c=>'<button class="msg" data-chat="'+c.id+'"><div class="avatar">'+esc((c.peer?.nickname||'可')[0])+'</div><main><strong>'+esc(c.peer?.nickname||'可话er')+'</strong><small>'+esc(c.peer?.bio||'点开继续聊天')+'</small></main><time>›</time></button>').join('');if(!S.chats.length&&!S.requests.length)body+='<div class="empty">共鸣点亮以后，聊天会出现在这里。</div>';return body+'</div>'}
function me(){const p=S.profile||{};return '<section><div class="profile-hero"><div class="profile-tools"><button id="search" class="circlebtn">⌕</button><button id="settings" class="circlebtn">⚙</button></div><div class="bigavatar">'+esc((p.nickname||'可')[0])+'</div><h2>'+esc(p.nickname||'可话er')+'</h2><p>'+esc(p.city||'')+(p.city?' · ':'')+esc(p.bio||'今天也想好好生活。')+'</p></div><div class="stats"><div class="stat"><b>'+S.chats.length+'</b><small>好友</small></div><div class="stat"><b>'+S.posts.length+'</b><small>点亮的动态</small></div></div><div class="panel"><h3>查看 VIP 特权</h3></div><div class="panel"><h3>相册</h3><div class="album"><i></i><i></i><i></i><i></i></div></div><div class="panel">'+S.posts.slice(0,3).map(p=>'<div class="post" style="padding:0;margin:0 0 18px"><time>'+new Date(p.created_at).toLocaleString('zh-CN')+'</time><p>'+esc(p.content)+'</p></div>').join('')+'</div></section>'}
function settingsView(){return '<section class="settings"><header class="top"><button id="closeOverlay">‹</button><b style="text-align:center">设置</b><span style="width:40px"></span></header>'+['个人信息','账号与安全','消息管理'].map(x=>'<div class="setting"><span>'+x+'</span>›</div>').join('')+'<div class="setting"><span>深色模式</span><button id="theme" class="switch '+(document.documentElement.dataset.theme==='dark'?'on':'')+'"></button></div>'+['清理缓存','通用','隐私','关于可话'].map(x=>'<div class="setting"><span>'+x+'</span>›</div>').join('')+'<div class="setting"><button id="editProfile">编辑个人资料</button></div><div class="setting"><button id="logout" style="color:#d55">退出登录</button></div></section>'}
function editProfile(){const p=S.profile||{};return '<section class="settings"><header class="top"><button id="closeOverlay">‹</button><b style="text-align:center">个人信息</b><span style="width:40px"></span></header><div style="padding:24px"><input id="nick" class="field" value="'+esc(p.nickname||'')+'" placeholder="昵称"><input id="bio" class="field" value="'+esc(p.bio||'')+'" placeholder="简介"><button id="saveProfile" class="go">保存</button></div></section>'}
function resonance(r){return '<section class="resonance"><button id="closeOverlay" style="align-self:flex-start;font-size:28px">×</button><div class="res-card"><div style="color:var(--sub)">共鸣已到达，请签收～！</div><p>'+esc(r.orig_posts?.content||'有人和你产生了共鸣')+'</p><div class="res-actions"><button class="secondary" id="dismissRes">稍后</button><button class="send" id="lightRes">点亮</button></div></div></section>'}
function chat(){const c=S.chat;return '<section class="chat"><header class="chat-head"><button id="closeChat">‹</button><b>'+esc(c.peer?.nickname||'可话er')+'</b><span style="width:36px"></span></header><div class="chat-body">'+(S.msgs.length?S.msgs.map(m=>'<div class="bubble '+(m.sender_id===S.user.id?'me':'')+'">'+esc(m.body)+'</div>').join(''):'<div class="empty">说句话吧～</div>')+'</div><div class="chat-send"><input id="msg" maxlength="4000" placeholder="消息"><button id="sendMsg" class="send">发送</button></div></section>'}
function render(){if(S.phase==='splash'){app.innerHTML=splash();bind();return}if(S.phase==='auth'||!S.user){app.innerHTML=authView();bind();return}let v=S.tab==='home'?home():S.tab==='messages'?messages():me();app.innerHTML=v+nav()+(S.overlay==='settings'?settingsView():S.overlay==='edit'?editProfile():S.overlay?.type==='res'?resonance(S.overlay.r):'')+(S.chat?chat():'');bind()}
function bind(){
$('#enterAuth')?.addEventListener('click',()=>{S.phase='auth';render()});
document.querySelectorAll('[data-mode]').forEach(x=>x.addEventListener('click',()=>{S.mode=x.dataset.mode;render()}));
$('#authGo')?.addEventListener('click',auth);
document.querySelectorAll('[data-tab]').forEach(x=>x.addEventListener('click',()=>{S.tab=x.dataset.tab;S.chat=null;render()}));
$('#publish')?.addEventListener('click',publish);
$('#refresh')?.addEventListener('click',async()=>{await refresh();render()});
document.querySelectorAll('[data-chat]').forEach(x=>x.addEventListener('click',()=>openChat(x.dataset.chat)));
document.querySelectorAll('[data-res]').forEach(x=>x.addEventListener('click',()=>{const r=S.res.find(a=>a.id===x.dataset.res);if(r){S.overlay={type:'res',r};render()}}));
document.querySelectorAll('[data-accept]').forEach(x=>x.addEventListener('click',()=>acceptReq(x.dataset.accept,true)));
document.querySelectorAll('[data-reject]').forEach(x=>x.addEventListener('click',()=>acceptReq(x.dataset.reject,false)));
$('#settings')?.addEventListener('click',()=>{S.overlay='settings';render()});
$('#closeOverlay')?.addEventListener('click',()=>{S.overlay=null;render()});
$('#theme')?.addEventListener('click',()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.kehua_theme=n;render()});
$('#editProfile')?.addEventListener('click',()=>{S.overlay='edit';render()});
$('#saveProfile')?.addEventListener('click',saveProfile);
$('#logout')?.addEventListener('click',()=>sb.auth.signOut());
$('#closeChat')?.addEventListener('click',()=>{S.chat=null;render()});
$('#sendMsg')?.addEventListener('click',sendMsg);
$('#lightRes')?.addEventListener('click',()=>{if(S.overlay?.r)light(S.overlay.r)});
$('#dismissRes')?.addEventListener('click',async()=>{if(S.overlay?.r)await sb.from('orig_resonances').update({status:'dismissed'}).eq('id',S.overlay.r.id);S.overlay=null;await loadRes();render()});
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}boot();
</script>
</body></html>
