<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#F4F3F8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="说想说的话" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/static/style.css" />
  <title>说想说的话</title>
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-brand">
    <div class="brand-title">说想说的话<span class="brand-caret"></span></div>
    <p>记录你真实的想法和感受</p>
  </div>
  <form id="authForm" class="auth-card">
    <div class="auth-switch"><button type="button" class="active" data-auth-mode="register">第一次来</button><button type="button" data-auth-mode="login">回来看看</button></div>
    <label><span>名字</span><input id="authUsername" autocomplete="username" maxlength="24" placeholder="3–24 位字母、数字或下划线" /></label>
    <label><span>密码</span><input id="authPassword" type="password" autocomplete="new-password" maxlength="72" placeholder="至少 6 位" /></label>
    <p id="authError" class="auth-error"></p>
    <button id="authSubmit" class="auth-submit" type="submit">进去</button>
    <button id="guestEnter" class="guest-enter" type="button">先匿名进去</button>
    <small>没有手机号、关注数和公开广场。你说的话只会去寻找共鸣。</small>
  </form>
</div>

<main id="app" class="app-shell hidden-app">
  <section id="home" class="page active">
    <header class="home-head">
      <h1>此刻，<br>有什么想说～</h1>
    </header>

    <div class="composer" id="composer">
      <textarea id="postInput" maxlength="1200" placeholder="写下你真实的想法和感受"></textarea>
      <div id="imagePreviewWrap" class="image-preview-wrap hidden"><img id="imagePreview" alt="准备发布的图片"/><button id="removeImage" aria-label="移除图片">×</button></div>
      <div class="composer-foot">
        <label class="photo-btn" aria-label="添加图片"><input id="postImage" type="file" accept="image/*"/><span>＋ 图片</span></label>
        <div class="composer-right"><span id="charCount">0/1200</span><button id="publishBtn" class="publish-text">发布</button></div>
      </div>
    </div>

    <p id="homeNotice" class="home-notice hidden"></p>
    <div id="posts" class="posts"></div>
  </section>

  <section id="messages" class="page">
    <header class="simple-head"><h2>消息</h2></header>
    <div id="friendStrip" class="friend-strip hidden"></div>
    <div id="incomingRequests" class="request-list"></div>
    <div id="notificationList" class="notification-list"></div>
    <div id="conversationList" class="conversation-list"></div>
  </section>

  <section id="me" class="page me-page">
    <header class="simple-head me-head"><span></span><h2>我</h2><button id="settingsBtn" class="more-btn" aria-label="设置">•••</button></header>
    <div class="profile-overview">
      <label class="avatar large" id="myAvatar"><input id="avatarInput" type="file" accept="image/*"/></label>
      <input id="nickname" class="nickname-input" maxlength="20" aria-label="昵称" />
      <textarea id="bio" class="bio-input" maxlength="120" rows="1" placeholder="写一句关于自己"></textarea>
      <button id="saveProfile" class="quiet-action">保存</button>
    </div>
    <div class="profile-tabs"><button class="selected" data-profile-tab="published">发布</button><button data-profile-tab="lit">点亮</button></div>
    <div id="myArchive" class="archive"></div>
  </section>

  <nav class="tabbar" aria-label="主导航">
    <button data-tab="home" class="active"><span class="tab-icon home-icon"></span><em>首页</em></button>
    <button data-tab="messages"><span class="tab-icon message-icon"></span><em>消息</em><i id="messageDot" class="red-dot hidden"></i></button>
    <button data-tab="me"><span class="tab-icon me-icon"></span><em>我</em></button>
  </nav>
</main>

<section id="resonancePage" class="subpage" aria-hidden="true">
  <header class="sub-head"><button class="back-btn" data-close="resonancePage">‹</button><b>共鸣</b><span id="resonanceProgress"></span></header>
  <div class="resonance-stage" id="resonanceStage">
    <small id="demoBadge" class="demo-badge hidden">演示内容，不是真人</small>
    <div class="resonance-copy"><p id="resonanceBody"></p><img id="resonanceImage" class="resonance-image hidden" alt="共鸣图片"/></div>
    <div id="revealedUser" class="revealed-user hidden"></div>
  </div>
  <footer class="resonance-footer"><button id="skipBtn" class="skip-btn">略过</button><button id="lightBtn" class="light-btn">点亮</button></footer>
</section>

<section id="chatPage" class="subpage" aria-hidden="true">
  <header class="sub-head chat-head"><button class="back-btn" data-close="chatPage">‹</button><button id="chatProfileBtn" class="chat-title"><b id="chatName"></b><small id="chatBio"></small></button><span></span></header>
  <div id="chatMessages" class="chat-messages"></div>
  <footer class="chat-compose"><textarea id="chatInput" rows="1" maxlength="2000" placeholder="说点什么"></textarea><button id="sendChat">发送</button></footer>
</section>

<section id="profilePage" class="subpage" aria-hidden="true">
  <header class="sub-head"><button class="back-btn" data-close="profilePage">‹</button><b>TA</b><button id="profileMenuBtn" class="tiny-more">•••</button></header>
  <div class="other-profile">
    <div class="avatar xl" id="otherAvatar"></div>
    <h3 id="otherName"></h3><p id="otherBio"></p>
    <button id="friendBtn" class="friend-btn">加为好友</button>
    <p class="profile-privacy">你们从一次共鸣里看见了彼此。</p>
  </div>
</section>

<section id="settingsPage" class="subpage" aria-hidden="true">
  <header class="sub-head"><button class="back-btn" data-close="settingsPage">‹</button><b>设置</b><span></span></header>
  <div class="settings-list"><button id="logoutBtn">退出当前账号</button><p>这里没有公开主页推荐、关注榜或热度排行。</p></div>
</section>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="sheet-panel"><button id="blockUserBtn">屏蔽这个人</button><button id="reportUserBtn">举报</button><button id="closeSheet">取消</button></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
<script src="/static/auth-fix.js"></script>
</body>
</html>
